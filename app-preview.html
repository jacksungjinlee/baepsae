미국 종목을 시장별로 비교해 순위를 매겨요."},{title:"비중까지 정하기",body:"한 업종에 몰리지 않도록 비중을 나누고, 살 주식 수까지 계산해요."},{title:"규칙으로 점검하기",body:"종목마다 매도 조건과 계속 지켜져야 할 조건을 정해 두고, 매일 종가와 새로 나온 실적으로 확인해요."},{title:"움직인 이유 보기",body:"주가가 크게 움직인 날에는 같은 업종 종목과 비교해, 업종 전체가 함께 움직였는지 보여 줘요."}]},who:{title:"누구를 위한 도구인가요",intro:"주식에 직접 투자하는 모든 개인 투자자를 위해 만들었어요.",items:["뉴스나 주변 추천으로 샀다가, 언제 팔지 몰라 고민해 본 분","수익률은 매일 보지만, 왜 샀는지는 따로 적어 두지 않은 분","보유 종목을 감이 아니라 숫자와 규칙으로 관리하고 싶은 분","단기 수익보다 오래 지킬 수 있는 투자 원칙을 세우고 싶은 분"]},why:{title:"왜 만들었나요",body:["뱁새는 제가 직접 투자할 때 쓰던 방법에서 시작했어요. 사기 전에 기준을 정하고, 산 뒤에는 미리 정한 규칙으로 판단하는 방법이에요.","가족과 친구들도 이 방법을 쓰고 싶어 했어요. 하지만 일반 증권사 앱에는 이런 기능이 없었고, 샤프 지수나 베타 같은 용어는 어렵게 느껴졌어요.","그래서 복잡한 계산은 뱁새가 맡고, 사용자는 기준과 결과에만 집중할 수 있는 도구로 만들었어요."]},principles:{title:"투자 원칙",items:[{title:"위험에는 그만한 보상이 따라야 해요.",body:"같은 수익이라면 덜 흔들린 투자가 더 좋은 투자예요. 그래서 감수한 위험 한 단위당 얼마를 벌었는지 보여 주는 샤프 지수를 중요하게 봐요."},{title:"기준이 먼저, 종목은 그다음이에요.",body:"사기 전에 기준을 정하고, 산 뒤에는 기분이 아니라 규칙으로 판단해요."},{title:"레버리지와 공매도는 다루지 않아요.",body:"둘 다 정당한 투자 수단이지만, 원금보다 큰 손실이 날 수 있어요. 일반 개인 투자자에게는 감수하는 위험에 비해 보상이 충분하지 않다고 봐서, 뱁새는 사서 보유하는 투자만 다뤄요."}]},run:{title:"이렇게 운영해요",items:["거래일마다 종가와 공시 자료로 모든 숫자를 새로 계산하고, 숫자마다 기준일과 출처를 함께 적어요.","종목을 추천하거나 목표 주가를 제시하지 않아요. 판단에 필요한 숫자와 근거를 보여 드리고, 결정은 직접 내리실 수 있게 도와요.","광고, 유료 서비스, 회원 가입이 없어요. 내 포트폴리오 기록은 지금 쓰는 기기에만 저장돼요."]},name:{title:"이름 이야기",body:["뱁새라는 이름은 ‘뱁새가 황새 따라가다 가랑이 찢어진다’는 속담에서 왔어요. 속담 때문에 욕심 많은 작은 새로 알려졌지만, 실제 뱁새는 일 년 내내 우리나라에 머무는 텃새예요. 계절마다 옮겨 다니는 철새와 달리, 덤불 속에 튼튼한 둥지를 짓고 살아요. 유행을 따라 종목을 옮겨 다니지 않고, 내 기준으로 고른 종목을 오래 지키자는 뜻을 담았어요. 마스코트 뱁이도 이 뱁새에서 이름을 따왔어요."]},maker:{title:"뱁새를 만든 사람",name:"이성진",role:"사업 개발 · 전략 · 투자 검토",photoAlt:"이성진 사진",edu:{label:"학력",value:"INSEAD MBA"},career:{label:"경력 · 게임·엔터테인먼트 업계 6~7년",items:[{org:"Navi Games Agency",what:"게임 사업 개발 컨설팅"},{org:"넵튠",note:"카카오게임즈 자회사",what:"사업 개발, 전략, 투자 검토"},{org:"TimeTree",note:"도쿄",what:"글로벌 서비스 운영, 해외 시장 진출"}]},built:{label:"서비스를 만들며",items:["다양한 개인 투자자들의 의견을 듣고 서비스 방향을 정했어요.","INSEAD에서 배운 자산운용, 기업가치 평가, 헤지펀드, 통계 수업을 바탕으로 기준 카드, 비중 계산, 매일 점검 규칙까지 투자 로직을 직접 설계했어요.","공시와 종가를 매일 자동으로 모으고, 잘못된 숫자가 보이지 않게 검증하는 데이터 체계를 만들었어요."]},langs:{label:"언어",value:"한국어 · 영어 · 일본어"},linkedIn:"LinkedIn"}},en:{hero:{name:"뱁새",descriptor:"Build a portfolio on your own criteria",catch:"Don't hop from trend to trend"},figures:{stocks:"stocks covered",groups:"industry groups",refresh:"Every trading day data refresh"},what:{title:"What Baepsae is",intro:"Baepsae is an investing tool that finds stocks matching your own criteria, builds a portfolio from them, and checks it against your rules every day.",data:"Every trading day, fresh data for more than {n} Korean and US stocks comes in, and a carefully designed rule-based algorithm finds the stocks and weights that fit your criteria. Each stock shows its supporting figures, so you can see exactly why it was picked.",items:[{title:"Pick by criteria",body:"Spread points across criteria cards such as value, dividends, growth and profitability, and Baepsae ranks Korean and US stocks within each market."},{title:"Set the weights",body:"Weights are spread so that no single industry dominates, down to the number of shares to buy."},{title:"Check by rules",body:"Each holding gets sell conditions and conditions that must keep holding true, checked every day against closing prices and newly reported results."},{title:"See why it moved",body:"On a big move, the stock is compared with its industry peers to show whether the whole industry moved with it."}]},who:{title:"Who it is for",intro:"Every individual investor who buys stocks directly.",items:["People who bought on a tip and never knew when to sell","People who check returns daily but never wrote down why they bought","People who want to manage holdings by numbers and rules, not gut feeling","People who want principles they can keep for decades rather than quick gains"]},why:{title:"Why I built it",body:["Baepsae started as the method I use for my own investing: set the criteria before buying, and judge only by pre-set rules afterwards.","Family and friends wanted to use it too, but ordinary brokerage apps offer nothing like it, and terms such as the Sharpe ratio and beta put most people off.","So Baepsae does the heavy calculation, and users can focus on their criteria and the results."]},principles:{title:"What I believe about investing",items:[{title:"Risk should be paid for.",body:"For the same return, the steadier investment is the better one. That is why I put weight on the Sharpe ratio, which shows how much return each unit of risk earned."},{title:"Criteria first, stocks second.",body:"Set the criteria before buying; afterwards, judge by rules, not mood."},{title:"No leverage or short selling.",body:"Both are legitimate tools, but losses can exceed what you put in. For most individual investors the reward does not justify that risk, so Baepsae covers buying and holding only."}]},run:{title:"How it is run",items:["Every trading day, all numbers are recalculated from closing prices and filings, and each one shows its date and source.","No stock tips or target prices. Baepsae shows the numbers and the reasoning; the decision is yours.","No ads, no paid tier, no sign-up. Your portfolio records stay on your own device."]},name:{title:"The name",body:["The 뱁새 (vinous-throated parrotbill) is the small bird in a Korean proverb about overreaching. The real 뱁새, though, stays in Korea all year and builds sturdy nests, unlike migratory birds that move with the seasons. The name stands for that: don't hop from trend to trend; pick by your own criteria and hold. The mascot, 뱁이, is named after it."]},maker:{title:"The person behind Baepsae",name:"Jack (Sung Jin) Lee",role:"Business development · Strategy · Investment screening",photoAlt:"Photo of Jack (Sung Jin) Lee",edu:{label:"Education",value:"INSEAD MBA"},career:{label:"Experience · 6–7 years in games and entertainment",items:[{org:"Navi Games Agency",what:"Business development consulting for games"},{org:"Neptune",note:"a Kakao Games subsidiar
