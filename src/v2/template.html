  html, body { margin: 0; background: var(--bs-page); color: var(--bs-ink); -webkit-text-size-adjust: 100%; }

  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; }
  button:focus-visible, [role="button"]:focus-visible, [role="switch"]:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--bs-ink); outline-offset: 2px; }
  [data-initial]::before { content: attr(data-initial); }
