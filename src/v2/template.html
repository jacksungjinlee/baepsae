<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F3EF">
<title>/*TITLE*/</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/pretendard/pretendard-variable.css">
<style>
  html, body { margin: 0; background: #F5F3EF; color: #1C2B45; -webkit-text-size-adjust: 100%; }
  body { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; overflow-x: hidden; word-break: keep-all; overflow-wrap: break-word; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; }
  button:focus-visible, [role="button"]:focus-visible, [role="switch"]:focus-visible, input:focus-visible { outline: 2px solid #C97757; outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script>/*BUNDLE*/</script>
<script>
// Service worker (sw.js, v17.5): network first, cache only offline. Skipped where unsupported or on plain http (except local).
(function(){try{
  if(!("serviceWorker" in navigator))return;
  var h=location.hostname;
  if(location.protocol!=="https:"&&h!=="localhost"&&h!=="127.0.0.1")return;
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
}catch(e){}})();
</script>
</body>
</html>
