name: 시세 데이터 갱신

on:
  schedule:
    # UTC 21:30 = 한국시간 06:30. 실제로는 GitHub 사정으로 08~11시쯤 시작해요.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # 버튼으로 직접 실행할 수도 있습니다
    inputs:
      dry_run:
        description: "시험 실행: 데이터를 만들고 검사까지만 해요. 커밋하지 않아요"
        type: boolean
        default: false
      dart:
        description: "DART: cache = 보관된 결과 + 빠진 것만 (기본) · full = 전부 다시 (하루 한 번만) · off = 시험용 (main 불가)"
        type: choice
        options: ["cache", "full", "off"]
        default: cache
      bootstrap:
        description: "첫 실행 한 번만: 직전 발행본과의 비교를 건너뛰어요 (직전 파일이 망가졌을 때)"
        type: boolean
        default: false
      prev_ref:
        description: "시험용: 직전 발행본 대신 비교할 커밋 (main 불가)"
        type: string
        default: ""
      selftest:
        description: "시험용: corrupt-price = 삼성전자 가격을 일부러 틀리게 (검사가 막는지 확인, main 불가)"
        type: choice
        options: ["none", "corrupt-price"]
        default: none

permissions:
  contents: write

concurrency:
  # 같은 그룹에서는 '대기 중' 실행이 하나만 남아요(새로 들어오면 이전 대기분이 취소됨).
  # 시험 실행이 매일 실행을 밀어내지 않도록 그룹을 따로 둡니다.
  group: update-data-${{ inputs.dry_run && 'dry' || 'live' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 안전망. 평소 목표는 45분 이하 (DART 캐시 덕분)
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      DART_MODE: ${{ inputs.dart || 'cache' }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      PREV_REF: ${{ inputs.prev_ref }}
      SELFTEST: ${{ inputs.selftest || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - name: 입력 확인
        run: |
          echo "· 브랜치 $GITHUB_REF_NAME · 시험 실행 ${DRY_RUN:-false} · DART $DART_MODE · bootstrap ${BOOTSTRAP:-false} · 비교 커밋 ${PREV_REF:-HEAD} · selftest $SELFTEST"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$DART_MODE" = "off" ] || [ -n "$PREV_REF" ] || [ "$SELFTEST" != "none" ]; then
              echo "!! 시험용 입력(dart=off · prev_ref · selftest)은 main 에서 쓸 수 없어요"
              exit 1
            fi
          fi
          if [ "$BOOTSTRAP" = "true" ]; then
            echo "!! bootstrap: 직전 발행본과의 비교를 건너뛰어요. 첫 실행 한 번만 써야 해요."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DART 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .dart-cache
          key: dart-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dart-cache-v1-

      - name: 데이터 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          # 종목 목록 파일의 커밋 시각(최종본 여부)을 GitHub API로 확인할 때 씁니다
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$SELFTEST" != "none" ]; then export BAEPSAE_SELFTEST="$SELFTEST"; fi
          python fetch_data.py

      # 실패해도 그때까지 받은 DART 결과는 남겨야 다음 실행이 한도를 다시 쓰지 않아요.
      # always() 는 캐시 저장에만 씁니다 (발행·커밋에는 절대 쓰지 않아요).
      - name: DART 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dart-cache
          key: dart-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 시험 실행 결과 파일 보관
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-data
          path: |
            data.json
            corp.json
            disc.json
            macro.json
          retention-days: 7

      - name: 발행 관문 (validate_data.py)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=""
          if [ "$BOOTSTRAP" = "true" ]; then args="$args --bootstrap"; fi
          if [ -n "$PREV_REF" ]; then
            git fetch --depth=1 origin "$PREV_REF"
            args="$args --prev-ref FETCH_HEAD"
          fi
          python validate_data.py $args

      - name: 커밋 & 푸시
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "!! 데이터 커밋은 main 에서만 해요 (지금: $GITHUB_REF_NAME)"
            exit 1
          fi
          git config user.name  "baepsae-bot"
          git config user.email "actions@github.com"
          git add data.json corp.json disc.json macro.json
          git diff --staged --quiet && echo "변경 없음" || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
