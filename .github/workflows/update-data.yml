name: 시세 데이터 갱신

on:
  schedule:
    # UTC 21:30 = 한국시간 06:30 (한국 장 마감 다음 날 아침, 미국 장 마감 후)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # 버튼으로 직접 실행할 수도 있습니다

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 데이터 수집
        env:
          # OpenDART 키를 저장소 Secret 으로 넣어두면 한국 기업 재무지표까지 받아옵니다.
          # 없어도 나머지는 정상 동작합니다.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python fetch_data.py

      - name: 결과 확인
        run: |
          test -s data.json || (echo "data.json 이 비어 있습니다" && exit 1)
          python -c "import json;d=json.load(open('data.json'));print('종목 수:',len(d['stocks']),'· 기준일:',d['asOf'])"
          test -s corp.json || (echo "corp.json 이 비어 있습니다" && exit 1)
          python -c "import json;d=json.load(open('corp.json'));print('기업분석:',len(d['companies']),'개사 ·',len(d['sectors']),'개 업종')"

      - name: 커밋 & 푸시
        run: |
          git config user.name  "baepsae-bot"
          git config user.email "actions@github.com"
          git add data.json corp.json
          git diff --staged --quiet && echo "변경 없음" || git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
