name: 시세 데이터 갱신
# v17.6: 시험 실행은 목록에서 '시험 실행'이 붙어요. 감시(watchdog.py)가 이 표시로 시험 실행을 빼고 실제 실행만 봐요.
# 다른 실행의 제목은 지금과 같아요 ('시세 데이터 갱신' — 매일 09:13 점검이 보는 이름 그대로).
run-name: ${{ inputs.dry_run && '시세 데이터 갱신 · 시험 실행' || '시세 데이터 갱신' }}

on:
  schedule:
    # v17.5.3: GitHub 의 정해진 시각 실행은 10월 내내 2시간 15분 ~ 5시간 30분 늦게 시작했어요 (06:30 예정 → 08:44 ~ 12:00).
    # 그래서 새벽부터 여러 번 걸어 둬요. check 단계(already_published.py)가
    #   - 미국 종가 확정(뉴욕 16:30 = 겨울 06:30 · 여름 05:30 KST) 전에 시작한 실행은 확정 + 3분까지 기다렸다가 실행하고,
    #   - 이미 발행된 뒤에 시작한 실행은 DART·캐시·데이터 수집 전에 끝내요.
    # 정각·30분은 GitHub 이 가장 붐벼서 피해요. UTC 15:00 뒤는 한국 날짜가 하루 넘어가서 요일 칸이 달라요.
    # 한국 시각: 03:47 · 05:13 · 06:43 · 08:17 (화~토) · 10:53 · 13:37 (월~토). 휴장일은 거래일 달력으로 판단해요:
    # 데이터가 이미 마지막 거래일까지 들어와 있으면 그날 실행은 모두 데이터 수집 전에 끝나요 (월요일은 보통 그래요).
    - cron: "47 18 * * 1-5"
    - cron: "13 20 * * 1-5"
    - cron: "43 21 * * 1-5"
    - cron: "17 23 * * 1-5"
    - cron: "53 1 * * 1-6"
    - cron: "37 4 * * 1-6"
  workflow_dispatch:        # 버튼으로 직접 실행할 수도 있습니다
    inputs:
      dry_run:
        description: "시험 실행: 데이터를 만들고 검사까지만 해요. 커밋하지 않아요"
        type: boolean
        default: false
      dart:
        description: "DART: cache = 보관된 결과 + 빠진 것만 (기본) · full = 전부 다시 (하루 한 번만) · off = 시험용 (main 불가)"
        type: choice
        options: ["cache", "full", "off"]
        default: cache
      bootstrap:
        description: "첫 실행 한 번만: 직전 발행본과의 비교를 건너뛰어요 (직전 파일이 망가졌을 때)"
        type: boolean
        default: false
      prev_ref:
        description: "시험용: 직전 발행본 대신 비교할 커밋 (main 불가)"
        type: string
        default: ""
      sample:
        description: "시험용: 국내 종목을 필수 종목 + 시가총액 상위 N개로 줄여요 (DART 호출 아끼기 · 시험 실행에서만, main 불가). 0 = 전체"
        type: string
        default: "0"
      selftest:
        description: "시험용: corrupt-price = 삼성전자 가격을 일부러 틀리게 (검사가 막는지 확인, main 불가)"
        type: choice
        options: ["none", "corrupt-price"]
        default: none
      timer:
        description: "바깥 타이머(cron-job.org)만 켜요: 정해진 시각 실행과 똑같이 — 이미 발행됐으면 끝내고, DART 는 보관된 결과만 (빈 캐시면 멈춤), main 만"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 같은 그룹에서는 '대기 중' 실행이 하나만 남아요(새로 들어오면 이전 대기분이 취소됨).
  # 시험 실행이 매일 실행을 밀어내지 않도록 그룹을 따로 둡니다.
  group: update-data-${{ inputs.dry_run && 'dry' || 'live' }}
  cancel-in-progress: false

jobs:
  # v17.5.3: 정해진 시각 실행은 아침에 여러 번 걸려 있어요. 오늘 아침 데이터가 이미 발행됐으면 여기서 끝나고 update 는 건너뛰어요
  # (DART·데이터 수집 전이라 DART 호출이 없어요). 수동 실행은 확인하지 않아요. 확인을 못 하면 '발행 안 됨'으로 보고 실행해요.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 180     # 미국 종가 확정까지 최대 170분 기다려요 (already_published.MAX_WAIT)
    permissions:
      contents: read         # 확인만 해요 (커밋·푸시 없음)
    outputs:
      skip: ${{ steps.already.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - name: 아침 데이터가 이미 발행됐는지 · 미국 종가 확정 전이면 기다리기 (정해진 시각 · 바깥 타이머 실행만)
        id: already
        run: |
          # v17.5.5: 바깥 타이머(cron-job.org, workflow_dispatch + timer=true)도 정해진 시각 실행과 똑같이 확인해요 (Jack, 2026-11-04)
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.timer }}" != "true" ]; then
            echo "· 정해진 시각 실행이 아니에요 (${{ github.event_name }}) → 확인 없이 실행해요"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 already_published.py \
            || { echo "!! 확인 스크립트가 실패했어요 → 실행해요"; echo "skip=false" >> "$GITHUB_OUTPUT"; }

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    # 고정: ubuntu-latest 는 GitHub 사정으로 바뀌어요(2026-10 에 이미 26.04). 바꿀 때는 dry_run 으로 확인한 뒤에.
    runs-on: ubuntu-24.04
    timeout-minutes: 300   # 안전망. 평소 목표는 45분 이하 (DART 캐시 덕분)
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      DART_MODE: ${{ inputs.dart || 'cache' }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      PREV_REF: ${{ inputs.prev_ref }}
      SELFTEST: ${{ inputs.selftest || 'none' }}
      SAMPLE_KR: ${{ inputs.sample || '0' }}
      TIMER: ${{ inputs.timer || false }}
    steps:
      # 정해진 시각 실행은 만들어질 때의 커밋에 묶여 있어요. 기다리는 동안 다른 실행이 발행했을 수 있어서 지금의 main 을 받아요
      # (관문의 '직전 발행본' 비교와 커밋 단계가 최신 main 위에서 돌게). 수동 실행은 기본값(그 실행의 커밋) 그대로예요.
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.timer) && 'main' || '' }}

      - name: 입력 확인
        run: |
          echo "· 브랜치 $GITHUB_REF_NAME · 시험 실행 ${DRY_RUN:-false} · DART $DART_MODE · bootstrap ${BOOTSTRAP:-false} · 비교 커밋 ${PREV_REF:-HEAD} · selftest $SELFTEST · 표본 $SAMPLE_KR"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$DART_MODE" = "off" ] || [ -n "$PREV_REF" ] || [ "$SELFTEST" != "none" ] || [ "$SAMPLE_KR" != "0" ]; then
              echo "!! 시험용 입력(dart=off · prev_ref · selftest · sample)은 main 에서 쓸 수 없어요"
              exit 1
            fi
          fi
          # v17.5.5: 바깥 타이머 실행은 main 에서 보관된 DART 결과만 써요 — 전체 DART · 시험용 입력은 받지 않아요 (Jack, 2026-11-04)
          if [ "$TIMER" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$DART_MODE" != "cache" ] || [ "$DRY_RUN" = "true" ] || [ "$BOOTSTRAP" = "true" ] \
               || [ -n "$PREV_REF" ] || [ "$SELFTEST" != "none" ] || [ "$SAMPLE_KR" != "0" ]; then
              echo "!! 바깥 타이머 실행은 main · dart=cache 만 돼요 (전체 DART · 시험 실행 · 시험용 입력 없음)"
              exit 1
            fi
            echo "· 바깥 타이머 실행: 정해진 시각 실행과 같은 규칙 (이미 발행됐으면 끝 · 빈 DART 캐시면 멈춤)"
          fi
          if [ "$SAMPLE_KR" != "0" ] && [ "$DRY_RUN" != "true" ]; then
            echo "!! sample(표본)은 시험 실행(dry_run=true)에서만 써요 — 표본 데이터는 발행하면 안 돼요"
            exit 1
          fi
          if [ "$BOOTSTRAP" = "true" ]; then
            echo "!! bootstrap: 직전 발행본과의 비교를 건너뛰어요. 첫 실행 한 번만 써야 해요."
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DART 캐시 불러오기
        id: dart_cache
        uses: actions/cache/restore@v6
        with:
          path: .dart-cache
          key: dart-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dart-cache-v1-

      # v17.5.3: 정해진 시각 실행이 여러 번이라, 캐시가 없을 때 그대로 가면 하루에 전체 DART 실행이 여러 번 될 수 있어요.
      # 빈 캐시로 시작하는 DART 실행은 하루 한 번, 사람이(또는 Claude 가 규칙대로) 수동으로만 해요 (CLAUDE.md).
      - name: DART 캐시 확인 (정해진 시각 실행은 빈 캐시로 시작하지 않아요)
        if: github.event_name == 'schedule' || inputs.timer
        run: |
          if [ -z "${{ steps.dart_cache.outputs.cache-matched-key }}" ] || [ ! -s .dart-cache/dart-v1.json.gz ]; then
            echo "!! DART 캐시가 없어요. 빈 캐시로 시작하면 전체 DART 실행이에요 (한국 날짜로 하루 한 번만, 수동으로)."
            echo "!! 위 '캐시 불러오기' 로그에 'Failed to restore' 가 있으면 GitHub 캐시 쪽 장애예요: 전체 실행 말고 잠시 뒤 다시 실행해 주세요."
            echo "!! 정해진 시각 실행은 여기서 멈춰요: 오늘 전체 DART 실행이 아직 없었으면 수동 실행을 한 번 해 주세요."
            exit 1
          fi
          echo "· DART 캐시: ${{ steps.dart_cache.outputs.cache-matched-key }}"

      - name: 데이터 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          # 종목 목록 파일의 커밋 시각(최종본 여부)을 GitHub API로 확인할 때 씁니다
          GITHUB_TOKEN: ${{ github.token }}
          # v17.5.5: 정해진 시각 · 바깥 타이머 실행 = '자동 실행' — fetch_data.py 도 빈 DART 캐시면 DART 호출 전에 멈춰요
          BAEPSAE_AUTO_RUN: ${{ (github.event_name == 'schedule' || inputs.timer) && '1' || '' }}
        run: |
          if [ "$SELFTEST" != "none" ]; then export BAEPSAE_SELFTEST="$SELFTEST"; fi
          python fetch_data.py

      # 실패해도 그때까지 받은 DART 결과는 남겨야 다음 실행이 한도를 다시 쓰지 않아요.
      # always() 는 캐시 저장에만 씁니다 (발행·커밋에는 절대 쓰지 않아요).
      - name: DART 캐시 저장
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .dart-cache
          key: dart-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 시험 실행 결과 파일 보관
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-data
          path: |
            data.json
            corp.json
            disc.json
            macro.json
          retention-days: 7

      - name: 발행 관문 (validate_data.py)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=""
          if [ "$BOOTSTRAP" = "true" ]; then args="$args --bootstrap"; fi
          if [ -n "$PREV_REF" ]; then
            git fetch --depth=1 origin "$PREV_REF"
            args="$args --prev-ref FETCH_HEAD"
          fi
          python validate_data.py $args
          # v17.6: 여기까지 왔으면 PASS 예요 (실패하면 위 줄에서 단계가 멈춰요). 통과한 네 파일의 영수증 — 커밋 단계가 확인해요.
          sha256sum data.json corp.json disc.json macro.json > "$RUNNER_TEMP/gate-pass.sha256"

      - name: 커밋 & 푸시
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "!! 데이터 커밋은 main 에서만 해요 (지금: $GITHUB_REF_NAME)"
            exit 1
          fi
          # v17.6: 관문을 통과한 바로 그 네 파일인지 영수증으로 확인해요 (없거나 다르면 멈춰요)
          sha256sum --quiet --strict -c "$RUNNER_TEMP/gate-pass.sha256"
          git config user.name  "baepsae-bot"
          git config user.email "actions@github.com"
          git add data.json corp.json disc.json macro.json
          git diff --staged --quiet && echo "변경 없음" || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      # v17.6 Part 3a: main 에 올린 같은 네 파일을 data 브랜치에도 올려요. 사이트 배포(deploy.yml)가 여기서 가져가요.
      # data 브랜치가 없으면(이 버전의 첫 발행) 네 파일만 담아 새로 만들어요. 관문 영수증이 없거나 다르면 멈춰요. 강제 푸시는 안 해요.
      # (매일 09:13 점검은 위 '커밋 & 푸시' 단계로 발행한 실행을 찾아요 — 그 이름은 그대로예요.)
      - name: data 브랜치에 올리기
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "!! 데이터는 main 에서만 올려요 (지금: $GITHUB_REF_NAME)"
            exit 1
          fi
          bash tools/push_data_branch.sh "$RUNNER_TEMP/gate-pass.sha256"
