name: ci
# v17.6 Part 2: PR 마다 (그리고 main 에 들어올 때마다) 빌드 · 테스트 · 휴대폰 크기 스모크 테스트를 돌려요.
# 2026-11-11 (Jack): 한 기계에서 16분 걸려 20분 한도에 자주 걸렸어요 → 검사를 여러 기계(job)로 나눠 동시에 돌려요. 검사 내용은 그대로예요.
# 마지막 job 'ci' 가 main 보호 규칙(v17.6 Part 3c)에서 '통과해야 머지되는 검사'예요 — 이름을 바꾸지 마세요. 그 job 은 다른 모든 job 이
# 성공으로 끝났을 때만 초록이에요 (실패 · 취소 · 건너뜀은 모두 빨강).
# 데이터 커밋 · 배포 · 비밀 값(DART · ECOS)은 쓰지 않아요 (읽기 권한만).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 PR 에 새 커밋이 오면 이전 검사는 멈춰요 (main 은 하나씩 끝까지)
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: 빌드 · pytest · 글자 점검
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 브라우저는 보관본에서 (매일 실행의 '발행 전 화면 검사'와 같은 보관본). 실행 중에 Ubuntu 패키지 서버(apt)를 쓰지 않아요.
      # 보관본이 없으면 아래에서 Playwright 의 서버에서 받고, 이 job 이 성공으로 끝나면 보관해요. 한글 글꼴은 저장소의 파일(tests/fonts)로.
      - name: 브라우저 보관본 불러오기
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-24.04-${{ hashFiles('requirements-dev.txt') }}

      - name: 라이브러리 설치 (package-lock.json · requirements-dev.txt 그대로)
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install chromium
          bash tests/fonts/install.sh

      # 커밋한 페이지가 지금 src/ 로 빌드한 것과 한 글자도 다르지 않아야 해요 (v17.6 Part 3b 에서 배포가 빌드를 맡으면 없애요)
      - name: 빌드 · 커밋한 페이지 = 소스
        run: |
          bash build.sh
          bash build-app.sh
          bash build-styleguide.sh
          git diff --exit-code --stat -- baepsae.html app.html app-preview.html styleguide.html

      - name: pytest
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: 글자 점검 (이모지 · 금지어 · JSON 의 NaN)
        run: python tests/check_text.py

  # smoke_app 은 장면을 순서대로 몫으로 나눠 기계마다 한 몫씩 (tests/smoke_app.py --part N/M · 모든 장면이 정확히 한 몫에 — test_smoke_parts.py)
  smoke_app:
    name: 스모크 smoke_app (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 브라우저는 보관본에서 (매일 실행의 '발행 전 화면 검사'와 같은 보관본). 실행 중에 Ubuntu 패키지 서버(apt)를 쓰지 않아요.
      # 보관본이 없으면 아래에서 Playwright 의 서버에서 받고, 이 job 이 성공으로 끝나면 보관해요. 한글 글꼴은 저장소의 파일(tests/fonts)로.
      - name: 브라우저 보관본 불러오기
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-24.04-${{ hashFiles('requirements-dev.txt') }}

      - name: 라이브러리 설치 (package-lock.json · requirements-dev.txt 그대로)
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install chromium
          bash tests/fonts/install.sh

      - name: 스모크 테스트 smoke_app (헤드리스 크롬 · 휴대폰 크기)
        run: python tests/smoke_app.py --part "${{ matrix.part }}"

  # 나머지 스모크 넷: smoke_v2 는 혼자(가장 길어요), 짧은 셋은 한 기계에서 하나씩 (하나가 실패해도 끝까지 돌고 빨갛게 끝나요)
  smoke_v2:
    name: 스모크 smoke_v2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 브라우저는 보관본에서 (매일 실행의 '발행 전 화면 검사'와 같은 보관본). 실행 중에 Ubuntu 패키지 서버(apt)를 쓰지 않아요.
      # 보관본이 없으면 아래에서 Playwright 의 서버에서 받고, 이 job 이 성공으로 끝나면 보관해요. 한글 글꼴은 저장소의 파일(tests/fonts)로.
      - name: 브라우저 보관본 불러오기
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-24.04-${{ hashFiles('requirements-dev.txt') }}

      - name: 라이브러리 설치 (package-lock.json · requirements-dev.txt 그대로)
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install chromium
          bash tests/fonts/install.sh

      - name: 스모크 테스트 smoke_v2 (헤드리스 크롬 · 휴대폰 크기)
        run: python tests/smoke_v2.py

  smoke_rest:
    name: 스모크 smoke_preview · smoke_styleguide · smoke_launch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 브라우저는 보관본에서 (매일 실행의 '발행 전 화면 검사'와 같은 보관본). 실행 중에 Ubuntu 패키지 서버(apt)를 쓰지 않아요.
      # 보관본이 없으면 아래에서 Playwright 의 서버에서 받고, 이 job 이 성공으로 끝나면 보관해요. 한글 글꼴은 저장소의 파일(tests/fonts)로.
      - name: 브라우저 보관본 불러오기
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-24.04-${{ hashFiles('requirements-dev.txt') }}

      - name: 라이브러리 설치 (package-lock.json · requirements-dev.txt 그대로)
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install chromium
          bash tests/fonts/install.sh

      # 하나씩 돌려요 (동시에 돌리면 화면 전환을 기다리는 검사가 가끔 흔들렸어요, 2026-11-05).
      # 하나가 실패해도 나머지를 끝까지 돌려 모든 결과를 보여 주고, 하나라도 실패면 빨갛게 끝나요.
      - name: 스모크 테스트 (헤드리스 크롬 · 휴대폰 크기)
        run: |
          failed=()
          for t in smoke_preview smoke_styleguide smoke_launch; do
            echo "::group::$t"
            if python "tests/$t.py"; then ok=통과; else ok=실패; failed+=("$t"); fi
            echo "::endgroup::"
            echo "· $t: $ok"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "!! 스모크 테스트 실패: ${failed[*]}"
            exit 1
          fi

  # 보호 규칙이 찾는 검사 'ci': 위의 모든 job 이 끝난 뒤 (always: 하나가 실패하거나 취소돼도 이 job 은 돌아서 빨갛게 보고해요 —
  # 돌지 않고 '건너뜀'으로 남으면 보호 규칙이 통과로 볼 수 있어요). 모든 job 의 결과가 success 일 때만 초록이에요.
  # 이 job 은 결과를 읽기만 해요: 체크아웃 · 설치 · 발행 · 커밋 없음.
  ci:
    name: ci
    needs: [checks, smoke_app, smoke_v2, smoke_rest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 모든 검사 결과 확인 (성공만 통과 · 실패 · 취소 · 건너뜀은 실패)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          try:
              needs = json.loads(os.environ.get("NEEDS_JSON") or "")
          except ValueError:
              needs = None
          if not isinstance(needs, dict) or not needs:
              print("!! 검사 결과를 읽지 못했어요")
              sys.exit(1)
          bad = []
          for job, v in sorted(needs.items()):
              result = v.get("result") if isinstance(v, dict) else None
              print(f"· {job}: {result}")
              if result != "success":
                  bad.append(f"{job}={result}")
          if bad:
              print("!! 통과하지 못한 검사: " + ", ".join(bad))
              sys.exit(1)
          print(f"· 모든 검사 통과 ({len(needs)}개)")
          PY
