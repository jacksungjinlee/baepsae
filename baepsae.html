Hotels/Leisure",color:"#E11D48"},index:{ko:"지수 ETF",en:"Index ETF",color:"#059669"},metal:{ko:"금·은",en:"Gold/Silver",color:"#E8B54A"},etc:{ko:"기타",en:"Other",color:"#94A3B8"}},Ye={kr:{ko:"한국 주식",en:"KR stocks",color:"#2C4C7C",flag:"KR",bench:"코스피"},us:{ko:"미국 주식",en:"US stocks",color:"#5E6AD2",flag:"US",bench:"S&P 500"},metal:{ko:"금·은",en:"Gold/Silver",color:"#E8B54A",flag:"AU",bench:"금 가격"},bond:{ko:"채권",en:"Bonds",color:"#4E8577",flag:"BD",bench:"국고채"}},ie=e=>bn[e]||{ko:"기타",en:"Other",color:"#94A3B8"},zy={semi:{ko:"PER보다 사이클 위치가 중요해요. 이익 바닥일 땐 PER이 높아 '비싸 보이는 착시', 고점일 땐 '싸 보이는 착시'가 생겨요. PBR과 업황을 함께 보세요.",en:"Cycle position beats PER. Trough earnings make PER look expensive; peak earnings make it look cheap. Watch PBR and the cycle."},elec:{ko:"누구에게 파는지가 핵심이에요. 대형 고객 한 곳에 매출이 몰려 있으면, 그 고객의 투자 계획이 곧 이 회사의 실적이 돼요.",en:"Who they sell to is the whole story. If revenue concentrates in one big customer, that customer's capex plan is this company's earnings."},battery:{ko:"성장 투자기라 이익이 눌려 PER이 왜곡돼요. 매출 성장률·수주(고객사)·자본 조달 여력을 먼저 보세요.",en:"Heavy growth capex distorts PER. Look at revenue growth, orders, and funding capacity first."},auto:{ko:"낮은 PER이 기본인 경기순환주예요. '싸다'가 아니라 '사이클 어디쯤인가'를 물어보세요. 배당과 주주환원도 핵심.",en:"Low PER is normal for this cyclical. Ask 'where in the cycle', not 'is it cheap'."},ship:{ko:"수주잔고가 미래 매출이에요. PER보다 수주잔고÷연매출(몇 년치 일감인지)과 선가 추이를 보세요.",en:"Order backlog is future revenue. Backlog ÷ annual sales and newbuild prices beat PER."},defense:{ko:"수주잔고와 정부 예산이 실적을 결정해요. 수출 계약 한 건이 몇 년치 실적을 바꾸는 구조라 뉴스에 크게 반응해요.",en:"Backlog and government budgets drive earnings; a single export deal can reset years of results."},machine:{ko:"전형적인 경기순환주예요. 고객 산업의 설비투자 사이클을 먼저 보고, 그다음에 밸류에이션을 보세요.",en:"A classic cyclical — read the customer industry's capex cycle before the multiple."},steel:{ko:"사이클 저점에선 PBR로, 고점에선 조심스럽게. 중국 수급이 가격을 흔들어요.",en:"Use PBR at cycle lows, be careful at peaks. China supply-demand moves prices."},chem:{ko:"정제마진·스프레드가 이익을 좌우하는 사이클 산업이에요. 현재 이익보다 스프레드 방향을 보세요.",en:"Spreads drive earnings. Watch spread direction, not current profits."},energy:{ko:"유가가 실적의 대부분을 결정해요. 인플레이션 국면에서 주식 포트폴리오의 완충재 역할을 하기도 해요.",en:"Oil prices drive earnings; can cushion an equity portfolio in inflationary stretches."},utility:{ko:"요금은 정부가 정해요. 실적보다 정책·규제 방향이 주가를 움직여요.",en:"Tariffs are set by government. Policy moves the stock more than earnings."},bio:{ko:"이익이 없어 PER이 무의미한 경우가 많아요. 파이프라인(임상 단계)·기술수출 계약이 가치의 대부분이에요. 변동성이 큰 이유죠.",en:"PER is often meaningless. Pipeline stage and licensing deals carry the value — hence the volatility."},health:{ko:"정책·보험 수가가 실적을 좌우해요. 성장은 완만하지만 경기 방어력이 있는 편이에요.",en:"Policy and reimbursement rates drive results; slower growth but defensive."},platform:{ko:"성장률과 이익률의 조합을 보세요. 성장이 꺾이면 멀티플이 급격히 낮아지는 구조예요.",en:"Watch the growth × margin combo. When growth stalls, the multiple derates fast."},game:{ko:"히트작 의존 산업이라 이익 변동이 커요. 신작 파이프라인과 기존작의 수명이 핵심.",en:"Hit-driven earnings swing hard. New pipeline and longevity of live titles are key."},media:{ko:"IP의 힘과 제작비 부담이 줄다리기해요. 구독자 증가율과 편당 수익성을 함께 보세요.",en:"IP strength versus production cost. Watch subscriber growth alongside per-title economics."},telecom:{ko:"성장보다 배당이 본질인 준(準)유틸리티예요. 배당수익률과 배당의 지속가능성을 보세요.",en:"A quasi-utility: dividends, not growth. Check yield and sustainability."},bank:{ko:"PBR과 ROE가 핵심이에요. 자본이 곧 원료인 산업이라 '자본 대비 얼마나 버는가'가 가치를 결정해요. 금리와 연체율도 함께 보세요.",en:"PBR and ROE rule. Capital is the raw material, so earnings on book equity set the value."},insure:{ko:"보험은 '받은 보험료를 굴려서 버는' 구조예요. 금리 방향과 손해율(들어온 보험료 대비 나간 보험금)을 보세요.",en:"Insurers earn on the float. Watch rates and the loss ratio."},broker:{ko:"거래대금과 시장 분위기에 실적이 직결돼요. 강세장에 잘 벌고 약세장에 급격히 줄어드는 구조예요.",en:"Earnings track trading volumes and sentiment — strong in bull markets, thin in bear ones."},holding:{ko:"지주사는 보유 지분 가치 대비 할인(NAV 할인)으로 거래돼요. 할인율의 역사적 범위를 보세요.",en:"Holdcos trade at a discount to NAV. Compare today's discount to its historical range."},build:{ko:"수주와 분양 실적이 미래 매출이에요. 미분양과 PF(프로젝트 파이낸싱) 부담을 꼭 확인하세요.",en:"Orders and pre-sales are future revenue. Check unsold inventory and project-finance exposure."},realestate:{ko:"금리에 가장 민감한 업종이에요. 임대수익률과 금리 차이(스프레드)가 가치를 결정해요.",en:"The most rate-sensitive sector. The spread between yield and rates sets the value."},retail:{ko:"브랜드력과 이익률의 안정성을 보세요. 경기 방어력이 강점, 폭발적 성장은 약점.",en:"Brand power and margin stability. Defensive, but limited explosive growth."},food:{ko:"경기와 무관한 현금창출력이 강점이에요. 원재료 가격과 판가 인상 여력을 보세요.",en:"Cycle-independent cash flows. Watch input costs and pricing power."},cosmetic:{ko:"브랜드와 수출 시장 구성이 핵심이에요. 특정 국가 의존도가 높으면 그 나라 경기가 곧 실적이에요.",en:"Brand and export mix matter. Heavy country concentration makes that country's economy the earnings driver."},textile:{ko:"브랜드 없이 위탁생산만 하면 마진이 얇아요. 브랜드력이 있는지부터 확인하세요.",en:"Contract manufacturing without a brand means thin margins — check for brand power first."},transport:{ko:"운임(운송 가격)이 실적을 좌우하는 사이클 산업이에요. 유가는 비용, 물동량은 매출이에요.",en:"Freight rates drive earnings. Fuel is cost, volume is revenue."},edu:{ko:"학령인구 감소가 구조적 역풍이에요. 온라인 전환과 성인 교육 확장 여부를 보세요.",en:"Shrinking school-age population is a structural headwind; watch online and adult-education pivots."},paper:{ko:"원재료(펄프) 가격과 판가의 시차가 이익을 만들어요. 사이클 산업으로 보세요.",en:"The lag between pulp costs and prices creates the profit. Treat it as cyclical."},hotel:{ko:"고정비가 커서 매출이 조금 늘면 이익이 크게 늘고, 조금 줄면 크게 줄어요(레버리지 효과).",en:"High fixed costs mean profits swing far more than revenue does."},index:{ko:"ETF는 수백 개 종목을 한 바구니에 담은 상품이에요. 여기 적힌 PER·배당은 바구니 안 종목들의 평균이라 개별 기업처럼 읽으면 안 돼요. 대신 보수(수수료)와 어떤 지수를 따라가는지를 먼저 확인하세요.",en:"An ETF is a basket — its PER and yield are averages, not company figures. Check the expense ratio and which index it tracks."},metal:{ko:"금·은은 이익도 배당도 없어서 PER 같은 지표가 아예 없어요. 값을 정하는 건 '남들이 얼마에 사주느냐'뿐이에요. 그래서 기대수익이 아니라, 주식과 따로 움직이는 성질(분산 효과)을 보고 담는 자산이에요.",en:"Metals have no earnings or dividends, so multiples don't apply. You hold them for low correlation, not expected return."},etc:{ko:"업종 분류가 애매한 종목이에요. 사업 개요를 직접 읽어보고, 이 회사가 무엇으로 돈을 버는지 한 문장으로 말할 수 있는지 확인해보세요.",en:"Sector classification is unclear here. Read the business summary and check you can state in one sentence how it makes money."}},Zu=[{t:"005930",nk:"삼성전자",ne:"Samsung Elec",s:"semi",price:78e3,beta:1.15,vol:32,per:14,pbr:1.4,dy:1.8,al:-6,x:{mcap:466,roe:9.2,opm:15,g3:8,debt:27,frn:52,lo:52300,hi:84500,dk:"메모리 세계 1위. 스마트폰·가전·파운드리 종합 IT. 메모리 가격 사이클을 크게 타요.",de:"World #1 memory; phones, appliances, foundry. Rides the memory cycle."}},{t:"000660",nk:"SK하이닉스",ne:"SK Hynix",s:"semi",price:42e4,beta:1.5,vol:46,per:9,pbr:2.6,dy:.4,al:25,x:{mcap:300,roe:21,opm:35,g3:22,debt:60,frn:55,lo:21e4,hi:46e4,dk:"HBM(AI 메모리) 선두. AI 투자 사이클의 최대 수혜주이자, 그만큼 사이클 위험도 커요.",de:"HBM (AI memory) leader. Biggest AI-cycle beneficiary — and cycle risk."}},{t:"042700",nk:"한미반도체",ne:"Hanmi Semi",s:"semi",price:9e4,beta:1.7,vol:55,per:30,pbr:8,dy:.3,al:35,x:{mcap:9,roe:28,opm:35,g3:45,debt:15,frn:35,lo:48e3,hi:13e4,dk:"HBM 공정 장비(TC본더) 강자. 성장성은 높지만 고객 집중도가 높아요.",de:"HBM bonder equipment leader. High growth, concentrated customers."}},{t:"373220",nk:"LG에너지솔루션",ne:"LG Energy",s:"battery",price:35e4,beta:1.3,vol:42,per:60,pbr:3.5,dy:0,al:-18,x:{mcap:82,roe:5,opm:4,g3:15,debt:90,frn:10,lo:29e4,hi:45e4,dk:"글로벌 배터리 2위. 북미 투자 확대 중. EV 수요와 보조금 정책에 민감해요.",de:"Global #2 battery maker. NA expansion; sensitive to EV demand & subsidies."}},{t:"006400",nk:"삼성SDI",ne:"Samsung SDI",s:"battery",price:25e4,beta:1.35,vol:45,per:25,pbr:1,dy:.4,al:-22,x:{mcap:17,roe:4,opm:3,g3:5,debt:70,frn:40,lo:18e4,hi:34e4,dk:"프리미엄 배터리·전자재료. 수익성 중심 전략이지만 EV 수요 둔화 영향권.",de:"Premium batteries & materials. Profit-focused; exposed to EV slowdown."}},{t:"247540",nk:"에코프로비엠",ne:"EcoPro BM",s:"battery",price:11e4,beta:1.8,vol:60,per:45,pbr:6,dy:0,al:2,x:{mcap:11,roe:8,opm:3,g3:30,debt:120,frn:8,lo:7e4,hi:21e4,dk:"양극재 대표주. 2023년 테마 급등의 주인공. 변동성이 매우 커요.",de:"Cathode materials flagship; 2023 theme-rally star. Very volatile."}},{t:"086520",nk:"에코프로",ne:"EcoPro",s:"battery",price:6e4,beta:1.9,vol:65,per:35,pb th ±0.1–0.2 of error built in."}},vol:{ko:{name:"변동성 (σ)",what:"1년 동안 수익률이 보통 얼마나 위아래로 출렁이는지예요.",ana:"롤러코스터의 높이차예요. 변동성 30%면 평범한 해에도 ±30%의 오르내림은 '정상 운행'이라는 뜻이에요.",act:"출렁임에 놀라 팔면 손실이 확정돼요. 견딜 수 있는 높이의 롤러코스터만 타세요."},en:{name:"Volatility (σ)",what:"How much returns typically swing up and down in a year.",ana:"The height gap of a rollercoaster. 30% vol means ±30% swings are 'normal operation'.",act:"Selling in a scare locks in the loss. Ride only coasters whose drops you can stomach."}},effn:{ko:{name:"실효 종목 수",what:"비중까지 고려했을 때 실질적으로 몇 종목에 분산되어 있는지예요.",ana:"계란을 나눠 담은 바구니 수예요. 10종목을 사도 한 종목이 60%면 바구니는 사실상 2~3개뿐이에요.",act:"바구니가 많을수록 하나를 떨어뜨려도 아침식사는 지킬 수 있어요. 권장 범위까지 늘려보세요."},en:{name:"Effective # of stocks",what:"How many stocks you're really diversified across, weight-adjusted.",ana:"Baskets your eggs are split into. Ten stocks with one at 60% is really 2–3 baskets.",act:"More baskets means one drop won't ruin breakfast. Work toward your recommended range."}},sector:{ko:{name:"섹터 쏠림",what:"가장 큰 산업 하나가 포트폴리오에서 차지하는 비중이에요.",ana:"우산 장수와 짚신 장수 이야기예요. 비 오는 날엔 우산이, 맑은 날엔 짚신이 팔리죠. 한 산업에만 몰면 날씨(업황) 하나에 전부가 걸려요.",act:"같은 산업은 함께 오르내려요. '여러 종목'이 아니라 '여러 산업'이 진짜 분산이에요."},en:{name:"Sector concentration",what:"The share of your largest single industry.",ana:"The umbrella seller and the sandal seller: umbrellas sell in rain, sandals in sun. Bet on one and everything rides on the weather (the industry cycle).",act:"Same-industry stocks move together. Real diversification is many industries, not many tickers."}},sharpe:{ko:{name:"위험 대비 효율 (샤프 비율)",what:"감수한 위험(변동성) 한 단위당 무위험 이자보다 얼마나 더 벌었는지예요.",ana:"자동차의 연비예요. 위험이라는 연료 1을 태워서 초과수익이라는 거리를 얼마나 가느냐 — 같은 거리라면 연료를 덜 쓰는 차가 좋은 차죠.",act:"내 포트폴리오와 인덱스의 샤프를 비교해보세요. 인덱스보다 낮다면, 연료(위험)는 더 쓰면서 덜 가는 중이라는 뜻이에요."},en:{name:"Sharpe ratio",what:"Extra return over the risk-free rate per unit of volatility.",ana:"Fuel efficiency: distance (excess return) per liter of fuel (risk). At equal distance, the thriftier car wins.",act:"Compare yours to the index. Lower means burning more fuel to travel less."}},r2:{ko:{name:"시장 동조율 (R²)",what:"내 포트폴리오 움직임 중 몇 %가 시장 전체의 흐름으로 설명되는지예요.",ana:"에스컬레이터 위에서 걷는 것과 같아요. 동조율 85%면 내 상승의 85%는 에스컬레이터(시장)가 만든 것이고, 내가 걸어 올라간 몫은 15%뿐이에요.",act:"동조율이 높은데 인덱스보다 성과가 낮다면, 비싼 수고로 인덱스를 흉내 내는 셈이에요. 그럴 바엔 인덱스가 낫죠."},en:{name:"Market sync (R²)",what:"The % of your portfolio's movement explained by the overall market.",ana:"Walking on an escalator. At 85% sync, the escalator (market) does 85% of your rise; your own steps add 15%.",act:"High sync but worse than the index means imitating the index expensively. Just buy the index then."}},ret:{ko:{name:"기대수익률",what:"CAPM으로 계산한, 감수한 위험에 대해 '시장이 쳐주는' 연평균 보상이에요.",ana:"위험을 감수한 대가로 시장이 주는 '월급'이에요. 무위험 이자 + (β × 시장 위험 프리미엄).",act:"이건 약속이 아니라 장기 평균 기대치예요. 어떤 해는 훨씬 좋고 어떤 해는 훨씬 나쁠 거예요."},en:{name:"Expected return",what:"The average annual compensation the market 'pays' for your risk, per CAPM.",ana:"A salary for carrying risk: risk-free rate + (β × market risk premium).",act:"A long-run average, not a promise. Some years will be far better, some far worse."}},cagr:{ko:{name:"복리 수익률 (CAGR)",what:"출렁임(변동성)의 감가를 반영한, 장기적으로 실제 쌓이는 연 수익률이에요.",ana:"지그재그로 달리는 차는 직선으로 달리는 차보다 늦게 도착해요. 변동성이 클수록 평균수익률보다 실제 복리수익률이 낮아져요 (≈ 평균 − ½σ²).",act:"변동성을 줄이는 것만으로 장기 복리 수익이 좋아질 수 있어요. 분산이 '공짜 점심'인 이유예요."},en:{name:"CAGR",what:"The annual return that actually compounds long-term, after volatility drag.",ana:"A zigzagging car arrives later than one driving straight. More volatility, bigger gap below the average (≈ mean − ½σ²).",act:"Cutting volatility alone can raise long-run compounding. That's why diversification is the free lunch."}},per:{ko:{name:"PER",what:"주가가 연간 이익의 몇 배인지예요. 낮을수록 '이익 대비 싸다'는 뜻이지만…",ana:"치킨집 인수 가격이에요. 연 순이익 5천만원인 가게를 5억에 사면 PER 10 — 본전까지 10년. 그런데 올해 이익이 유난히 좋았거나 나빴다면? 착시가 생기죠.",act:"섹터마다 정상 범위가 달라요. 종목 카드의 '이 섹터를 볼 땐' 힌트를 꼭 함께 읽으세요."},en:{name:"PER",what:"Price as a multiple of annual earnings. Lower looks cheaper, but…",ana:"Buying a chicken shop: ₩500m for ₩50m/yr profit is PER 10 — ten years to break even. If this year's profit was unusual, the multiple deceives.",act:"Normal ranges differ by sector — always read the sector lens hint on the stock card."}},alpha:{ko:{name:"알파 (α)",what:"위험(β)에 대한 정당한 보상을 빼고 남는 초과수익이에요. 이게 진짜 '종목 선택 실력'의 몫이죠.",ana:"에스컬레이터(시장)가 올려준 것 말고, 내 두 발로 걸어 올라간 몫이에요. 시장이 올라서 번 건 실력이 아니에요.",act:"이 도구는 '과거 알파'는 보여드리지만 '미래 알파 예측'은 보여드리지 않아요. 과거 알파가 이어질 확률은 동전 던지기에 가깝고(SPIVA), 예측 숫자는 과신만 키우거든요. 확실한 알파를 약속하는 사람은 일단 의심하세요."},en:{name:"Alpha (α)",what:"Return left over after fair compensation for risk (β) — the true stock-picking skill share.",ana:"The steps you climbed yourself, beyond what the escalator (market) gave you. Market gains aren't skill.",act:"We show PAST alpha but never a forecast: past alpha persists at roughly coin-flip odds (SPIVA), and a forecast number only breeds overconfidence. Distrust anyone promising certain alpha."}}},Zl={appName:{ko:"뱁새",en:"Baepsae"},appSub:{ko:"내 그릇에 맞는 포트폴리오",en:"Risk-first portfolio"},tab1:{ko:"① 프로필",en:"① Profile"},tab2:{ko:"② 포트폴리오",en:"② Build"},tab3:{ko:"③ 내보내기",en:"③ Export"},disclaimer:{ko:"교육용 도구입니다. 투자 자문이 아니며 모든 판단과 책임은 본인에게 있습니다. 종목 데이터는 "+Si+" 기준 추정치로 실시간이 아니며, 직접 수정해 쓰세요.",en:"Educational tool, not investment advice; decisions are your own. Stock data are rough estimates as of "+Si+" — not live. Edit them yourself."},skipPreset:{ko:"질문 건너뛰고 프리셋으로 시작하기",en:"Skip questions, pick a profile"},presetTitle:{ko:"프로필 고르기",en:"Pick a profile"},presetSub:{ko:"대충 이 정도다 싶은 걸 고르세요. 세부 수치는 나중에 언제든 바꿀 수 있어요.",en:"Start from a preset; fine-tune anytime."},profileTitle:{ko:"나의 투자 프로필",en:"My Investor Profile"},capacity:{ko:"위험 감수 능력",en:"Risk capacity"},tolerance:{ko:"위험 감수 의지",en:"Risk tolerance"},need:{ko:"필요 수익률",en:"Required return"},capacityHint:{ko:"능력 = 잃어도 되는가 (형편)",en:"Ability (circumstances)"},toleranceHint:{ko:"의지 = 견딜 수 있는가 (마음)",en:"Willingness (psychology)"},needHint:{ko:"목표 달성에 필요한 수익률",en:"Return the goal requires"},targetBeta:{ko:"목표 베타",en:"Target be eady — unpaid risk under 20% marks a well-built portfolio. Keeping this balance is the whole job."},rjDetails:{ko:"종목별로 뜯어보기",en:"Per-stock breakdown"},rjZig:{ko:"반대로 출렁이는 두 종목을 합치면, 출렁임이 서로를 지워요. 위험이 '공짜로' 줄어드는 원리예요 — 경제학에서는 이걸 공짜 점심이라고 불러요.",en:"Two holdings that zig oppositely cancel each other's swings — risk shrinks 'for free'. Economists call this the free lunch."},secAlpha:{ko:"알파 — 시장을 이긴다는 것",en:"Alpha — beating the market"},alTitle:{ko:"내 포트폴리오의 알파",en:"My portfolio's alpha"},alPast:{ko:"과거 3년 알파 (추정)",en:"Past 3y alpha (est.)"},alCaveat:{ko:"과거값이에요 — 미래를 보장하지 않아요",en:"A past value — no promise about the future"},alSpace:{ko:"알파가 나올 공간 (트래킹 에러)",en:"Room for alpha (tracking error)"},alSpaceLow:{ko:"인덱스와 거의 똑같이 움직이고 있어요. 알파가 나올 공간 자체가 작아요 — 이럴 바엔 인덱스 펀드가 더 싸고 편해요.",en:"You move almost exactly with the index — little room for alpha either way. An index fund would be cheaper and easier."},alSpaceHigh:{ko:"인덱스와 꽤 다르게 움직여요. 플러스 알파도, 마이너스 알파도 나올 수 있는 구조예요.",en:"You move quite differently from the index — room for alpha, positive or negative."},alPersist:{ko:"참고로, 과거 알파가 앞으로도 이어질 확률은 통계적으로 동전 던지기에 가까워요 (SPIVA 지속성 연구).",en:"Note: the odds that past alpha persists are statistically close to a coin flip (SPIVA persistence studies)."},alGrow:{ko:"내 알파는 어디서 나올 수 있을까?",en:"Where could my alpha come from?"},alTop:{ko:"알파 기여 상위 (과거 기준)",en:"Top alpha contributors (past)"},lgTitle:{ko:"전설들과 나란히 세워보면",en:"Lined up with the legends"},lgNote:{ko:"버핏의 비결은 천재적인 종목 선택만이 아니었어요 — 흔들림 적은 저베타 우량주 + 보험사를 통한 안전한 레버리지 + 60년을 버틴 시간이었죠 ('Buffett's Alpha', Frazzini 외). 그리고 15년 기준, 액티브 펀드의 약 90%는 인덱스를 못 이겨요 (SPIVA).",en:"Buffett's edge wasn't only genius picks — steady low-beta quality + safe insurance-float leverage + sixty years of holding ('Buffett's Alpha', Frazzini et al.). And over 15 years, ~90% of active funds trail the index (SPIVA)."},mktAll:{ko:"전체",en:"All"},chipOne:{ko:"하나만 골라주세요",en:"Pick one"},tapNeeded:{ko:"탭으로 고르는 질문에 모두 답하면 결과를 볼 수 있어요.",en:"Answer every tap question to 먼저 움직이는 일이 많아요. 실적 최고점에 사면 늦는 이유예요."],metrics:[["메모리 가격(DRAM·NAND)","분기 실적을 결정하는 단일 변수예요. 뉴스에서 무료로 확인돼요."],["재고자산 증가율","재고가 매출보다 빨리 늘면 불황 신호일 때가 많아요."],["설비투자(CAPEX) 계획","업계 전체의 투자 축소는 다음 호황의 씨앗이에요."],["PBR","이익이 사이클을 타서 PER은 불황에 오히려 높아져요. 이 업종은 PBR로 위치를 봐요."]],traps:["PER이 낮아 보일 때가 이익 최고점, 즉 꼭짓점인 경우가 많아요. 사이클 업종에서 낮은 PER은 싸다는 뜻이 아닐 수 있어요.","호황 뉴스가 가장 많을 때가 주가는 이미 반영을 끝냈을 때예요."]},bank:{ko:"은행",money:["싸게 빌려서(예금) 비싸게 빌려줘요(대출). 그 차이가 순이자마진(NIM)이고, 은행 이익의 몸이에요.","대출이 부실해지면 손실을 미리 쌓아요(대손충당금). 이익은 NIM에서 충당금을 뺀 값으로 움직여요."],cycle:["금리가 오르면 NIM이 좋아져 이익이 늘어요. 대신 너무 오르면 못 갚는 대출이 늘어 충당금이 커져요.","경기와 부동산이 은행의 큰 배경이에요. 부동산 침체는 시차를 두고 은행 손실로 와요."],metrics:[["NIM(순이자마진)","은행의 기본 수익성이에요. 0.1%p 변화도 이익에 커요."],["연체율·고정이하여신비율","대출의 건강 상태예요. 오르기 시작하면 주의 신호예요."],["보통주자본비율(CET1)","배당 여력을 정해요. 13% 위면 주주환원을 늘릴 여지가 커요."],["PBR과 배당수익률","은행주는 성장보다 환원으로 평가받아요. PBR 1배 아래가 오래 이어진 이유를 아는 게 공부예요."]],traps:["배당수익률이 높다고 바로 사면, 배당의 원천인 이익이 꺾이는 시점을 놓칠 수 있어요.","정부 정책(대출 규제·상생금융)이 이익에 직접 개입해요. 규제 뉴스는 실적 뉴스만큼 중요해요."]},bio:{ko:"제약·바이오",money:["신약 개발사는 성공하면 특허로 10년 넘게 독점 이익을 얻어요. 대신 개발 확률이 낮고 기간이 길어요.","임상 1상에서 최종 승인까지 가는 확률은 10% 안팎이에요. 대부분의 회사는 아직 파는 약이 없어요.","제네릭·CMO(위탁생산)는 다른 사업이에요. 이쪽은 공장 가동률과 수주로 움직이는 제조업이에요."],cycle:["이 업종의 사이클은 경기가 아니라 임상 발표와 기술이전 뉴스예요. 하루에 ±20%가 드물지 않아요.","금리가 오르면 특히 약해요. 이익이 먼 미래에 있어서, 할인율이 오르면 현재 가치가 크게 줄어요."],metrics:[["파이프라인 단계","몇 상인지, 몇 개인지가 회사 가치의 대부분이에요. 3상이 1상보다 훨씬 무거워요."],["현금과 소진 속도","적자 회사는 현금이 곧 수명이에요. 몇 년 버틸지 나눠보세요."],["기술이전(L/O) 실적","글로벌 제약사가 돈을 냈다는 건 외부 전문가의 검증이에요."],["매출 있는 회사인지","매출이 있으면 제조업 지표(성장·마진)로, 없으면 파이프라인과 현금으로 보세요."]],traps:["PER·PBR이 이 업종에선 거의 안 통해요. 적자에 자산도 적은 회사가 많아요.","임상 성공 뉴스에 사면 늦는 경우가 많아요. 기대가 이미 가격에 들어가 있어요.","'혁신 신약 기대'만으로 시가총액이 조 단위인 회사도 있어요. 실패하면 되돌아갈 바닥이 깊어요."]},ship:{ko:"조선",money:["배를 주문받아 2~3년 걸려 만들어 넘겨요. 오늘의 매출은 2~3년 전 계약의 결과예요.","그래서 지금 실적보다 수주잔고(앞으로 만들 일감)가 미래를 말해줘요.","선가(배 가격)가 오른 뒤 받은 주문이 실적이 되기까지 시차가 있어요. 이 시차가 조선주 투자의 핵심이에요."],cycle:["배는 20~25년 쓰고 바꿔요. 그래서 교체 사이클이 10년 넘게 길어요.","환경 규제(친환경 연료선)가 교체를 앞당기면 슈퍼사이클이 와요. 반대로 발주 절벽이 오면 몇 년을 버텨야 해요."],metrics:[["수주잔고","몇 년 치 일감인지가 첫 질문이에요. 2년 아래면 불안, 3년 위면 든든해요."],["신조선가 지수","배 가격 지수예요. 오르는 동안 받은 주문이 미래 마진이에요."],["후판 가격","배 원가의 큰 몫이 철판이에요. 후판이 오르면 마진이 눌려요."],["건조 마진(영업이익률)","저가 수주 물량이 소화됐는지 여기서 확인돼요."]],traps:["수주 뉴스와 이익은 달라요. 싸게 받은 주문은 매출이 늘어도 적자를 만들어요.","사이클 후반에 PER이 낮아 보이는 건 반도체와 같은 함정이에요."]},defense:{ko:"방산·항공우주",money:["고객이 정부예요. 계약이 크고 길어서, 한 번 수주하면 5~10년 매출이 보여요.","수출이 성장의 몸이에요. 내수는 안정적이지만 크게 늘지 않아요.","무기는 팔고 끝이 아니라 유지·보수·탄약으로 수십 년 후속 매출이 붙어요."],cycle:["경기 사이클보다 지정학이 사이클이에요. 전쟁·긴장은 각국 국방예산을 늘리고, 그 예산이 몇 년에 걸쳐 발주로 이어져요.","수출 계약은 정부 간 협상이라 뉴스가 먼저, 계약은 한참 뒤예요. 기대와 확정 사이가 길어요."],metrics:[["수주잔고","조선과 같아요. 몇 년 치 일감인지가 기본이에요."],["수출 비중","성장률과 마진 모두 수출이 내수보다 좋아요."],["영업이익률 추이","양산이 본격화되면 마진이 계단식으로 좋아지는 사업이에요."]],traps:["'수출 협상 중' 뉴스로 오른 주가는 계약이 미뤄지면 그대로 되돌아가요.","지정학 긴장이 풀리는 것도 위험이에요. 평화는 이 업종의 역풍이에요."]},battery:{ko:"2차전지",money:["전기차 회사에 배터리를 만들어 팔아요. 고객사(완성차)의 판매량이 곧 매출이에요.","셀 회사(LG에너지솔루션 등)와 소재 회사(양극재 등)로 나뉘어요. 소재는 셀보다 고객이 좁고 가격 협상력이 약해요.","수주는 몇 년 치를 미리 받지만, 실제 출하는 전기차가 팔려야 일어나요."],cycle:["전기차 보급 속도가 사이클이에요. 보조금·금리·충전 인프라가 수요를 밀고 당겨요.","리튬 등 광물 가격이 판가에 연동돼요. 광물이 내리면 매출도 같이 줄어 보이는 구조예요.","2023~24년의 급락처럼, 성장 기대가 앞서간 만큼 되돌림도 깊었어요."],metrics:[["고객사 전기차 판매량","내 회사가 아니라 고객의 판매 실적이 선행 지표예요."],["가동률","공장을 지어놓고 못 돌리면 고정비가 그대로 손실이에요."],["수주잔고와 실제 출하의 간극","잔고는 크지만 출하가 안 늘면 잔고는 숫자일 뿐이에요."],["광물 가격(리튬)","판가 연동 구조라 매출 증감을 먼저 설명해줘요."]],traps:["수주잔고 '수백조'는 10년 치 합계예요. 올해 매출과 혼동하면 안 돼요.","성장 업종이라는 이유로 PER 50배가 정당화되던 시기가 있었어요. 성장이 늦어지자 가격이 먼저 무너졌어요."]},platform:{ko:"인터넷·플랫폼",money:["사용자를 모아 광고·수수료·구독으로 돈을 바꿔요. 사용자가 머무는 시간이 원재료예요.","한 번 이기면 오래 이겨요(네트워크 효과). 대신 성장이 멈추면 시장의 평가가 빠르게 식어요.","인건비가 최대 비용이에요. 개발자 채용을 줄이면 이익이 바로 좋아지는 구조예요."],cycle:["광고 매출은 경기에 민감해요. 기업들이 어려우면 광고비부터 줄여요.","금리가 오르면 성장주 전체와 함께 눌려요. 이익이 미래에 있을수록 더 눌려요."],metrics:[["사용자 수와 사용 시간(MAU·DAU)","매출보다 먼저 움직이는 원천 지표예요."],["매출 성장률","이 업종은 성장률로 평가받아요. 20%대와 한 자릿수는 다른 회사 취급을 받아요."],["영업이익률 방향","성장에서 수익으로 넘어가는 시기엔 마진 개선이 주가를 끌어요."],["신사업(커머스·핀테크·AI) 비중","본업 성장이 꺾일 때 다음 이야기가 있는지예요."]],traps:["사용자는 그대로인데 주가만 기대로 오르는 구간이 있어요. 주가 분해에서 눈높이 몫이 커진 때예요.","규제(수수료·독점) 뉴스가 실적과 무관하게 평가를 바꿔요."]},media:{ko:"미디어·엔터",money:["엔터사는 아티스트의 활동(앨범·공연·MD·광고)으로 돈을 벌어요. 아티스트가 자산이에요.","앨범과 공연이 매출의 몸이고, 팬 플랫폼·IP 사업이 이익률을 올려요.","콘텐츠(드라마·영화)사는 제작비를 먼저 쓰고 판권으로 회수해요. 흥행 변동이 커요."],cycle:["경기보다 아티스트 사이클이에요. 데뷔 → 성장 → 군입대·재계약이 실적 달력이에요.","재계약 시점엔 정산 비율이 올라 이익률이 눌리는 게 보통이에요."],metrics:[["앨범 판매량·공연 규모","분기 실적을 미리 보여주는 공개 지표예요."],["아티스트 포트폴리오","한 팀 의존도가 높으면 그 팀의 일정이 회사 전체의 위험이에요."],["재계약·군입대 일정","몇 년 뒤 실적 공백이 언제인지 달력에 이미 나와 있어요."],["팬 플랫폼·MD 매출 비중","활동이 없어도 도는 매출이 늘고 있는지예요."]],traps:["신인 데뷔 기대만으로 오른 주가는 데뷔 성과가 숫자로 확인될 때 검증받아요.","팬심과 투자는 달라요. 좋아하는 회사일수록 숫자를 한 번 더 보세요."]}},jy=["semi","bank","bio","ship","defense","battery","platform","media"];var f=Ee(it()),od="baepsae_v12_dcf",Ky="이성진, INSEAD MBA 26J · Jack (Sung Jin) Lee, INSEAD MBA 26J",ud=e=>e==null?"—":Math.abs(e)>=1e4?(e/1e4).toFixed(1)+"조원":Math.round(e).toLocaleString()+"억원",dd=e=>e==null?"—":Math.round(e).toLocaleString()+"원",nr=e=>e==null?"—":Math.abs(e)>=1e8?(e/1e8).toFixed(1)+"억":Math.abs(e)>=1e4?(e/1e4).toFixed(1)+"만":Math.round(e).toLocaleString(),Yn=(e,t=1)=>e==null?"—":e.toFixed(t)+"%",Ae=(e,t,n)=>Math.min(Math.max(e,t),n),Ze=({children:e,style:t={}})=>(0,f.jsx)("div",{style:{background:"#FFFFFF",border:ue,borderRadius:ve.card,padding:18,...t},children:e}),qt=({num:e,main:t,sub:n,onWhy:i,children:l})=>(0,f.jsxs)("div",{children:[(0,f.jsxs)("div",{style:{display:"flex",alignItems:"baseline",gap:8},children:[e&&(0,f.jsx)("span",{style:{fontFamily:R,fontSize:11,fontWeight:800,color:o.apricotDeep,letterSpacing:"0.1em"},children:e}),(0,f.jsx)("span",{style:{fontFamily:R,fontSize:15.5,fontWeight:800,color:o.ink,letterSpacing:"-0.01em"},children:t||l}),i&&(0,f.jsx)("button",{onClick:i,style:{fontSize:10,color:o.faint,background:o.bg,border:"none",borderRadius:999,width:16,height:16,cursor:"pointer",fontWeight:800,fontFamily:R,alignSelf:"center"},children:"?"})]}),n&&(0,f.jsx)("div",{style:{fontSize:10.5,color:o.faint,marginTop:3,letterSpacing:"0.02em"},children:n})]}),we=({children:e,style:t={}})=>(0,f.jsx)("div",{style:{fontSize:12,color:o.sub,lineHeight:1.6,...t},children:e}),cn=({on:e,onClick:t,children:n})=>(0,f.jsx)("button",{className:"bchip",onClick:t,style:{border:e?"1.5px solid "+o.ink:"1.5px solid "+o.line,background:e?o.ink:"#fff",color:e?"#fff":o.sub,borderRadius:999,padding:"7px 13px",fontSize:12,fontWeight:800,cursor:"pointer",fontFamily:R},children:n}),qy={quad:{t:"업종 성장 사분면",b:"가로축은 업종의 3년 매출 성장률(상장사 합산 기준), 세로축은 각 기업의 3년 매출 성장률이에요. 오른쪽 위는 성장하는 산업 안에서 함께 성장하는 기업이고, 왼쪽 위는 산업이 역성장하는데 홀로 성장하는 기업 — 점유율 확대인지 일회성 효과인지 확인이 필요한 구간이에요. 주의: '업종 성장'은 상장사 매출 합산 기준이라, 비상장사와 해외 매출 구성에 따라 실제 시장 성장과 차이가 날 수 있어요."},secrank:{t:"업종 성장률 순위",b:"각 업종의 3년 연평균 매출 성장률(상장사 합산 기준)을 큰 순서대로 늘어놓았어요. 막대 옆의 매출 규모와 수익성을 함께 보면 '커지는 판인가, 돈이 되는 판인가'를 같이 판단할 수 있어요. 표본이 5개 미만인 업종은 성장률을 표시하지 않아요."},scatter:{t:"수익성과 주가 수준 (ROE × PBR)",b:"가로축은 자기자본이익률(ROE), 세로축은 주가순자산비율(PBR)이에요. 보통 자본을 잘 굴리는 회사일수록 장부가치 대비 높은 값에 거래되고, 점선 추세선이 그 평균적 관계예요. 추세선보다 한참 위면 수익성에 비해 높은 평가, 한참 아래면 낮은 평가를 받고 있다는 뜻인데 — 거기엔 대개 이유가 있어요. 그 이유를 찾는 것이 분석이에요."},box:{t:"업종별 시장 눈높이",b:"업종마다 시장이 쳐주는 값의 눈높이가 달라요. 굵은 점이 그 업종의 중간값, 옅은 막대가 가운데 절반(25~75%)이 모여 있는 구간이에요. 같은 PER 10배라도 어떤 업종에선 비싼 값, 어떤 업종에선 싼 값이에요 — 그래서 멀티플은 늘 같은 업종 안에서 읽어요. 점선은 시장 전체의 중간값이라, 어떤 업종이 시장 평균보다 후하게 또는 박하게 평가받는지도 보여요."},per:{t:"PER (주가수익비율)",b:"시장이 이 회사의 이익 1원에 몇 원을 내고 있는지예요. 높다는 건 시장이 앞으로의 성장을 크게 기대한다는 뜻이고, 그 기대가 실현되지 않으면 주가가 조정될 수 있다는 뜻이기도 해요. 적자 기업은 PER을 계산할 수 없어요."},pbr:{t:"PBR (주가순자산비율)",b:"회사 장부상 순자산 1원을 시장이 몇 원으로 평가하는지예요. 1배 미만은 장부가치보다 싸게 거래된다는 뜻인데, 그 자체로 저평가라기보다 '시장이 이 자산의 수익성을 의심한다'는 신호일 때가 많아요. ROE와 함께 읽어야 해요."},roe:{t:"ROE (자기자본이익률)",b:"주주 돈 100원으로 1년에 몇 원을 벌었는지예요. 꾸준히 높은 ROE는 좋은 사업의 흔적이지만, 부채를 늘려도 ROE는 올라가요 — 부채비율과 함께 보세요."},payout:{t:"배당성향",b:"번 이익 중 얼마를 배당으로 돌려주는지예요. 이익보다 배당이 큰 상태(100% 초과)가 이어지면 지속되기 어려워요."},ff:{t:"업종 내 위치",b:"지표 하나로는 회사를 판단할 수 없어요. PER·PBR·PSR·EV/EBITDA 같은 여러 지표에서 같은 업종 회사들 가운데 낮은 쪽인지 높은 쪽인지를 나란히 놓은 그림이에요. 파란 상자는 업종의 25~75% 구간, 주황 점이 이 회사의 위치예요. 낮다고 곧 싸다는 뜻은 아니에요 — 시장이 왜 이 위치에 두었는지 물어보는 출발점이에요."},dcf:{t:"DCF (현금흐름할인)",b:"미래 이익을 가정하고 현재 가치로 할인해 더하는 계산이에요. 여기서는 순이익을 현금흐름으로 근사하는 큰 단순화를 써요(실제로는 투자·운전자본 등으로 달라요). 그래서 이 도구의 목적은 '적정주가 찾기'가 아니라, 가정을 바꿀 때 값이 얼마나 민감하게 움직이는지, 그리고 지금 주가에는 어떤 성장 기대가 담겨 있는지를 보는 거예요."},tree:{t:"수익률 지도",b:"칸의 크기는 시가총액, 색은 최근 3개월 수익률이에요(붉은색 상승·푸른색 하락, 국내 시장 관례를 따랐어요). 시장의 돈이 최근 어디로 흘렀는지 한 화면에서 보는 용도이고, 색이 진하다고 좋거나 나쁜 종목이라는 뜻은 아니에요. 과거 수익률은 미래를 보장하지 않아요."},evebitda:{t:"EV/EBITDA",b:"시가총액에 순차입금을 더한 '기업 전체 가치(EV)'를 상각 전 영업이익(EBITDA)으로 나눈 값이에요. 부채까지 포함해 회사를 통째로 산다고 볼 때의 배수라서, 부채 구조가 다른 회사끼리 비교할 때 PER보다 공정할 때가 많아요. 상각비는 현금흐름표 기준 근사값이에요. 은행·보험·증권·지주는 사업 구조상 이 지표를 쓰지 않아요."},pocf:{t:"P/영업현금흐름",b:"시가총액을 영업활동으로 실제 들어온 현금으로 나눈 값이에요. 회계상 이익은 조정 여지가 있지만 현금은 비교적 정직해서, 이익과 현금흐름이 크게 다른 회사를 걸러내는 데 유용해요."},cmp:{t:"기업 비교",b:"같은 업종 회사들을 지표별로 나란히 놓은 표예요. 오른쪽 끝의 업종 중간값이 기준점 역할을 해요. 숫자가 큰 쪽이 항상 좋은 것도, 낮은 멀티플이 항상 싼 것도 아니에요 — 차이가 나는 항목에서 '왜?'를 묻는 것이 이 표의 사용법이에요."},trap:{t:"싼 값이 오래 싼 값으로 남는 이유",b:"한국 시장에서는 멀티플이 낮은 회사가 오래 낮은 채로 머무는 일이 흔해요. 격차가 좁혀지려면 계기가 필요한데 — 배당·자사주 같은 주주환원 확대, 지배구조 개선, 실적의 방향 전환 — 그 계기가 없으면 '싸다'는 상태가 몇 년씩 이어질 수 있어요. 그래서 낮은 PER·PBR은 결론이 아니라 질문이에요: 이 값이 제자리를 찾게 만들 계기가 있는가, 아니면 낮은 값에 그만한 이유가 있는가. 아울러 단기 주가는 실적보다 테마와 수급이 이끄는 날이 많다는 것도 한국 시장의 현실이에요 — 뱁새의 숫자들은 '오를 종목'이 아니라 '지금 가격에 담긴 가정'을 읽기 위한 것이에요."},screen:{t:"조건 검색",b:"지표와 성향으로 회사를 걸러내는 도구예요. 조건은 전부 내가 정해요. 뱁새는 걸러진 사실을 보여줄 뿐, 어떤 조합이 좋다고 말하지 않아요. 자주 쓰는 조건은 저장해두고 다시 돌릴 수 있어요."},factor:{t:"성향(팩터)",b:"주식을 성격으로 나눠 보는 방법이에요. 가치(싼 주식) · 퀄리티(잘 버는 회사, ROE 기준) · 모멘텀(최근 12개월 오르던 주식) · 소형주(시가총액이 작은 회사) · 저변동(덜 흔들리는 주식). 숫자는 시장 안에서의 백분위예요. 가치 80이면 시장에서 싼 쪽 상위 20%라는 뜻이에요. 이 성향들은 역사적으로 남다른 수익 패턴을 보였지만, 10년 넘게 안 통한 시기도 있었어요. 내가 어떤 성향에 몰려 있는지 아는 게 이 숫자의 쓸모예요."},decomp:{t:"주가 분해",b:"주가는 주당이익(EPS)에 PER을 곱한 값이에요. 그래서 주가가 움직이면, 이익이 움직인 몫과 PER이 움직인 몫으로 나눠볼 수 있어요. 이익이 만든 상승은 회사가 번 거고, PER이 만든 상승은 시장의 기대예요. 기대는 식으면 되돌아가요."},rev:{t:"리버스 DCF",b:"계산 방향을 뒤집어서, '지금 주가가 정당화되려면 앞으로 몇 %씩 성장해야 하나'를 풉니다. 그 성장률이 회사의 과거와 업종 현실에 비추어 그럴듯한지 스스로 판단해보는 것 — 그게 이 도구의 핵심 질문이에요."}};function wb({id:e,onClose:t}){if(!e||!qy[
