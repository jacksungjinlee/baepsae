en:{name:"Effective # of stocks",what:"How many stocks you're really diversified across, weight-adjusted.",ana:"\u{1F95A} Baskets your eggs are split into. Ten stocks with one at 60% is really 2\u20133 baskets.",act:"More baskets means one drop won't ruin breakfast. Work toward your recommended range."}},sector:{ko:{name:"\uC139\uD130 \uC3E0\uB9BC",what:"\uAC00\uC7A5 \uD070 \uC0B0\uC5C5 \uD558\uB098\uAC00 \uD3EC\uD2B8\uD3F4\uB9AC\uC624\uC5D0\uC11C \uCC28\uC9C0\uD558\uB294 \uBE44\uC911\uC774\uC5D0\uC694.",ana:"\u2602\uFE0F \uC6B0\uC0B0 \uC7A5\uC218\uC640 \uC9DA\uC2E0 \uC7A5\uC218 \uC774\uC57C\uAE30\uC608\uC694. \uBE44 \uC624\uB294 \uB0A0\uC5D4 \uC6B0\uC0B0\uC774, \uB9D1\uC740 \uB0A0\uC5D4 \uC9DA\uC2E0\uC774 \uD314\uB9AC\uC8E0. \uD55C \uC0B0\uC5C5\uC5D0\uB9CC \uBAB0\uBA74 \uB0A0\uC528(\uC5C5\uD669) \uD558\uB098\uC5D0 \uC804\uBD80\uAC00 \uAC78\uB824\uC694.",act:"\uAC19\uC740 \uC0B0\uC5C5\uC740 \uD568\uAED8 \uC624\uB974\uB0B4\uB824\uC694. '\uC5EC\uB7EC \uC885\uBAA9'\uC774 \uC544\uB2C8\uB77C '\uC5EC\uB7EC \uC0B0\uC5C5'\uC774 \uC9C4\uC9DC \uBD84\uC0B0\uC774\uC5D0\uC694."},en:{name:"Sector concentration",what:"The share of your largest single industry.",ana:"\u2602\uFE0F The umbrella seller and the sandal seller: umbrellas sell in rain, sandals in sun. Bet on one and everything rides on the weather (the industry cycle).",act:"Same-industry stocks move together. Real diversification is many industries, not many tickers."}},sharpe:{ko:{name:"\uC704\uD5D8 \uB300\uBE44 \uD6A8\uC728 (\uC0E4\uD504 \uBE44\uC728)",what:"\uAC10\uC218\uD55C \uC704\uD5D8(\uBCC0\uB3D9\uC131) \uD55C \uB2E8\uC704\uB2F9 \uBB34\uC704\uD5D8 \uC774\uC790\uBCF4\uB2E4 \uC5BC\uB9C8\uB098 \uB354 \uBC8C\uC5C8\uB294\uC9C0\uC608\uC694.",ana:"\u26FD \uC790\uB3D9\uCC28\uC758 \uC5F0\uBE44\uC608\uC694. \uC704\uD5D8\uC774\uB77C\uB294 \uC5F0\uB8CC 1\uC744 \uD0DC\uC6CC\uC11C \uCD08\uACFC\uC218\uC775\uC774\uB77C\uB294 \uAC70\uB9AC\uB97C \uC5BC\uB9C8\uB098 \uAC00\uB290\uB0D0 \u2014 \uAC19\uC740 \uAC70\uB9AC\uB77C\uBA74 \uC5F0\uB8CC\uB97C \uB35C \uC4F0\uB294 \uCC28\uAC00 \uC88B\uC740 \uCC28\uC8E0.",act:"\uB0B4 \uD3EC\uD2B8\uD3F4\uB9AC\uC624\uC640 \uC778\uB371\uC2A4\uC758 \uC0E4\uD504\uB97C \uBE44\uAD50\uD574\uBCF4\uC138\uC694. \uC778\uB371\uC2A4\uBCF4\uB2E4 \uB0AE\uB2E4\uBA74, \uC5F0\uB8CC(\uC704\uD5D8)\uB294 \uB354 \uC4F0\uBA74\uC11C \uB35C \uAC00\uB294 \uC911\uC774\uB77C\uB294 \uB73B\uC774\uC5D0\uC694."},en:{name:"Sharpe ratio",what:"Extra return over the risk-free rate per unit of volatility.",ana:"\u26FD Fuel efficiency: distance (excess return) per liter of fuel (risk). At equal distance, the thriftier car wins.",act:"Compare yours to the index. Lower means burning more fuel to travel less."}},r2:{ko:{name:"\uC2DC\uC7A5 \uB3D9\uC870\uC728 (R\xB2)",what:"\uB0B4 \uD3EC\uD2B8\uD3F4\uB9AC\uC624 \uC6C0\uC9C1\uC784 \uC911 \uBA87 %\uAC00 \uC2DC\uC7A5 \uC804\uCCB4\uC758 \uD750\uB984\uC73C\uB85C \uC124\uBA85\uB418\uB294\uC9C0\uC608\uC694.",ana:"\u{1F6D7} \uC5D0\uC2A4\uCEEC\uB808\uC774\uD130 \uC704\uC5D0\uC11C \uAC77\uB294 \uAC83\uACFC \uAC19\uC544\uC694. \uB3D9\uC870\uC728 85%\uBA74 \uB0B4 \uC0C1\uC2B9\uC758 85%\uB294 \uC5D0\uC2A4\uCEEC\uB808\uC774\uD130(\uC2DC\uC7A5)\uAC00 \uB9CC\uB4E0 \uAC83\uC774\uACE0, \uB0B4\uAC00 \uAC78\uC5B4 \uC62C\uB77C\uAC04 \uBAAB\uC740 15%\uBFD0\uC774\uC5D0\uC694.",act:"\uB3D9\uC870\uC728\uC774 \uB192\uC740\uB370 \uC778\uB371\uC2A4\uBCF4\uB2E4 \uC131\uACFC\uAC00 \uB0AE\uB2E4\uBA74, \uBE44\uC2FC \uC218\uACE0\uB85C \uC778\uB371\uC2A4\uB97C \uD749\uB0B4 \uB0B4\uB294 \uC148\uC774\uC5D0\uC694. \uADF8\uB7F4 \uBC14\uC5D4 \uC778\uB371\uC2A4\uAC00 \uB0AB\uC8E0."},en:{name:"Market sync (R\xB2)",what:"The % of your portfolio's movement explained by the overall market.",ana:"\u{1F6D7} Walking on an escalator. At 85% sync, the escalator (market) does 85% of your rise; your own steps add 15%.",act:"High sync but worse than the index means imitating the index expensively. Just buy the index then."}},ret:{ko:{name:"\uAE30\uB300\uC218\uC775\uB960",what:"CAPM\uC73C\uB85C \uACC4\
