<script>
// CV link (Jack, 2026-11-05): this address is on Jack's CV, so a plain visit lands in 2.0 before anything is drawn.
// Stays in the old app when: the 2.0 marker ?from=app is there (src/links.js OLD_APP, on every 2.0 link into the old
// app) · there is a # (old shared links, 2.0's deep links) · this tab already entered the old app · or (loop guard) this
// tab was sent to 2.0 less than 10 s ago and came back from this site (a visitor who goes Back to LinkedIn and clicks
// again comes from elsewhere and is sent again). Staying without the marker adds it (the old app clears its # after
// reading), so a reload stays too. Other query parameters (?utm_*, ?trk=) never keep a visitor here. Sending: hide the
// page, count one GoatCounter hit at "<path>→app" (skipped on local hosts and dev browsers, like the snippet below and
// count.js), location.replace (no history entry), then stop parsing so the old app never runs, paints or touches
// storage: document.write('<plaintext>') from this inline, parser-run script turns the rest of the file into hidden
// text (Chromium already stops on its own; WebKit keeps parsing until 2.0 arrives).
// Storage: only this tab's two sessionStorage flags. Tests: tests/test_cv_link.py, tests/smoke_launch.py.
(function(){
  var MARK="from=app",L=location,path=L.pathname,search=L.search,ss=null;
  if(!/\/baepsae(\.html)?$/.test(path))return;    // service-worker fallback at another address: the old app as before
  try{ss=window.sessionStorage;}catch(e){}
  function get(k){try{return ss?ss.getItem(k):null;}catch(e){return null;}}
  function put(k,v){try{if(ss)ss.setItem(k,v);}catch(e){}}
  var args=search.slice(1).split("&"),marked=args.indexOf(MARK)>-1,now=Date.now(),last=Number(get("baepsae_cv_sent"))||0,
    loop=now>=last&&now-last<10000&&document.referrer.indexOf(L.protocol+"//"+L.host+"/")===0;
  if(marked||L.hash||get("baepsae_old_tab")==="1"||loop){
    if(marked||L.hash||!loop)put("baepsae_old_tab","1");   // the loop guard alone doesn't keep this tab in the old app
    if(!marked){try{history.replaceState(history.state,"",path+(search?search+"&":"?")+MARK+L.hash);}catch(e){}}
    // The old app's own pageview keeps its path as before: count.js counts pathname + search, so leave the marker out.
    window.goatcounter=window.goatcounter||{};
    window.goatcounter.path=function(p){var i=p.indexOf("?");if(i<0)return p;
      var q=p.slice(i+1).split("&").filter(function(a){return a&&a!==MARK;}).join("&");return p.slice(0,i)+(q?"?"+q:"");};
    return;
  }
  put("baepsae_cv_sent",String(now));
  document.documentElement.style.display="none";
  var dev=args.indexOf("dev=1")>-1?"1":args.indexOf("dev=0")>-1?"0":"";   // ?dev=1 · ?dev=0 still reach 2.0's switch
  try{
    var h=L.hostname,skip=dev==="1"||L.protocol==="file:"||window.top!==window||document.visibilityState==="prerender"||
      /(localhost$|^127\.|^10\.|^172\.(1[6-9]|2[0-9]|3[0-1])\.|^192\.168\.|^0\.0\.0\.0$)/.test(h);
    try{skip=skip||localStorage.getItem("baepsae_dev")==="1"||localStorage.getItem("skipgc")==="t";}catch(e){}
    if(!skip){                                    // the fields count.js sends; b=153 is count.js's code for navigator.webdriver
      var enc=encodeURIComponent,r=document.referrer,
        u="https://baepsae.goatcounter.com/count?p="+enc(path.replace(/(\.html)?$/,".html")+"→app")+
          "&t="+enc("CV link → 2.0")+(r?"&r="+enc(r):"")+"&s="+screen.width+(search?"&q="+enc(search):"")+
          (navigator.webdriver?"&b=153":"")+"&rnd="+Math.random().toString(36).slice(2,7);
      if(!(navigator.sendBeacon&&navigator.sendBeacon(u))){new Image().src=u;}
    }
  }catch(e){}
  try{L.replace("./app.html"+(dev?"?dev="+dev:""));}catch(e){document.documentElement.style.display="";return;}  // blocked: the old app
  try{document.write('<plaintext style="display:none">');}catch(e){}
})();
</script>
<script>
(function(){try{
  var q=new URLSearchParams(location.search);
  if(q.get("dev")==="1"){localStorage.setItem("baepsae_dev","1");}
  if(q.get("dev")==="0"){localStorage.removeItem("baepsae_dev");}
  if(localStorage.getItem("baepsae_dev")==="1")return;
  var code="baepsae";
  if(code.indexOf("HERE")>-1)return;
  var s=document.createElement("script");s.async=true;
  s.dataset.goatcounter="https://"+code+".goatcounter.com/count";
  s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);
}catch(e){}})();
</script>

aper/Wood",color:"#92400E"},hotel:{ko:"호텔·레저·외식",en:"Hotels/Leisure",color:"#E11D48"},index:{ko:"지수 ETF",en:"Index ETF",color:"#059669"},metal:{ko:"금·은",en:"Gold/Silver",color:"#E8B54A"},etc:{ko:"기타",en:"Other",color:"#94A3B8"}},$e={kr:{ko:"한국 주식",en:"KR stocks",color:"#2C4C7C",flag:"KR",bench:"코스피"},us:{ko:"미국 주식",en:"US stocks",color:"#5E6AD2",flag:"US",bench:"S&P 500"},metal:{ko:"금·은",en:"Gold/Silver",color:"#E8B54A",flag:"AU",bench:"금 가격"},bond:{ko:"채권",en:"Bonds",color:"#4E8577",flag:"BD",bench:"국고채"}},ae=e=>ri[e]||{ko:"기타",en:"Other",color:"#94A3B8"},nh={semi:{ko:"PER보다 사이클 위치가 중요해요. 이익 바닥일 땐 PER이 높아 '비싸 보이는 착시', 고점일 땐 '싸 보이는 착시'가 생겨요. PBR과 업황을 함께 보세요.",en:"Cycle position beats PER. Trough earnings make PER look expensive; peak earnings make it look cheap. Watch PBR and the cycle."},elec:{ko:"누구에게 파는지가 핵심이에요. 대형 고객 한 곳에 매출이 몰려 있으면, 그 고객의 투자 계획이 곧 이 회사의 실적이 돼요.",en:"Who they sell to is the whole story. If revenue concentrates in one big customer, that customer's capex plan is this company's earnings."},battery:{ko:"성장 투자기라 이익이 눌려 PER이 왜곡돼요. 매출 성장률·수주(고객사)·자본 조달 여력을 먼저 보세요.",en:"Heavy growth capex distorts PER. Look at revenue growth, orders, and funding capacity first."},auto:{ko:"낮은 PER이 기본인 경기순환주예요. '싸다'가 아니라 '사이클 어디쯤인가'를 물어보세요. 배당과 주주환원도 핵심.",en:"Low PER is normal for this cyclical. Ask 'where in the cycle', not 'is it cheap'."},ship:{ko:"수주잔고가 미래 매출이에요. PER보다 수주잔고÷연매출(몇 년치 일감인지)과 선가 추이를 보세요.",en:"Order backlog is future revenue. Backlog ÷ annual sales and newbuild prices beat PER."},defense:{ko:"수주잔고와 정부 예산이 실적을 결정해요. 수출 계약 한 건이 몇 년치 실적을 바꾸는 구조라 뉴스에 크게 반응해요.",en:"Backlog and government budgets drive earnings; a single export deal can reset years of results."},machine:{ko:"전형적인 경기순환주예요. 고객 산업의 설비투자 사이클을 먼저 보고, 그다음에 밸류에이션을 보세요.",en:"A classic cyclical — read the customer industry's capex cycle before the multiple."},steel:{ko:"사이클 저점에선 PBR로, 고점에선 조심스럽게. 중국 수급이 가격을 흔들어요.",en:"Use PBR at cycle lows, be careful at peaks. China supply-demand moves prices."},chem:{ko:"정제마진·스프레드가 이익을 좌우하는 사이클 산업이에요. 현재 이익보다 스프레드 방향을 보세요.",en:"Spreads drive earnings. Watch spread direction, not current profits."},energy:{ko:"유가가 실적의 대부분을 결정해요. 인플레이션 국면에서 주식 포트폴리오의 완충재 역할을 하기도 해요.",en:"Oil prices drive earnings; can cushion an equity portfolio in inflationary stretches."},utility:{ko:"요금은 정부가 정해요. 실적보다 정책·규제 방향이 주가를 움직여요.",en:"Tariffs are set by government. Policy moves the stock more than earnings."},bio:{ko:"이익이 없어 PER이 무의미한 경우가 많아요. 파이프라인(임상 단계)·기술수출 계약이 가치의 대부분이에요. 변동성이 큰 이유죠.",en:"PER is often meaningless. Pipeline stage and licensing deals carry the value — hence the volatility."},health:{ko:"정책·보험 수가가 실적을 좌우해요. 성장은 완만하지만 경기 방어력이 있는 편이에요.",en:"Policy and reimbursement rates drive results; slower growth but defensive."},platform:{ko:"성장률과 이익률의 조합을 보세요. 성장이 꺾이면 멀티플이 급격히 낮아지는 구조예요.",en:"Watch the growth × margin combo. When growth stalls, the multiple derates fast."},game:{ko:"히트작 의존 산업이라 이익 변동이 커요. 신작 파이프라인과 기존작의 수명이 핵심.",en:"Hit-driven earnings swing hard. New pipeline and longevity of live titles are key."},media:{ko:"IP의 힘과 제작비 부담이 줄다리기해요. 구독자 증가율과 편당 수익성을 함께 보세요.",en:"IP strength versus production cost. Watch subscriber growth alongside per-title economics."},telecom:{ko:"성장보다 배당이 본질인 준(準)유틸리티예요. 배당수익률과 배당의 지속가능성을 보세요.",en:"A quasi-utility: dividends, not growth. Check yield and sustainability."},bank:{ko:"PBR과 ROE가 핵심이에요. 자본이 곧 원료인 산업이라 '자본 대비 얼마나 버는가'가 가치를 결정해요. 금리와 연체율도 함께 보세요.",en:"PBR and ROE rule. Capital is the raw material, so earnings on book equity set the value."},insure:{ko:"보험은 '받은 보험료를 굴려서 버는' 구조예요. 금리 방향과 손해율(들어온 보험료 대비 나간 보험금)을 보세요.",en:"Insurers earn on the float. Watch rates and the loss ratio."},broker:{ko:"거래대금과 시장 분위기에 실적이 직결돼요. 강세장에 잘 벌고 약세장에 급격히 줄어드는 구조예요.",en:"Earnings track trading volumes and sentiment — strong in bull markets, thin in bear ones."},holding:{ko:"지주사는 보유 지분 가치 대비 할인(NAV 할인)으로 거래돼요. 할인율의 역사적 범위를 보세요.",en:"Holdcos trade at a discount to NAV. Compare today's discount to its historical range."},build:{ko:"수주와 분양 실적이 미래 매출이에요. 미분양과 PF(프로젝트 파이낸싱) 부담을 꼭 확인하세요.",en:"Orders and pre-sales are future revenue. Check unsold inventory and project-finance exposure."},realestate:{ko:"금리에 가장 민감한 업종이에요. 임대수익률과 금리 차이(스프레드)가 가치를 결정해요.",en:"The most rate-sensitive sector. The spread between yield and rates sets the value."},retail:{ko:"브랜드력과 이익률의 안정성을 보세요. 경기 방어력이 강점, 폭발적 성장은 약점.",en:"Brand power and margin stability. Defensive, but limited explosive growth."},food:{ko:"경기와 무관한 현금창출력이 강점이에요. 원재료 가격과 판가 인상 여력을 보세요.",en:"Cycle-independent cash flows. Watch input costs and pricing power."},cosmetic:{ko:"브랜드와 수출 시장 구성이 핵심이에요. 특정 국가 의존도가 높으면 그 나라 경기가 곧 실적이에요.",en:"Brand and export mix matter. Heavy country concentration makes that country's economy the earnings driver."},textile:{ko:"브랜드 없이 위탁생산만 하면 마진이 얇아요. 브랜드력이 있는지부터 확인하세요.",en:"Contract manufacturing without a brand means thin margins — check for brand power first."},transport:{ko:"운임(운송 가격)이 실적을 좌우하는 사이클 산업이에요. 유가는 비용, 물동량은 매출이에요.",en:"Freight rates drive earnings. Fuel is cost, volume is revenue."},edu:{ko:"학령인구 감소가 구조적 역풍이에요. 온라인 전환과 성인 교육 확장 여부를 보세요.",en:"Shrinking school-age population is a structural headwind; watch online and adult-education pivots."},paper:{ko:"원재료(펄프) 가격과 판가의 시차가 이익을 만들어요. 사이클 산업으로 보세요.",en:"The lag between pulp costs and prices creates the profit. Treat it as cyclical."},hotel:{ko:"고정비가 커서 매출이 조금 늘면 이익이 크게 늘고, 조금 줄면 크게 줄어요(레버리지 효과).",en:"High fixed costs mean profits swing far more than revenue does."},index:{ko:"ETF는 수백 개 종목을 한 바구니에 담은 상품이에요. 여기 적힌 PER·배당은 바구니 안 종목들의 평균이라 개별 기업처럼 읽으면 안 돼요. 대신 보수(수수료)와 어떤 지수를 따라가는지를 먼저 확인하세요.",en:"An ETF is a basket — its PER and yield are averages, not company figures. Check the expense ratio and which index it tracks."},metal:{ko:"금·은은 이익도 배당도 없어서 PER 같은 지표가 아예 없어요. 값을 정하는 건 '남들이 얼마에 사주느냐'뿐이에요. 그래서 기대수익이 아니라, 주식과 따로 움직이는 성질(분산 효과)을 보고 담는 자산이에요.",en:"Metals have no earnings or dividends, so multiples don't apply. You hold them for low correlation, not expected return."},etc:{ko:"업종 분류가 애매한 종목이에요. 사업 개요를 직접 읽어보고, 이 회사가 무엇으로 돈을 버는지 한 문장으로 말할 수 있는지 확인해보세요.",en:"Sector classification is unclear here. Read the business summary and check you can state in one sentence how it makes money."}},Ua=[{t:"005930",nk:"삼성전자",ne:"Samsung Elec",s:"semi",price:78e3,beta:1.15,vol:32,per:14,pbr:1.4,dy:1.8,al:-6,x:{mcap:466,roe:9.2,opm:15,g3:8,debt:27,frn:52,lo:52300,hi:84500,dk:"메모리 세계 1위. 스마트폰·가전·파운드리 종합 IT. 메모리 가격 사이클을 크게 타요.",de:"World #1 memory; phones, appliances, foundry. Rides the memory cycle."}},{t:"000660",nk:"SK하이닉스",ne:"SK Hynix",s:"semi",price:42e4,beta:1.5,vol:46,per:9,pbr:2.6,dy:.4,al:25,x:{mcap:300,roe:21,opm:35,g3:22,debt:60,frn:55,lo:21e4,hi:46e4,dk:"HBM(AI 메모리) 선두. AI 투자 사이클의 최대 수혜주이자, 그만큼 사이클 위험도 커요.",de:"HBM (AI memory) leader. Biggest AI-cycle beneficiary — and cycle risk."}},{t:"042700",nk:"한미반도체",ne:"Hanmi Semi",s:"semi",price:9e4,beta:1.7,vol:55,per:30,pbr:8,dy:.3,al:35,x:{mcap:9,roe:28,opm:35,g3:45,debt:15,frn:35,lo:48e3,hi:13e4,dk:"HBM 공정 장비(TC본더) 강자. 성장성은 높지만 고객 집중도가 높아요.",de:"HBM bonder equipment leader. High growth, concentrated customers."}},{t:"373220",nk:"LG에너지솔루션",ne:"LG Energy",s:"battery",price:35e4,beta:1.3,vol:42,per:60,pbr:3.5,dy:0,al:-18,x:{mcap:82,roe:5,opm:4,g3:15,debt:90,frn:10,lo:29e4,hi:45e4,dk:"글로벌 배터리 2위. 북미 투자 확대 중. EV 수요와 보조금 정책에 민감해요.",de:"Global #2 battery maker. NA expansion; sensitive to EV demand & subsidies."}},{t:"006400",nk:"삼성SDI",ne:"Samsung SDI",s:"battery",price:25e4,beta:1.35,vol:45,per:25,pbr:1,dy:.4,al:-22,x:{mcap:17,roe:4,opm:3,g3:5,debt:70,frn:40,lo:18e4,hi:34e4,dk:"프리미엄 배터리·전자재료. 수익성 중심 전략이지만 EV 수요 둔화 영향권.",de:"Premium batteries & materials. Profit-focused; exposed to EV slowdown."}},{t:"247540",nk:"에코프로비엠",ne:"EcoPro BM",s:"battery",price:11e4,beta:1.8,vol:60,per:45,pbr:6,dy:0,al:2,x:{mcap:11,roe:8,opm:3,g3:30,debt:120,frn:8,lo:7e4,hi:21e4,dk:"양극재 대표주. 2023년 테마 급등의 주인공. 변동성이 매우 커요.",de:"Cathode materials flagship; 2023 theme-rally star. Very volatile."}},{t:"086520",nk:"에코프로",ne:"Ec  a volume you can bear. β is a historical estimate with ±0.1–0.2 of error built in."}},vol:{ko:{name:"변동성 (σ)",what:"1년 동안 수익률이 보통 얼마나 위아래로 출렁이는지예요.",ana:"롤러코스터의 높이차예요. 변동성 30%면 평범한 해에도 ±30%의 오르내림은 '정상 운행'이라는 뜻이에요.",act:"출렁임에 놀라 팔면 손실이 확정돼요. 견딜 수 있는 높이의 롤러코스터만 타세요."},en:{name:"Volatility (σ)",what:"How much returns typically swing up and down in a year.",ana:"The height gap of a rollercoaster. 30% vol means ±30% swings are 'normal operation'.",act:"Selling in a scare locks in the loss. Ride only coasters whose drops you can stomach."}},effn:{ko:{name:"실효 종목 수",what:"비중까지 고려했을 때 실질적으로 몇 종목에 분산되어 있는지예요.",ana:"계란을 나눠 담은 바구니 수예요. 10종목을 사도 한 종목이 60%면 바구니는 사실상 2~3개뿐이에요.",act:"바구니가 많을수록 하나를 떨어뜨려도 아침식사는 지킬 수 있어요. 권장 범위까지 늘려보세요."},en:{name:"Effective # of stocks",what:"How many stocks you're really diversified across, weight-adjusted.",ana:"Baskets your eggs are split into. Ten stocks with one at 60% is really 2–3 baskets.",act:"More baskets means one drop won't ruin breakfast. Work toward your recommended range."}},sector:{ko:{name:"섹터 쏠림",what:"가장 큰 산업 하나가 포트폴리오에서 차지하는 비중이에요.",ana:"우산 장수와 짚신 장수 이야기예요. 비 오는 날엔 우산이, 맑은 날엔 짚신이 팔리죠. 한 산업에만 몰면 날씨(업황) 하나에 전부가 걸려요.",act:"같은 산업은 함께 오르내려요. '여러 종목'이 아니라 '여러 산업'이 진짜 분산이에요."},en:{name:"Sector concentration",what:"The share of your largest single industry.",ana:"The umbrella seller and the sandal seller: umbrellas sell in rain, sandals in sun. Bet on one and everything rides on the weather (the industry cycle).",act:"Same-industry stocks move together. Real diversification is many industries, not many tickers."}},sharpe:{ko:{name:"위험 대비 효율 (샤프 비율)",what:"감수한 위험(변동성) 한 단위당 무위험 이자보다 얼마나 더 벌었는지예요.",ana:"자동차의 연비예요. 위험이라는 연료 1을 태워서 초과수익이라는 거리를 얼마나 가느냐 — 같은 거리라면 연료를 덜 쓰는 차가 좋은 차죠.",act:"내 포트폴리오와 인덱스의 샤프를 비교해보세요. 인덱스보다 낮다면, 연료(위험)는 더 쓰면서 덜 가는 중이라는 뜻이에요."},en:{name:"Sharpe ratio",what:"Extra return over the risk-free rate per unit of volatility.",ana:"Fuel efficiency: distance (excess return) per liter of fuel (risk). At equal distance, the thriftier car wins.",act:"Compare yours to the index. Lower means burning more fuel to travel less."}},r2:{ko:{name:"시장 동조율 (R²)",what:"내 포트폴리오 움직임 중 몇 %가 시장 전체의 흐름으로 설명되는지예요.",ana:"에스컬레이터 위에서 걷는 것과 같아요. 동조율 85%면 내 상승의 85%는 에스컬레이터(시장)가 만든 것이고, 내가 걸어 올라간 몫은 15%뿐이에요.",act:"동조율이 높은데 인덱스보다 성과가 낮다면, 비싼 수고로 인덱스를 흉내 내는 셈이에요. 그럴 바엔 인덱스가 낫죠."},en:{name:"Market sync (R²)",what:"The % of your portfolio's movement explained by the overall market.",ana:"Walking on an escalator. At 85% sync, the escalator (market) does 85% of your rise; your own steps add 15%.",act:"High sync but worse than the index means imitating the index expensively. Just buy the index then."}},ret:{ko:{name:"기대수익률",what:"CAPM으로 계산한, 감수한 위험에 대해 '시장이 쳐주는' 연평균 보상이에요.",ana:"위험을 감수한 대가로 시장이 주는 '월급'이에요. 무위험 이자 + (β × 시장 위험 프리미엄).",act:"이건 약속이 아니라 장기 평균 기대치예요. 어떤 해는 훨씬 좋고 어떤 해는 훨씬 나쁠 거예요."},en:{name:"Expected return",what:"The average annual compensation the market 'pays' for your risk, per CAPM.",ana:"A salary for carrying risk: risk-free rate + (β × market risk premium).",act:"A long-run average, not a promise. Some years will be far better, some far worse."}},cagr:{ko:{name:"복리 수익률 (CAGR)",what:"출렁임(변동성)의 감가를 반영한, 장기적으로 실제 쌓이는 연 수익률이에요.",ana:"지그재그로 달리는 차는 직선으로 달리는 차보다 늦게 도착해요. 변동성이 클수록 평균수익률보다 실제 복리수익률이 낮아져요 (≈ 평균 − ½σ²).",act:"변동성을 줄이는 것만으로 장기 복리 수익이 좋아질 수 있어요. 분산이 '공짜 점심'인 이유예요."},en:{name:"CAGR",what:"The annual return that actually compounds long-term, after volatility drag.",ana:"A zigzagging car arrives later than one driving straight. More volatility, bigger gap below the average (≈ mean − ½σ²).",act:"Cutting volatility alone can raise long-run compounding. That's why diversification is the free lunch."}},per:{ko:{name:"PER",what:"주가가 연간 이익의 몇 배인지예요. 낮을수록 '이익 대비 싸다'는 뜻이지만…",ana:"치킨집 인수 가격이에요. 연 순이익 5천만원인 가게를 5억에 사면 PER 10 — 본전까지 10년. 그런데 올해 이익이 유난히 좋았거나 나빴다면? 착시가 생기죠.",act:"섹터마다 정상 범위가 달라요. 종목 카드의 '이 섹터를 볼 땐' 힌트를 꼭 함께 읽으세요."},en:{name:"PER",what:"Price as a multiple of annual earnings. Lower looks cheaper, but…",ana:"Buying a chicken shop: ₩500m for ₩50m/yr profit is PER 10 — ten years to break even. If this year's profit was unusual, the multiple deceives.",act:"Normal ranges differ by sector — always read the sector lens hint on the stock card."}},alpha:{ko:{name:"알파 (α)",what:"위험(β)에 대한 정당한 보상을 빼고 남는 초과수익이에요. 이게 진짜 '종목 선택 실력'의 몫이죠.",ana:"에스컬레이터(시장)가 올려준 것 말고, 내 두 발로 걸어 올라간 몫이에요. 시장이 올라서 번 건 실력이 아니에요.",act:"이 도구는 '과거 알파'는 보여드리지만 '미래 알파 예측'은 보여드리지 않아요. 과거 알파가 이어질 확률은 동전 던지기에 가깝고(SPIVA), 예측 숫자는 과신만 키우거든요. 확실한 알파를 약속하는 사람은 일단 의심하세요."},en:{name:"Alpha (α)",what:"Return left over after fair compensation for risk (β) — the true stock-picking skill share.",ana:"The steps you climbed yourself, beyond what the escalator (market) gave you. Market gains aren't skill.",act:"We show PAST alpha but never a forecast: past alpha persists at roughly coin-flip odds (SPIVA), and a forecast number only breeds overconfidence. Distrust anyone promising certain alpha."}}},ml={appName:{ko:"뱁새",en:"Baepsae"},appSub:{ko:"내 그릇에 맞는 포트폴리오",en:"Risk-first portfolio"},tab1:{ko:"① 프로필",en:"① Profile"},tab2:{ko:"② 포트폴리오",en:"② Build"},tab3:{ko:"③ 내보내기",en:"③ Export"},disclaimer:{ko:"교육용 도구입니다. 투자 자문이 아니며, 모든 판단과 책임은 본인에게 있습니다.",en:"An educational tool — not investment advice. All decisions and responsibility are your own."},skipPreset:{ko:"질문 건너뛰고 프리셋으로 시작하기",en:"Skip questions, pick a profile"},presetTitle:{ko:"프로필 고르기",en:"Pick a profile"},presetSub:{ko:"대충 이 정도다 싶은 걸 고르세요. 세부 수치는 나중에 언제든 바꿀 수 있어요.",en:"Start from a preset; fine-tune anytime."},profileTitle:{ko:"나의 투자 프로필",en:"My Investor Profile"},capacity:{ko:"위험 감수 능력",en:"Risk capacity"},tolerance:{ko:"위험 감수 의지",en:"Risk tolerance"},need:{ko:"필요 수익률",en:"Required return"},capacityHint:{ko:"능력 = 잃어도 되는가 (형편)",en:"Ability (circumstances)"},toleranceHint:{ko:"의지 = 견딜 수 있는가 (마음)",en:"Willingness (psychology)"},needHint:{ko:"목표 달성에 필요한 수익률",en:"Return the goal requires"},targetBeta:{ko:"목표 베타",en:"Target beta"},targetVol:{ko:"변동성 상한",en:"Vol ceil 요. 그 근거가 실제로 있었는지는 '알파' 섹션에서 확인해볼 수 있어요.",en:"Zero means simply buying the index. The moment you pick individual companies this rises — and that's not a mistake, it's the admission fee for trying to beat the market. It only pays off if you genuinely know something others don't, which the alpha section puts to the test."},sxW:{ko:"내가 잘하고 있는 것",en:"What I'm doing right"},sxWs:{ko:"이미 지켜낸 것들과 그 값어치",en:"What you've already got right, and what it's worth"},sxR:{ko:"내 수익은 어디서 나오나요?",en:"Where do my returns come from?"},sxRs:{ko:"기대수익의 출처와 배당",en:"Sources of expected return, and dividends"},wdTitle:{ko:"잘하고 있는 것",en:"Going right"},wdTodo:{ko:"아직 남은 것",en:"Still open"},raTitle:{ko:"내 수익은 어디서 나오나요",en:"Where returns come from"},raSub:{ko:"기대수익은 '가만히 둬도 받는 이자'와 '위험을 감수한 대가'로 나뉘어요.",en:"Expected return splits into the interest you'd get anyway and the reward for taking risk."},raByCls:{ko:"자산군별 기여",en:"Contribution by asset class"},raTop:{ko:"기대수익 기여 상위",en:"Top contributors"},raVerdict:{ko:"배당은 시장이 어떻든 실제로 통장에 들어오는 몫이고, 나머지는 주가가 올라야 생기는 몫이에요. 둘의 비율이 곧 '기다릴 수 있는 힘'을 결정해요.",en:"Dividends actually arrive regardless of the market; the rest requires prices to rise. That ratio determines how long you can wait."},ftTitle:{ko:"내 포트폴리오의 성향 (팩터)",en:"My portfolio's tilts (factors)"},ftSub:{ko:"같은 '주식'이라도 어떤 성격의 주식을 모았는지가 성과를 크게 갈라요. 시장 평균과 비교한 위치예요.",en:"Which kind of stocks you own drives much of the outcome. This shows your position against the market average."},ftNone:{ko:"성향을 계산할 데이터가 아직 부족해요. 시세 데이터가 갱신되면 표시됩니다.",en:"Not enough data yet — this appears once live data is in place."},ftNote:{ko:"보유 종목의 특성(시가총액·PBR·12개월 수익률·ROE)을 시장 내 백분위로 환산해 가중평균한 값이에요. 정식 팩터 회귀분석 결과는 아니에요.",en:"A weighted average of holdings' characteristic percentiles (size, PBR, 12-month return, ROE) — not a formal factor regression."},srTitle:{ko:"순서의 위험 — 언제 나쁜 해가 오는가",en:"Sequence risk — when the bad years hit"},srSub:{ko:"돈을 빼 쓰는 동안에는, 평균 수익률이 같아도 '나쁜 해가 먼저 오는지'에 따라 결과가 크게 달라져요.",en:"While withdrawing, identical average returns produce very different outcomes depending on whether the bad years come first."},srRate:{ko:"매년 빼 쓸 비율",en:"Annual withdrawal"},srGood:{ko:"좋은 해가 먼저 왔다면",en:"Good years first"},srBad:{ko:"나쁜 해가 먼저 왔다면",en:"Bad years first"},srNote:{ko:"같은 수익률 묶음의 순서만 바꿔 계산한 시뮬레이션이에요. 은퇴 직후 몇 년이 특히 중요한 이유이고, 그래서 그 시기엔 위험을 줄이는 게 일반적인 조언이에요.",en:"A simulation using the same set of returns in different orders. This is why the first years of retirement matter so much, and why reducing risk then is standard advice."},tabPop:{ko:"인기",en:"Popular"},tabFav:{ko:"관심",en:"My picks"},tabSec:{ko:"업종별",en:"By sector"},popNote:{ko:"거래대금·시가총액 기준이에요. 많이 거래된다고 좋은 종목은 아니에요 — 그냥 눈에 많이 띄는 종목일 뿐이에요.",en:"Ranked by turnover and market cap. Heavily traded doesn't mean good — just visible."},noHit:{ko:"찾는 종목이 없어요. 코드(예: 005930, AAPL)로도 찾아보세요.",en:"No match. Try the ticker (e.g. 005930, AAPL)."},more50:{ko:"상위 50개만 보여드려요. 더 좁혀서 검색해보세요.",en:"Showing the top 50 — narrow your search."},slotExit:{ko:"저장하고 나가기",en:"Save and exit"},taxTitle:{ko:"세금",en:"Taxes"},taxYear:{ko:"예상 세금",en:"Estimated tax"},taxNet:{ko:"세후 기대수익",en:"After-tax return"},taxDivKr:{ko:"국내 배당소득세",en:"KR dividend tax"},taxDivUs:{ko:"해외 배당 원천징수",en:"US dividend withholding"},taxGainUs:{ko:"해외주식 양도소득세",en:"Foreign capital gains"},taxNote:{ko:"2026-01 기준 추정이며 세무 자문이 아니에요. 국내주식 매매차익은 소액주주라면 비과세, 해외주식은 연 250만원 공제 후 22%예요. 국내 상장 채권 ETF의 매매차익은 배당소득세 15.4% 대상이라 아래 계산과 달라요. 금융소득이 연 2,000만원을 넘으면 종합과세 대상이 될 수 있어요. 실제 세액은 개인 상황에 따라 달라지니 확정 신고 전엔 전문가와 확인하세요.",en:"Estimates as of 2026-01, not tax advice. Domestic stock gains are untaxed for most retail investors; foreign gains are taxed at 22% above a ₩2.5m annual deduction. Financial income above ₩20m/yr may trigger comprehensive taxation. Confirm with a professional."},fxTitle:{ko:"환전 안내",en:"Currency exchange"},fxNeed:{ko:"필요한 달러",en:"USD needed"},fxFee:{ko:"환전 수수료",en:"FX fee"},fxCost:{ko:"환전에 드는 원화",en:"KRW required"},fxNote:{ko:"증권사마다 환전 우대율이 달라요(보통 0.1~1%). 미리 환전해두거나 통합증거금을 쓰면 수수료를 .","호황 뉴스가 가장 많을 때가 주가는 이미 반영을 끝냈을 때예요."]},bank:{ko:"은행",tldr:["금리 차이로 버는 사업이에요. 기준금리가 실적의 배경이에요.","이익만큼 중요한 게 부실(연체율)이에요.","성장보다 배당·주주환원으로 평가받는 업종이에요."],tags:["경기민감","B2C·B2B","규제산업"],eq:[["이익","+"],["=",""],["예대마진","n"],["×",""],["대출 규모","n"],["−",""],["대손비용","-"]],eqnote:"예대마진 ← 기준금리 · 대출 규모 ← 부동산·경기 · 대손비용 ← 연체율",switches:[["금리가 오르면","마진이 좋아져요","+"],["부동산이 얼면","연체가 늘어요","-"],["규제가 세지면","이익이 눌려요","-"]],lev:"이익의 원천인 대출이 곧 위험의 원천이에요. 호황에 늘린 대출이 불황에 대손비용으로 돌아와요.",ask:["금리 사이클의 어디인가 — 인상기 끝물이면 마진 개선도 끝물이에요.","연체율이 바닥을 지났나.","CET1 비율이 배당을 지킬 만큼 든든한가."],chain:["돈의 흐름은 단순해요. 예금자 → 은행 → 대출자(가계 주택대출 · 기업대출)로 흘러요.","국내 상장사는 대부분 금융지주예요. 은행이 이익의 몸이고, 카드·증권·보험 자회사가 붙어 있어요.","경쟁 상대는 같은 은행만이 아니에요. 인터넷은행이 낮은 비용으로 예금·대출을 파고들어요.","정부가 사실상 판의 심판이에요. 대출 총량·금리·수수료에 개입할 수 있는 업이라는 걸 전제로 봐야 해요."],money:["싸게 빌려서(예금) 비싸게 빌려줘요(대출). 그 차이가 순이자마진(NIM)이고, 은행 이익의 몸이에요.","대출이 부실해지면 손실을 미리 쌓아요(대손충당금). 이익은 NIM에서 충당금을 뺀 값으로 움직여요."],cycle:["금리가 오르면 NIM이 좋아져 이익이 늘어요. 대신 너무 오르면 못 갚는 대출이 늘어 충당금이 커져요.","경기와 부동산이 은행의 큰 배경이에요. 부동산 침체는 시차를 두고 은행 손실로 와요."],metrics:[["NIM(순이자마진)","은행의 기본 수익성이에요. 0.1%p 변화도 이익에 커요."],["연체율·고정이하여신비율","대출의 건강 상태예요. 오르기 시작하면 주의 신호예요."],["보통주자본비율(CET1)","배당 여력을 정해요. 13% 위면 주주환원을 늘릴 여지가 커요."],["PBR과 배당수익률","은행주는 성장보다 환원으로 평가받아요. PBR 1배 아래가 오래 이어진 이유를 아는 게 공부예요."]],traps:["배당수익률이 높다고 바로 사면, 배당의 원천인 이익이 꺾이는 시점을 놓칠 수 있어요.","정부 정책(대출 규제·상생금융)이 이익에 직접 개입해요. 규제 뉴스는 실적 뉴스만큼 중요해요."]},bio:{ko:"제약·바이오",tldr:["대부분의 회사는 아직 파는 약이 없어요. 가치는 미래의 확률이에요.","임상 뉴스 하나에 하루 ±20%가 드물지 않아요.","PER·PBR이 거의 통하지 않는 업종이에요."],tags:["경기둔감","기술주도","확률사업"],eq:[["기대가치","+"],["=",""],["성공 확률","n"],["×",""],["성공 시 시장","n"],["−",""],["개발비·시간","-"]],eqnote:"성공 확률 ← 임상 단계 · 시장 크기 ← 질환·경쟁약 · 시간 ← 현금이 버티는 햇수",switches:[["임상이 성공하면","가치가 계단식으로 뛰어요","+"],["금리가 오르면","먼 미래 이익의 값이 깎여요","-"],["기술이전이 나오면","외부 검증을 받은 거예요","+"]],lev:"매출 없이 개발비만 나가는 회사가 많아요. 현금이 소진되면 유상증자로 주주 지분이 희석되는 구조예요.",ask:["이 회사의 현금은 몇 년을 버티나.","파이프라인은 몇 상에, 몇 개나 있나.","나는 이 약의 성공 확률을 판단할 수 있는 사람인가."],chain:["약 하나가 시장에 나오는 길: 후보물질 발굴 → 임상 1·2·3상 → 승인 → 판매. 10년 넘게 걸려요.","국내 회사의 자리는 셋 중 하나예요. 신약 개발사(임상 뉴스로 움직임), 위탁생산 CMO(공장 가동률로 움직임), 제네릭·바이오시밀러(가격 경쟁으로 움직임).","개발사는 보통 글로벌 제약사에 기술을 팔아요(기술이전). 직접 3상까지 가는 회사는 드물어요. 계약금과 단계별 성공보수가 매출의 형태예요.","같은 '바이오'라도 세 자리는 완전히 다른 사업이에요. 어느 자리인지부터 확인하세요."],money:["신약 개발사는 성공하면 특허로 10년 넘게 독점 이익을 얻어요. 대신 개발 확률이 낮고 기간이 길어요.","임상 1상에서 최종 승인까지 가는 확률은 10% 안팎이에요. 대부분의 회사는 아직 파는 약이 없어요.","제네릭·CMO(위탁생산)는 다른 사업이에요. 이쪽은 공장 가동률과 수주로 움직이는 제조업이에요."],cycle:["이 업종의 사이클은 경기가 아니라 임상 발표와 기술이전 뉴스예요. 하루에 ±20%가 드물지 않아요.","금리가 오르면 특히 약해요. 이익이 먼 미래에 있어서, 할인율이 오르면 현재 가치가 크게 줄어요."],metrics:[["파이프라인 단계","몇 상인지, 몇 개인지가 회사 가치의 대부분이에요. 3상이 1상보다 훨씬 무거워요."],["현금과 소진 속도","적자 회사는 현금이 곧 수명이에요. 몇 년 버틸지 나눠보세요."],["기술이전(L/O) 실적","글로벌 제약사가 돈을 냈다는 건 외부 전문가의 검증이에요."],["매출 있는 회사인지","매출이 있으면 제조업 지표(성장·마진)로, 없으면 파이프라인과 현금으로 보세요."]],traps:["PER·PBR이 이 업종에선 거의 안 통해요. 적자에 자산도 적은 회사가 많아요.","임상 성공 뉴스에 사면 늦는 경우가 많아요. 기대가 이미 가격에 들어가 있어요.","'혁신 신약 기대'만으로 시가총액이 조 단위인 회사도 있어요. 실패하면 되돌아갈 바닥이 깊어요."]},ship:{ko:"조선",tldr:["오늘 실적은 2~3년 전 계약의 결과예요.","지금을 보려면 실적이 아니라 수주잔고와 선가를 보세요.","10년 넘는 초장기 사이클 산업이에요."],tags:["경기민감","B2B","수주산업"],eq:[["이익","+"],["=",""],["건조량","n"],["×",""],["(선가 − 원가)","n"]],eqnote:"건조량 ← 도크 능력 · 선가 ← 수주 당시 협상 · 원가 ← 후판 가격·인건비",switches:[["해운 운임이 오르면","1~2년 뒤 발주가 늘어요","+"],["후판이 오르면","마진이 눌려요","-"],["환경 규제가 세지면","교체 발주가 당겨져요","+"]],lev:"지금 짓는 배의 가격은 몇 년 전에 정해졌는데 원가는 지금 것이에요. 이 어긋남이 흑자와 적자를 오가게 해요.",ask:["수주잔고가 몇 년 치인가.","잔고의 선가는 오른 뒤 받은 것인가, 저가 수주인가.","후판 가격 흐름이 마진을 돕고 있나."],phases:["운임 상승","발주 증가","건조·인도","공급 과잉","발주 절벽"],marker:"주가는 발주 소식에 먼저 움직이고, 실적은 2~3년 뒤에 따라와요.",chain:["발주처(선주·해운사) → 조선소 → 기자재(엔진·후판·조선기자재사)로 판이 짜여요.","국내 대형 3사는 고부가선(LNG운반선 등)에 강해요. 중국은 물량, 한국은 기술로 나뉘어요.","조선소가 바쁘면 기자재사가 따라 바빠져요. 대형사 수주잔고는 기자재사의 선행 지표이기도 해요.","해운 운임이 좋아야 선주가 배를 주문해요. 운임 → 발주 → 실적의 순서로, 단계마다 1~2년씩 시차가 있어요."],money:["배를 주문받아 2~3년 걸려 만들어 넘겨요. 오늘의 매출은 2~3년 전 계약의 결과예요.","그래서 지금 실적보다 수주잔고(앞으로 만들 일감)가 미래를 말해줘요.","선가(배 가격)가 오른 뒤 받은 주문이 실적이 되기까지 시차가 있어요. 이 시차가 조선주 투자의 핵심이에요."],cycle:["배는 20~25년 쓰고 바꿔요. 그래서 교체 사이클이 10년 넘게 길어요.","환경 규제(친환경 연료선)가 교체를 앞당기면 슈퍼사이클이 와요. 반대로 발주 절벽이 오면 몇 년을 버텨야 해요."],metrics:[["수주잔고","몇 년 치 일감인지가 첫 질문이에요. 2년 아래면 불안, 3년 위면 든든해요."],["신조선가 지수","배 가격 지수예요. 오르는 동안 받은 주문이 미래 마진이에요."],["후판 가격","배 원가의 큰 몫이 철판이에요. 후판이 오르면 마진이 눌려요."],["건조 마진(영업이익률)","저가 수주 물량이 소화됐는지 여기서 확인돼요."]],traps:["수주 뉴스와 이익은 달라요. 싸게 받은 주문은 매출이 늘어도 적자를 만들어요.","사이클 후반에 PER이 낮아 보이는 건 반도체와 같은 함정이에요."]},defense:{ko:"방산·항공우주",tldr:["고객이 정부라 계약이 크고 길어요.","성장은 수출이 끌어요. 외교가 영업이에요.","한 번 팔면 수십 년 후속 매출이 붙어요."],tags:["경기둔감","B2G","수주산업"],eq:[["이익","+"],["=",""],["수주잔고 소화","n"],["×",""],["양산 마진","n"],["+",""],["후속 지원","+"]],eqnote:"잔고 ← 지정학·국방예산 · 마진 ← 양산 단계 · 후속 ← 누적 판매량",switches:[["지정학 긴장이 커지면","각국 예산이 늘어요","+"],["큰 수출 계약이 미뤄지면","기대가 되돌아가요","-"],["양산이 본격화되면","마진이 계단식으로 좋아져요","+"]],lev:"개발 단계엔 돈을 쓰고 양산 단계에 벌어요. 같은 무기라도 몇 번째 양산분인지에 따라 마진이 달라요.",ask:["잔고 몇 년 치에, 수출 비중은 얼마인가.","기대에 반영된 계약은 확정인가 협상 중인가.","긴장이 풀리면 이 주가는 어떻게 되나."],chain:["정부(국방부·방위사업청) → 체계종합업체 → 수백 개 부품 협력사로 내려가는 피라미드예요.","수출은 정부 간 거래가 많아요. 회사 영업만으로 안 되고, 외교와 금융 지원이 함께 움직여요.","한 번 무기를 사면 수십 년 그 체계에 묶여요. 후속 탄약·정비·업그레이드가 이어지는 잠금 효과가 이 업의 힘이에요.","큰 계약 하나가 몇 년 실적을 정해요. 고객 집중이 크다는 뜻이기도 해요."],money:["고객이 정부예요. 계약이 크고 길어서, 한 번 수주하면 5~10년 매출이 보여요.","수출이 성장의 몸이에요. 내수는 안정적이지만 크게 늘지 않아요.","무기는 팔고 끝이 아니라 유지·보수·탄약으로 수십 년 후속 매출이 붙어요."],cycle:["경기 사이클보다 지정학이 사이클이에요. 전쟁·긴장은 각국 국방예산을 늘리고, 그 예산이 몇 년에 걸쳐 발주로 이어져요.","수출 계약은 정부 간 협상이라 뉴스가 먼저, 계약은 한참 뒤예요. 기대와 확정 사이가 길어요."],metrics:[["수주잔고","조선과 같아요. 몇 년 치 일감인지가 기본이에요."],["수출 비중","성장률과 마진 모두 수출이 내수보다 좋아요."],["영업이익률 추이","양산이 본격화되면 마진이 계단식으로 좋아지는 사업이에요."]],traps:["'수출 협상 중' 뉴스로 오른 주가는 계약이 미뤄지면 그대로 되돌아가요.","지정학 긴장이 풀리는 것도 위험이에요. 평화는 이 업종의 역풍이에요."]},battery:{ko:"2차전지",tldr:["고객(완성차)의 판매가 곧 내 매출이에요.","광물 가격이 판가에 연동돼 매출이 같이 출렁여요.","기대가 실적보다 몇 년 앞서 달리던 업종이에요."],tags:["경기민감","B2B","고정비형"],eq:[["이익","+"],["=",""],["출하량","n"],["×",""],["판가 − 원가","n"],["−",""],["신공장 고정비","-"]],eqnote:"출하량 ← 고객 전기차 판매 · 판가 ← 광물 연동 · 고정비 ← 증설 속도",switches:[["전기차 보조금이 줄면","수요가 늦춰져요","-"],["리튬이 내리면","매출도 같이 줄어 보여요","-"],["고객 판매가 살아나면","가동률과 이익이 함께 돌아와요","+"]],lev:"공장을 미리 크게 지어놓는 사업이라, 가동률이 떨어지면 고정비가 그대로 손실이 돼요. 성장 둔화가 이익엔 몇 배로 아픈 이유예요.",ask:["내 회사 고객의 전기차가 실제로 팔리고 있나.","가동률은 어느 방향인가.","수주잔고와 올해 매출을 혼동하고 있지 않나."],phases:["보급 기대","대규모 증설","수요 둔화","가동률 하락","재조정"],marker:"기대가 만든 주가는 판매 숫자가 확인될 때 검증받아요.",chain:["광물(리튬·니켈) → 소재(양극재·음극재·분리막·전해질) → 셀 → 완성차로 이어져요.","국내는 소재와 셀에 몰려 있어요. 양극재가 배터리 원가의 40% 안팎이라 소재 중 가장 커요.","셀 회사는 완성차와 합작공장을 지어요. 고객과 한 몸이 되는 대신, 그 고객의 판매 부진을 같이 맞아요.","중국이 세계 최대 경쟁자예요. 미국·유럽의 중국 견제가 국내 회사엔 기회이자, 정책이 바뀌면 위험이에요."],money:["전기차 회사에 배터리를 만들어 팔아요. 고객사(완성차)의 판매량이 곧 매출이에요.","셀 회사(LG에너지솔루션 등)와 소재 회사(양극재 등)로 나뉘어요. 소재는 셀보다 고객이 좁고 가격 협상력이 약해요.","수주는 몇 년 치를 미리 받지만, 실제 출하는 전기차가 팔려야 일어나요."],cycle:["전기차 보급 속도가 사이클이에요. 보조금·금리·충전 인프라가 수요를 밀고 당겨요.","리튬 등 광물 가격이 판가에 연동돼요. 광물이 내리면 매출도 같이 줄어 보이는 구조예요.","2023~24년의 급락처럼, 성장 기대가 앞서간 만큼 되돌림도 깊었어요."],metrics:[["고객사 전기차 판매량","내 회사가 아니라 고객의 판매 실적이 선행 지표예요."],["가동률","공장을 지어놓고 못 돌리면 고정비가 그대로 손실이에요."],["수주잔고와 실제 출하의 간극","잔고는 크지만 출하가 안 늘면 잔고는 숫자일 뿐이에요."],["광물 가격(리튬)","판가 연동 구조라 매출 증감을 먼저 설명해줘요."]],traps:["수주잔고 '수백조'는 10년 치 합계예요. 올해 매출과 혼동하면 안 돼요.","성장 업종이라는 이유로 PER 50배가 정당화되던 시기가 있었어요. 성장이 늦어지자 가격이 먼저 무너졌어요."]},platform:{ko:"인터넷·플랫폼",tldr:["사용자 시간이 원재료, 광고·수수료가 매출이에요.","성장률로 평가받는 업종이에요. 성장이 꺾이면 눈높이가 먼저 꺾여요.","다음 층(콘텐츠·핀테크·AI)의 속도가 관건이에요."],tags:["경기민감(광고)","B2C","인건비형"],eq:[["이익","+"],["=",""],["사용자 × 체류시간","n"],["×",""],["시간당 수익화","n"],["−",""],["인건비","-"]],eqnote:"사용자 ← 서비스 경쟁력 · 수익화 ← 광고 경기·수수료율 · 인건비 ← 채용 속도",switches:[["광고 경기가 식으면","매출이 먼저 느려져요","-"],["금리가 오르면","성장주 눈높이가 눌려요","-"],["비용을 조이면","이익이 빠르게 좋아져요","+"]],lev:"사용자 기반은 그대로인데 채용만 줄여도 이익이 확 좋아지는 구조예요. 반대로 성장 투자를 재개하면 마진이 다시 눌려요.",ask:["사용자와 체류시간은 아직 늘고 있나.","성장률에 걸맞은 눈높이인가 — 주가 분해로 확인해보세요.","다음 성장 층은 말인가 숫자인가."],chain:["국내 판은 사실상 네이버와 카카오 두 축이에요. 검색·커머스, 메신저·핀테크가 각각의 본진이에요.","돈의 흐름: 사용자 시간 → 광고주·판매자 → 플랫폼 수수료. 사용자에게 무료인 이유예요.","성장의 다음 층은 콘텐츠(웹툰) · 핀테크 · AI예요. 본진은 성숙했고, 시장은 다음 층의 성장 속도를 평가해요.","글로벌 빅테크가 사용자 시간을 두고 직접 경쟁해요. 국내 1등이 곧 안전을 뜻하지 않아요."],money:["사용자를 모아 광고·수수료·구독으로 돈을 바꿔요. 사용자가 머무는 시간이 원재료예요.","한 번 이기면 오래 이겨요(네트워크 효과). 대신 성장이 멈추면 시장의 평가가 빠르게 식어요.","인건비가 최대 비용이에요. 개발자 채용을 줄이면 이익이 바로 좋아지는 구조예요."],cycle:["광고 매출은 경기에 민감해요. 기업들이 어려우면 광고비부터 줄여요.","금리가 오르면 성장주 전체와 함께 눌려요. 이익이 미래에 있을수록 더 눌려요."],metrics:[["사용자 수와 사용 시간(MAU·DAU)","매출보다 먼저 움직이는 원천 지표예요."],["매출 성장률","이 업종은 성장률로 평가받아요. 20%대와 한 자릿수는 다른 회사 취급을 받아요."],["영업이익률 방향","성장에서 수익으로 넘어가는 시기엔 마진 개선이 주가를 끌어요."],["신사업(커머스·핀테크·AI) 비중","본업 성장이 꺾일 때 다음 이야기가 있는지예요."]],traps:["사용자는 그대로인데 주가만 기대로 오르는 구간이 있어요. 주가 분해에서 눈높이 몫이 커진 때예요.","규제(수수료·독점) 뉴스가 실적과 무관하게 평가를 바꿔요."]},media:{ko:"미디어·엔터",tldr:["아티스트가 자산인 사업이에요.","실적 달력이 이미 공개돼 있어요 — 컴백·투어·재계약·군입대.","팬심과 투자는 다른 문제예요."],tags:["경기둔감","B2C","IP사업"],eq:[["이익","+"],["=",""],["팬덤 크기","n"],["×",""],["1인당 지출","n"],["−",""],["제작·정산비","-"]],eqnote:"팬덤 ← 신보·투어 성과 · 지출 ← 앨범·MD·공연·플랫폼 · 정산 ← 재계약 조건",switches:[["새 앨범·투어가 흥행하면","분기 실적이 바로 좋아져요","+"],["주력 팀이 재계약하면","정산 비율이 올라 마진이 눌려요","-"],["현지화 그룹이 자리 잡으면","다음 성장 축이 생겨요","+"]],lev:"한 팀 의존도가 높을수록 그 팀의 일정(군입대·재계약)이 회사 전체의 위험이에요. 포트폴리오처럼 아티스트 분산을 보세요.",ask:["주력 팀 의존도가 얼마나 되나.","앞으로 2년의 컴백·공백 달력은 어떤가.","활동이 없어도 도는 매출(플랫폼·MD)이 커지고 있나."],chain:["엔터 대형사가 판의 중심이에요. 기획사가 아티스트를 만들고, 음원·공연·MD·팬 플랫폼으로 돈이 갈라져 들어와요.","제작 구조: 연습생 투자(비용) → 데뷔 → 팬덤 형성 → 앨범·공연·MD(수익). 앞에서 쓰고 뒤에서 버는 구조예요.","드라마·영화사는 방송사·OTT에 파는 납품업에 가까워요. OTT가 제작비를 대는 대신 판권을 가져가서, 흥행해도 이익이 제한되는 계약이 많아요.","K팝의 성장은 해외 매출이 끌어요. 해외 투어·현지화 그룹이 다음 성장의 축이에요."],money:["엔터사는 아티스트의 활동(앨범·공연·MD·광고)으로 돈을 벌어요. 아티스트가 자산이에요.","앨범과 공연이 매출의 몸이고, 팬 플랫폼·IP 사업이 이익률을 올려요.","콘텐츠(드라마·영화)사는 제작비를 먼저 쓰고 판권으로 회수해요. 흥행 변동이 커요."],cycle:["경기보다 아티스트 사이클이에요. 데뷔 → 성장 → 군입대·재계약이 실적 달력이에요.","재계약 시점엔 정산 비율이 올라 이익률이 눌리는 게 보통이에요."],metrics:[["앨범 판매량·공연 규모","분기 실적을 미리 보여주는 공개 지표예요."],["아티스트 포트폴리오","한 팀 의존도가 높으면 그 팀의 일정이 회사 전체의 위험이에요."],["재계약·군입대 일정","몇 년 뒤 실적 공백이 언제인지 달력에 이미 나와 있어요."],["팬 플랫폼·MD 매출 비중","활동이 없어도 도는 매출이 늘고 있는지예요."]],traps:["신인 데뷔 기대만으로 오른 주가는 데뷔 성과가 숫자로 확인될 때 검증받아요.","팬심과 투자는 달라요. 좋아하는 회사일수록 숫자를 한 번 더 보세요."]}},Rh=["semi","bank","bio","ship","defense","battery","platform","media"];var f=Ne(gt()),yf="baepsae_v12_dcf",vf=e=>e==null?"—":Math.abs(e)>=1e4?(e 지는 판인가, 돈이 되는 판인가'를 같이 판단할 수 있어요. 표본이 5개 미만인 업종은 성장률을 표시하지 않아요."},scatter:{t:"수익성과 주가 수준 (ROE × PBR)",b:"가로축은 자기자본이익률(ROE), 세로축은 주가순자산비율(PBR)이에요. 보통 자본을 잘 굴리는 회사일수록 장부가치 대비 높은 값에 거래되고, 점선 추세선이 그 평균적 관계예요. 추세선보다 한참 위면 수익성에 비해 높은 평가, 한참 아래면 낮은 평가를 받고 있다는 뜻인데 — 거기엔 대개 이유가 있어요. 그 이유를 찾는 것이 분석이에요."},box:{t:"업종별 시장 눈높이",b:"업종마다 시장이 쳐주는 값의 눈높이가 달라요. 굵은 점이 그 업종의 중간값, 옅은 막대가 가운데 절반(25~75%)이 모여 있는 구간이에요. 같은 PER 10배라도 어떤 업종에선 비싼 값, 어떤 업종에선 싼 값이에요 — 그래서 멀티플은 늘 같은 업종 안에서 읽어요. 점선은 시장 전체의 중간값이라, 어떤 업종이 시장 평균보다 후하게 또는 박하게 평가받는지도 보여요."},per:{t:"PER (주가수익비율)",b:"시장이 이 회사의 이익 1원에 몇 원을 내고 있는지예요. 높다는 건 시장이 앞으로의 성장을 크게 기대한다는 뜻이고, 그 기대가 실현되지 않으면 주가가 조정될 수 있다는 뜻이기도 해요. 적자 기업은 PER을 계산할 수 없어요."},pbr:{t:"PBR (주가순자산비율)",b:"회사 장부상 순자산 1원을 시장이 몇 원으로 평가하는지예요. 1배 미만은 장부가치보다 싸게 거래된다는 뜻인데, 그 자체로 저평가라기보다 '시장이 이 자산의 수익성을 의심한다'는 신호일 때가 많아요. ROE와 함께 읽어야 해요."},roe:{t:"ROE (자기자본이익률)",b:"주주 돈 100원으로 1년에 몇 원을 벌었는지예요. 꾸준히 높은 ROE는 좋은 사업의 흔적이지만, 부채를 늘려도 ROE는 올라가요 — 부채비율과 함께 보세요."},payout:{t:"배당성향",b:"번 이익 중 얼마를 배당으로 돌려주는지예요. 이익보다 배당이 큰 상태(100% 초과)가 이어지면 지속되기 어려워요."},ff:{t:"업종 내 위치",b:"지표 하나로는 회사를 판단할 수 없어요. PER·PBR·PSR·EV/EBITDA 같은 여러 지표에서 같은 업종 회사들 가운데 낮은 쪽인지 높은 쪽인지를 나란히 놓은 그림이에요. 파란 상자는 업종의 25~75% 구간, 주황 점이 이 회사의 위치예요. 낮다고 곧 싸다는 뜻은 아니에요 — 시장이 왜 이 위치에 두었는지 물어보는 출발점이에요."},dcf:{t:"DCF (현금흐름할인)",b:"미래 이익을 가정하고 현재 가치로 할인해 더하는 계산이에요. 여기서는 순이익을 현금흐름으로 근사하는 큰 단순화를 써요(실제로는 투자·운전자본 등으로 달라요). 그래서 이 도구의 목적은 '적정주가 찾기'가 아니라, 가정을 바꿀 때 값이 얼마나 민감하게 움직이는지, 그리고 지금 주가에는 어떤 성장 기대가 담겨 있는지를 보는 거예요."},tree:{t:"수익률 지도",b:"칸의 크기는 시가총액, 색은 최근 3개월 수익률이에요(붉은색 상승·푸른색 하락, 국내 시장 관례를 따랐어요). 시장의 돈이 최근 어디로 흘렀는지 한 화면에서 보는 용도이고, 색이 진하다고 좋거나 나쁜 종목이라는 뜻은 아니에요. 과거 수익률은 미래를 보장하지 않아요."},evebitda:{t:"EV/EBITDA",b:"시가총액에 순차입금을 더한 '기업 전체 가치(EV)'를 상각 전 영업이익(EBITDA)으로 나눈 값이에요. 부채까지 포함해 회사를 통째로 산다고 볼 때의 배수라서, 부채 구조가 다른 회사끼리 비교할 때 PER보다 공정할 때가 많아요. 상각비는 현금흐름표 기준 근사값이에요. 은행·보험·증권·지주는 사업 구조상 이 지표를 쓰지 않아요."},pocf:{t:"P/영업현금흐름",b:"시가총액을 영업활동으로 실제 들어온 현금으로 나눈 값이에요. 회계상 이익은 조정 여지가 있지만 현금은 비교적 정직해서, 이익과 현금흐름이 크게 다른 회사를 걸러내는 데 유용해요."},cmp:{t:"기업 비교",b:"같은 업종 회사들을 지표별로 나란히 놓은 표예요. 오른쪽 끝의 업종 중간값이 기준점 역할을 해요. 숫자가 큰 쪽이 항상 좋은 것도, 낮은 멀티플이 항상 싼 것도 아니에요 — 차이가 나는 항목에서 '왜?'를 묻는 것이 이 표의 사용법이에요."},trap:{t:"싼 값이 오래 싼 값으로 남는 이유",b:"한국 시장에서는 멀티플이 낮은 회사가 오래 낮은 채로 머무는 일이 흔해요. 격차가 좁혀지려면 계기가 필요한데 — 배당·자사주 같은 주주환원 확대, 지배구조 개선, 실적의 방향 전환 — 그 계기가 없으면 '싸다'는 상태가 몇 년씩 이어질 수 있어요. 그래서 낮은 PER·PBR은 결론이 아니라 질문이에요: 이 값이 제자리를 찾게 만들 계기가 있는가, 아니면 낮은 값에 그만한 이유가 있는가. 아울러 단기 주가는 실적보다 테마와 수급이 이끄는 날이 많다는 것도 한국 시장의 현실이에요 — 뱁새의 숫자들은 '오를 종목'이 아니라 '지금 가격에 담긴 가정'을 읽기 위한 것이에요."},screen:{t:"조건 검색",b:"지표와 성향으로 회사를 걸러내는 도구예요. 조건은 전부 내가 정해요. 뱁새는 걸러진 사실을 보여줄 뿐, 어떤 조합이 좋다고 말하지 않아요. 자주 쓰는 조건은 저장해두고 다시 돌릴 수 있어요."},factor:{t:"성향(팩터)",b:"숫자는 0~100 백분위예요. 가치 78이면 PBR 낮은 순으로 시장 상위 22%라는 뜻이에요. 다섯 성향의 기준: 가치(PBR 낮은 순) · 퀄리티(ROE 높은 순) · 모멘텀(최근 12개월 수익률 순) · 규모(시가총액 작은 순) · 저변동(변동성 낮은 순). 역사적으로 남다른 수익 패턴이 관찰됐지만, 10년 넘게 안 통한 시기도 있었어요. 내가 어느 성향에 몰려 있는지 아는 것이 이 숫자의 쓸모예요."},decomp:{t:"주가 분해",b:"주가는 주당이익(EPS)에 PER을 곱한 값이에요. 그래서 주가가 움직이면, 이익이 움직인 몫과 PER이 움직인 몫으로 나눠볼 수 있어요. 이익이 만든 상승은 회사가 번 거고, PER이 만든 상승은 시장의 기대예요. 기대는 식으면 되돌아가요."},rev:{t:"리버스 DCF",b:"계산 방향을 뒤집어서, '지금 주가가 정당화되려면 앞으로 몇 %씩 성장해야 하나'를 풉니다. 그 성장률이 회사의 과거와 업종 현실에 비추어 그럴듯한지 스스로 판단해보는 것 — 그게 이 도구의 핵심 질문이에요."}};function Qx({id:e,onClose:t}){if(!e||!Bh[e])return null;let n=Bh[e];return(0,f.jsx)("div",{onClick:t,style:{position:"fixed",inset:0,background:"rgba(28,43,69,0.35)",zIndex:90,display:"flex",alignItems:"flex-end",justifyContent:"center"},children:(0,f.jsxs)("div",{onClick:i=>i.stopPropagation(),style:{background:"#fff",borderRadius:"12px 12px 0 0",padding:"22px 20px 30px",maxWidth:560,width:"100%",fontFamily:E},children:[(0,f.jsx)("div",{style:{fontSize:15.5,fontWeight:800,color:a.ink},children:n.t}),(0,f.jsx)("div",{style:{fontSize:13.5,color:a.sub,lineHeight:1.75,marginTop:8},children:n.b}),(0,f.jsx)("button",{onClick:t,style:{marginTop:16,width:"100%",background:a.blue,color:"#fff",border:"none",borderRadius:xe.btn,padding:"12px",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:E},children:"알겠어요"})]})})}var Xx=[{x:1, "은행의 순이자마진. 대출금리와 조달금리의 차이로, 은행 수익성의 몸이에요."],["시가총액","주가 × 상장주식수. 시장이 매기는 회사 전체의 값이에요."],["알파","시장 대비 초과수익. 뱁새에선 과거 기록으로만 보여드리고, 미래를 약속하지 않아요."],["공매도","주식을 빌려서 판 뒤 나중에 사서 갚는 것. 주가 하락에 거는 방법이라 뉴스에 자주 나와요."],["유상증자","회사가 새 주식을 팔아 돈을 모으는 것. 주식 수가 늘어 내 지분 가치가 희석돼요."],["무상증자","이익잉여금을 자본금으로 옮기며 주식을 공짜로 나눠주는 것. 회사 가치는 그대로예요."],["감자","자본금을 줄이는 것. 보통 누적 손실을 지우려는 신호라 주의 깊게 봐야 해요."],["액면분할","한 주를 여러 주로 쪼개는 것. 값이 싸 보일 뿐 가치는 같아요."],["자사주 매입·소각","회사가 자기 주식을 사서 없애는 것. 주식 수가 줄어 주당 가치가 올라가는 주주환원이에요."],["배당기준일·배당락","배당 받을 권리가 정해지는 날과, 그 권리가 떨어져 주가가 조정되는 날이에요."],["배당성향","순이익 중 배당으로 주는 비율. 너무 높으면 이익이 줄 때 배당도 위태로워요."],["컨센서스","증권사 전망치의 평균. 실적이 이보다 좋으면 서프라이즈, 나쁘면 쇼크라고 불러요."],["잠정실적","확정 전 미리 발표하는 분기 숫자. 시장은 보통 이때 먼저 반응해요."],["가이던스","회사가 스스로 내놓는 실적 전망. 약속이 아니라 목표예요."],["공모주(IPO)","처음 상장하며 파는 주식. 청약 경쟁률과 보호예수 물량을 같이 봐야 해요."],["보호예수(락업)","대주주 등이 일정 기간 팔지 못하게 묶인 물량. 풀리는 날 매물 부담이 생길 수 있어요."],["오버행","언제든 시장에 나올 수 있는 잠재 매물. 전환사채·보호예수 해제 물량이 대표적이에요."],["전환사채(CB)","나중에 주식으로 바꿀 수 있는 채권. 전환되면 주식 수가 늘어 희석이 생겨요."],["블록딜","큰 물량을 장 밖에서 한 번에 넘기는 거래. 보통 시가보다 할인돼 다음 날 주가를 눌러요."],["물적분할·인적분할","사업을 떼어내는 두 방식. 물적분할 뒤 자회사 상장은 모회사 주주에게 불리할 수 있어 논쟁이 많아요."],["지주회사 할인","지주회사가 자회사 가치 합보다 싸게 거래되는 현상. 한국 시장에서 특히 커요."],["관리종목·상장폐지","거래소가 문제 있는 회사에 붙이는 경고와 퇴출. 재무 신호가 먼저 알려줄 때가 많아요."],["감사의견","회계법인이 재무제표에 주는 판정. '적정'이 아니면 큰 경고예요."],["코스피·코스닥","한국의 두 시장. 코스피는 대형·전통, 코스닥은 중소·기술 성향이에요."],["ETF","지수나 자산 묶음을 통째로 사는 상장 펀드. 뱁새의 금·채권 블록이 모두 ETF예요."],["레버리지·인버스 ETF","지수의 2배로, 또는 반대로 움직이게 설계된 ETF. 오래 들고 있으면 복리 손실이 쌓여 장기 투자엔 맞지 않아요."],["괴리율·NAV","ETF 시장가와 실제 자산가치(NAV)의 차이. 괴리가 크면 비싸게 사는 거예요."],["분배금","ETF가 주는 배당. 주식 배당과 달리 15.4% 세금이 원천징수돼요."],["ISA·연금저축·IRP","세금을 아껴주는 계좌들. 뱁새 세금 층이 계좌별 차이를 계산해줘요."],["신용융자·반대매매","증권사 돈을 빌려 사는 것과, 담보가 부족해지면 강제로 팔리는 것. 하락장을 더 가파르게 만들어요."],["미수거래","결제일까지 돈을 안 내고 사는 초단기 외상. 이틀 뒤 갚지 못하면 반대매매돼요."],["시간외거래·동시호가","정규장 밖의 거래와, 장 시작·마감 때 주문을 모아 한 번에 체결하는 방식이에요."],["상한가·하한가","하루 ±30%로 묶인 가격 제한. 붙으면 거래 자체가 어려워져요."],["VI(변동성완화장치)","주가가 급변하면 2분간 단일가로 바꾸는 브레이크. 과열 신호로 읽혀요."],["거래량·거래대금","얼마나 활발히 거래됐는지. 가격 움직임에
