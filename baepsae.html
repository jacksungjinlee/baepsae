your rise; your own steps add 15%.",act:"High sync but worse than the index means imitating the index expensively. Just buy the index then."}},ret:{ko:{name:"\uAE30\uB300\uC218\uC775\uB960",what:"CAPM\uC73C\uB85C \uACC4\uC0B0\uD55C, \uAC10\uC218\uD55C \uC704\uD5D8\uC5D0 \uB300\uD574 '\uC2DC\uC7A5\uC774 \uCCD0\uC8FC\uB294' \uC5F0\uD3C9\uADE0 \uBCF4\uC0C1\uC774\uC5D0\uC694.",ana:"\u{1F4B0} \uC704\uD5D8\uC744 \uAC10\uC218\uD55C \uB300\uAC00\uB85C \uC2DC\uC7A5\uC774 \uC8FC\uB294 '\uC6D4\uAE09'\uC774\uC5D0\uC694. \uBB34\uC704\uD5D8 \uC774\uC790 + (\u03B2 \xD7 \uC2DC\uC7A5 \uC704\uD5D8 \uD504\uB9AC\uBBF8\uC5C4).",act:"\uC774\uAC74 \uC57D\uC18D\uC774 \uC544\uB2C8\uB77C \uC7A5\uAE30 \uD3C9\uADE0 \uAE30\uB300\uCE58\uC608\uC694. \uC5B4\uB5A4 \uD574\uB294 \uD6E8\uC52C \uC88B\uACE0 \uC5B4\uB5A4 \uD574\uB294 \uD6E8\uC52C \uB098\uC060 \uAC70\uC608\uC694."},en:{name:"Expected return",what:"The average annual compensation the market 'pays' for your risk, per CAPM.",ana:"\u{1F4B0} A salary for carrying risk: risk-free rate + (\u03B2 \xD7 market risk premium).",act:"A long-run average, not a promise. Some years will be far better, some far worse."}},cagr:{ko:{name:"\uBCF5\uB9AC \uC218\uC775\uB960 (CAGR)",what:"\uCD9C\uB801\uC784(\uBCC0\uB3D9\uC131)\uC758 \uAC10\uAC00\uB97C \uBC18\uC601\uD55C, \uC7A5\uAE30\uC801\uC73C\uB85C \uC2E4\uC81C \uC313\uC774\uB294 \uC5F0 \uC218\uC775\uB960\uC774\uC5D0\uC694.",ana:"\u{1F422} \uC9C0\uADF8\uC7AC\uADF8\uB85C \uB2EC\uB9AC\uB294 \uCC28\uB294 \uC9C1\uC120\uC73C\uB85C \uB2EC\uB9AC\uB294 \uCC28\uBCF4\uB2E4 \uB2A6\uAC8C \uB3C4\uCC29\uD574\uC694. \uBCC0\uB3D9\uC131\uC774 \uD074\uC218\uB85D \uD3C9\uADE0\uC218\uC775\uB960\uBCF4\uB2E4 \uC2E4\uC81C \uBCF5\uB9AC\uC218\uC775\uB960\uC774 \uB0AE\uC544\uC838\uC694 (\u2248 \uD3C9\uADE0 \u2212 \xBD\u03C3\xB2).",act:"\uBCC0\uB3D9\uC131\uC744 \uC904\uC774\uB294 \uAC83\uB9CC\uC73C\uB85C \uC7A5\uAE30 \uBCF5\uB9AC \uC218\uC775\uC774 \uC88B\uC544\uC9C8 \uC218 \uC788\uC5B4\uC694. \uBD84\uC0B0\uC774 '\uACF5\uC9DC \uC810\uC
