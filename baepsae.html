eisure",color:"#E11D48"},index:{ko:"지수 ETF",en:"Index ETF",color:"#059669"},metal:{ko:"금·은",en:"Gold/Silver",color:"#E8B54A"},etc:{ko:"기타",en:"Other",color:"#94A3B8"}},Yt={kr:{ko:"한국 주식",en:"KR stocks",color:"#2C4C7C",flag:"KR",bench:"코스피"},us:{ko:"미국 주식",en:"US stocks",color:"#5E6AD2",flag:"US",bench:"S&P 500"},metal:{ko:"금·은",en:"Gold/Silver",color:"#E8B54A",flag:"AU",bench:"금 가격"},bond:{ko:"채권",en:"Bonds",color:"#4E8577",flag:"BD",bench:"국고채"}},ot=t=>vn[t]||{ko:"기타",en:"Other",color:"#94A3B8"},wy={semi:{ko:"PER보다 사이클 위치가 중요해요. 이익 바닥일 땐 PER이 높아 '비싸 보이는 착시', 고점일 땐 '싸 보이는 착시'가 생겨요. PBR과 업황을 함께 보세요.",en:"Cycle position beats PER. Trough earnings make PER look expensive; peak earnings make it look cheap. Watch PBR and the cycle."},elec:{ko:"누구에게 파는지가 핵심이에요. 대형 고객 한 곳에 매출이 몰려 있으면, 그 고객의 투자 계획이 곧 이 회사의 실적이 돼요.",en:"Who they sell to is the whole story. If revenue concentrates in one big customer, that customer's capex plan is this company's earnings."},battery:{ko:"성장 투자기라 이익이 눌려 PER이 왜곡돼요. 매출 성장률·수주(고객사)·자본 조달 여력을 먼저 보세요.",en:"Heavy growth capex distorts PER. Look at revenue growth, orders, and funding capacity first."},auto:{ko:"낮은 PER이 기본인 경기순환주예요. '싸다'가 아니라 '사이클 어디쯤인가'를 물어보세요. 배당과 주주환원도 핵심.",en:"Low PER is normal for this cyclical. Ask 'where in the cycle', not 'is it cheap'."},ship:{ko:"수주잔고가 미래 매출이에요. PER보다 수주잔고÷연매출(몇 년치 일감인지)과 선가 추이를 보세요.",en:"Order backlog is future revenue. Backlog ÷ annual sales and newbuild prices beat PER."},defense:{ko:"수주잔고와 정부 예산이 실적을 결정해요. 수출 계약 한 건이 몇 년치 실적을 바꾸는 구조라 뉴스에 크게 반응해요.",en:"Backlog and government budgets drive earnings; a single export deal can reset years of results."},machine:{ko:"전형적인 경기순환주예요. 고객 산업의 설비투자 사이클을 먼저 보고, 그다음에 밸류에이션을 보세요.",en:"A classic cyclical — read the customer industry's capex cycle before the multiple."},steel:{ko:"사이클 저점에선 PBR로, 고점에선 조심스럽게. 중국 수급이 가격을 흔들어요.",en:"Use PBR at cycle lows, be careful at peaks. China supply-demand moves prices."},chem:{ko:"정제마진·스프레드가 이익을 좌우하는 사이클 산업이에요. 현재 이익보다 스프레드 방향을 보세요.",en:"Spreads drive earnings. Watch spread direction, not current profits."},energy:{ko:"유가가 실적의 대부분을 결정해요. 인플레이션 국면에서 주식 포트폴리오의 완충재 역할을 하기도 해요.",en:"Oil prices drive earnings; can cushion an equity portfolio in inflationary stretches."},utility:{ko:"요금은 정부가 정해요. 실적보다 정책·규제 방향이 주가를 움직여요.",en:"Tariffs are set by government. Policy moves the stock more than earnings."},bio:{ko:"이익이 없어 PER이 무의미한 경우가 많아요. 파이프라인(임상 단계)·기술수출 계약이 가치의 대부분이에요. 변동성이 큰 이유죠.",en:"PER is often meaningless. Pipeline stage and licensing deals carry the value — hence the volatility."},health:{ko:"정책·보험 수가가 실적을 좌우해요. 성장은 완만하지만 경기 방어력이 있는 편이에요.",en:"Policy and reimbursement rates drive results; slower growth but defensive."},platform:{ko:"성장률과 이익률의 조합을 보세요. 성장이 꺾이면 멀티플이 급격히 낮아지는 구조예요.",en:"Watch the growth × margin combo. When growth stalls, the multiple derates fast."},game:{ko:"히트작 의존 산업이라 이익 변동이 커요. 신작 파이프라인과 기존작의 수명이 핵심.",en:"Hit-driven earnings swing hard. New pipeline and longevity of live titles are key."},media:{ko:"IP의 힘과 제작비 부담이 줄다리기해요. 구독자 증가율과 편당 수익성을 함께 보세요.",en:"IP strength versus production cost. Watch subscriber growth alongside per-title economics."},telecom:{ko:"성장보다 배당이 본질인 준(準)유틸리티예요. 배당수익률과 배당의 지속가능성을 보세요.",en:"A quasi-utility: dividends, not growth. Check yield and sustainability."},bank:{ko:"PBR과 ROE가 핵심이에요. 자본이 곧 원료인 산업이라 '자본 대비 얼마나 버는가'가 가치를 결정해요. 금리와 연체율도 함께 보세요.",en:"PBR and ROE rule. Capital is the raw material, so earnings on book equity set the value."},insure:{ko:"보험은 '받은 보험료를 굴려서 버는' 구조예요. 금리 방향과 손해율(들어온 보험료 대비 나간 보험금)을 보세요.",en:"Insurers earn on the float. Watch rates and the loss ratio."},broker:{ko:"거래대금과 시장 분위기에 실적이 직결돼요. 강세장에 잘 벌고 약세장에 급격히 줄어드는 구조예요.",en:"Earnings track trading volumes and sentiment — strong in bull markets, thin in bear ones."},holding:{ko:"지주사는 보유 지분 가치 대비 할인(NAV 할인)으로 거래돼요. 할인율의 역사적 범위를 보세요.",en:"Holdcos trade at a discount to NAV. Compare today's discount to its historical range."},build:{ko:"수주와 분양 실적이 미래 매출이에요. 미분양과 PF(프로젝트 파이낸싱) 부담을 꼭 확인하세요.",en:"Orders and pre-sales are future revenue. Check unsold inventory and project-finance exposure."},realestate:{ko:"금리에 가장 민감한 업종이에요. 임대수익률과 금리 차이(스프레드)가 가치를 결정해요.",en:"The most rate-sensitive sector. The spread between yield and rates sets the value."},retail:{ko:"브랜드력과 이익률의 안정성을 보세요. 경기 방어력이 강점, 폭발적 성장은 약점.",en:"Brand power and margin stability. Defensive, but limited explosive growth."},food:{ko:"경기와 무관한 현금창출력이 강점이에요. 원재료 가격과 판가 인상 여력을 보세요.",en:"Cycle-independent cash flows. Watch input costs and pricing power."},cosmetic:{ko:"브랜드와 수출 시장 구성이 핵심이에요. 특정 국가 의존도가 높으면 그 나라 경기가 곧 실적이에요.",en:"Brand and export mix matter. Heavy country concentration makes that country's economy the earnings driver."},textile:{ko:"브랜드 없이 위탁생산만 하면 마진이 얇아요. 브랜드력이 있는지부터 확인하세요.",en:"Contract manufacturing without a brand means thin margins — check for brand power first."},transport:{ko:"운임(운송 가격)이 실적을 좌우하는 사이클 산업이에요. 유가는 비용, 물동량은 매출이에요.",en:"Freight rates drive earnings. Fuel is cost, volume is revenue."},edu:{ko:"학령인구 감소가 구조적 역풍이에요. 온라인 전환과 성인 교육 확장 여부를 보세요.",en:"Shrinking school-age population is a structural headwind; watch online and adult-education pivots."},paper:{ko:"원재료(펄프) 가격과 판가의 시차가 이익을 만들어요. 사이클 산업으로 보세요.",en:"The lag between pulp costs and prices creates the profit. Treat it as cyclical."},hotel:{ko:"고정비가 커서 매출이 조금 늘면 이익이 크게 늘고, 조금 줄면 크게 줄어요(레버리지 효과).",en:"High fixed costs mean profits swing far more than revenue does."},index:{ko:"ETF는 수백 개 종목을 한 바구니에 담은 상품이에요. 여기 적힌 PER·배당은 바구니 안 종목들의 평균이라 개별 기업처럼 읽으면 안 돼요. 대신 보수(수수료)와 어떤 지수를 따라가는지를 먼저 확인하세요.",en:"An ETF is a basket — its PER and yield are averages, not company figures. Check the expense ratio and which index it tracks."},metal:{ko:"금·은은 이익도 배당도 없어서 PER 같은 잣대가 아예 없어요. 값을 정하는 건 '남들이 얼마에 사주느냐'뿐이에요. 그래서 기대수익이 아니라, 주식과 따로 움직이는 성질(분산 효과)을 보고 담는 자산이에요.",en:"Metals have no earnings or dividends, so multiples don't apply. You hold them for low correlation, not expected return."},etc:{ko:"업종 분류가 애매한 종목이에요. 사업 개요를 직접 읽어보고, 이 회사가 무엇으로 돈을 버는지 한 문장으로 말할 수 있는지 확인해보세요.",en:"Sector classification is unclear here. Read the business summary and check you can state in one sentence how it makes money."}},Qu=[{t:"005930",nk:"삼성전자",ne:"Samsung Elec",s:"semi",price:78e3,beta:1.15,vol:32,per:14,pbr:1.4,dy:1.8,al:-6,x:{mcap:466,roe:9.2,opm:15,g3:8,debt:27,frn:52,lo:52300,hi:84500,dk:"메모리 세계 1위. 스마트폰·가전·파운드리 종합 IT. 메모리 가격 사이클을 크게 타요.",de:"World #1 memory; phones, appliances, foundry. Rides the memory cycle."}},{t:"000660",nk:"SK하이닉스",ne:"SK Hynix",s:"semi",price:42e4,beta:1.5,vol:46,per:9,pbr:2.6,dy:.4,al:25,x:{mcap:300,roe:21,opm:35,g3:22,debt:60,frn:55,lo:21e4,hi:46e4,dk:"HBM(AI 메모리) 선두. AI 투자 사이클의 최대 수혜주이자, 그만큼 사이클 위험도 커요.",de:"HBM (AI memory) leader. Biggest AI-cycle beneficiary — and cycle risk."}},{t:"042700",nk:"한미반도체",ne:"Hanmi Semi",s:"semi",price:9e4,beta:1.7,vol:55,per:30,pbr:8,dy:.3,al:35,x:{mcap:9,roe:28,opm:35,g3:45,debt:15,frn:35,lo:48e3,hi:13e4,dk:"HBM 공정 장비(TC본더) 강자. 성장성은 높지만 고객 집중도가 높아요.",de:"HBM bonder equipment leader. High growth, concentrated customers."}},{t:"373220",nk:"LG에너지솔루션",ne:"LG Energy",s:"battery",price:35e4,beta:1.3,vol:42,per:60,pbr:3.5,dy:0,al:-18,x:{mcap:82,roe:5,opm:4,g3:15,debt:90,frn:10,lo:29e4,hi:45e4,dk:"글로벌 배터리 2위. 북미 투자 확대 중. EV 수요와 보조금 정책에 민감해요.",de:"Global #2 battery maker. NA expansion; sensitive to EV demand & subsidies."}},{t:"006400",nk:"삼성SDI",ne:"Samsung SDI",s:"battery",price:25e4,beta:1.35,vol:45,per:25,pbr:1,dy:.4,al:-22,x:{mcap:17,roe:4,opm:3,g3:5,debt:70,frn:40,lo:18e4,hi:34e4,dk:"프리미엄 배터리·전자재료. 수익성 중심 전략이지만 EV 수요 둔화 영향권.",de:"Premium batteries & materials. Profit-focused; exposed to EV slowdown."}},{t:"247540",nk:"에코프로비엠",ne:"EcoPro BM",s:"battery",price:11e4,beta:1.8,vol:60,per:45,pbr:6,dy:0,al:2,x:{mcap:11,roe:8,opm:3,g3:30,debt:120,frn:8,lo:7e4,hi:21e4,dk:"양극재 대표주. 2023년 테마 급등의 주인공. 변동성이 매우 커요.",de:"Cathode materials flagship; 2023 theme-rally star. Very volatile."}},{t:"086520",nk:"에코프로",ne:"EcoPro",s:"battery",price:6e4,beta:1.9,vol:65,per:35,pbr:5,dy:0 0.2 of error built in."}},vol:{ko:{name:"변동성 (σ)",what:"1년 동안 수익률이 보통 얼마나 위아래로 출렁이는지예요.",ana:"롤러코스터의 높이차예요. 변동성 30%면 평범한 해에도 ±30%의 오르내림은 '정상 운행'이라는 뜻이에요.",act:"출렁임에 놀라 팔면 손실이 확정돼요. 견딜 수 있는 높이의 롤러코스터만 타세요."},en:{name:"Volatility (σ)",what:"How much returns typically swing up and down in a year.",ana:"The height gap of a rollercoaster. 30% vol means ±30% swings are 'normal operation'.",act:"Selling in a scare locks in the loss. Ride only coasters whose drops you can stomach."}},effn:{ko:{name:"실효 종목 수",what:"비중까지 고려했을 때 실질적으로 몇 종목에 분산되어 있는지예요.",ana:"계란을 나눠 담은 바구니 수예요. 10종목을 사도 한 종목이 60%면 바구니는 사실상 2~3개뿐이에요.",act:"바구니가 많을수록 하나를 떨어뜨려도 아침식사는 지킬 수 있어요. 권장 범위까지 늘려보세요."},en:{name:"Effective # of stocks",what:"How many stocks you're really diversified across, weight-adjusted.",ana:"Baskets your eggs are split into. Ten stocks with one at 60% is really 2–3 baskets.",act:"More baskets means one drop won't ruin breakfast. Work toward your recommended range."}},sector:{ko:{name:"섹터 쏠림",what:"가장 큰 산업 하나가 포트폴리오에서 차지하는 비중이에요.",ana:"우산 장수와 짚신 장수 이야기예요. 비 오는 날엔 우산이, 맑은 날엔 짚신이 팔리죠. 한 산업에만 몰면 날씨(업황) 하나에 전부가 걸려요.",act:"같은 산업은 함께 오르내려요. '여러 종목'이 아니라 '여러 산업'이 진짜 분산이에요."},en:{name:"Sector concentration",what:"The share of your largest single industry.",ana:"The umbrella seller and the sandal seller: umbrellas sell in rain, sandals in sun. Bet on one and everything rides on the weather (the industry cycle).",act:"Same-industry stocks move together. Real diversification is many industries, not many tickers."}},sharpe:{ko:{name:"위험 대비 효율 (샤프 비율)",what:"감수한 위험(변동성) 한 단위당 무위험 이자보다 얼마나 더 벌었는지예요.",ana:"자동차의 연비예요. 위험이라는 연료 1을 태워서 초과수익이라는 거리를 얼마나 가느냐 — 같은 거리라면 연료를 덜 쓰는 차가 좋은 차죠.",act:"내 포트폴리오와 인덱스의 샤프를 비교해보세요. 인덱스보다 낮다면, 연료(위험)는 더 쓰면서 덜 가는 중이라는 뜻이에요."},en:{name:"Sharpe ratio",what:"Extra return over the risk-free rate per unit of volatility.",ana:"Fuel efficiency: distance (excess return) per liter of fuel (risk). At equal distance, the thriftier car wins.",act:"Compare yours to the index. Lower means burning more fuel to travel less."}},r2:{ko:{name:"시장 동조율 (R²)",what:"내 포트폴리오 움직임 중 몇 %가 시장 전체의 흐름으로 설명되는지예요.",ana:"에스컬레이터 위에서 걷는 것과 같아요. 동조율 85%면 내 상승의 85%는 에스컬레이터(시장)가 만든 것이고, 내가 걸어 올라간 몫은 15%뿐이에요.",act:"동조율이 높은데 인덱스보다 성과가 낮다면, 비싼 수고로 인덱스를 흉내 내는 셈이에요. 그럴 바엔 인덱스가 낫죠."},en:{name:"Market sync (R²)",what:"The % of your portfolio's movement explained by the overall market.",ana:"Walking on an escalator. At 85% sync, the escalator (market) does 85% of your rise; your own steps add 15%.",act:"High sync but worse than the index means imitating the index expensively. Just buy the index then."}},ret:{ko:{name:"기대수익률",what:"CAPM으로 계산한, 감수한 위험에 대해 '시장이 쳐주는' 연평균 보상이에요.",ana:"위험을 감수한 대가로 시장이 주는 '월급'이에요. 무위험 이자 + (β × 시장 위험 프리미엄).",act:"이건 약속이 아니라 장기 평균 기대치예요. 어떤 해는 훨씬 좋고 어떤 해는 훨씬 나쁠 거예요."},en:{name:"Expected return",what:"The average annual compensation the market 'pays' for your risk, per CAPM.",ana:"A salary for carrying risk: risk-free rate + (β × market risk premium).",act:"A long-run average, not a promise. Some years will be far better, some far worse."}},cagr:{ko:{name:"복리 수익률 (CAGR)",what:"출렁임(변동성)의 감가를 반영한, 장기적으로 실제 쌓이는 연 수익률이에요.",ana:"지그재그로 달리는 차는 직선으로 달리는 차보다 늦게 도착해요. 변동성이 클수록 평균수익률보다 실제 복리수익률이 낮아져요 (≈ 평균 − ½σ²).",act:"변동성을 줄이는 것만으로 장기 복리 수익이 좋아질 수 있어요. 분산이 '공짜 점심'인 이유예요."},en:{name:"CAGR",what:"The annual return that actually compounds long-term, after volatility drag.",ana:"A zigzagging car arrives later than one driving straight. More volatility, bigger gap below the average (≈ mean − ½σ²).",act:"Cutting volatility alone can raise long-run compounding. That's why diversification is the free lunch."}},per:{ko:{name:"PER",what:"주가가 연간 이익의 몇 배인지예요. 낮을수록 '이익 대비 싸다'는 뜻이지만…",ana:"치킨집 인수 가격이에요. 연 순이익 5천만원인 가게를 5억에 사면 PER 10 — 본전까지 10년. 그런데 올해 이익이 유난히 좋았거나 나빴다면? 착시가 생기죠.",act:"섹터마다 정상 범위가 달라요. 종목 카드의 '이 섹터를 볼 땐' 힌트를 꼭 함께 읽으세요."},en:{name:"PER",what:"Price as a multiple of annual earnings. Lower looks cheaper, but…",ana:"Buying a chicken shop: ₩500m for ₩50m/yr profit is PER 10 — ten years to break even. If this year's profit was unusual, the multiple deceives.",act:"Normal ranges differ by sector — always read the sector lens hint on the stock card."}},alpha:{ko:{name:"알파 (α)",what:"위험(β)에 대한 정당한 보상을 빼고 남는 초과수익이에요. 이게 진짜 '종목 선택 실력'의 몫이죠.",ana:"에스컬레이터(시장)가 올려준 것 말고, 내 두 발로 걸어 올라간 몫이에요. 시장이 올라서 번 건 실력이 아니에요.",act:"이 도구는 '과거 알파'는 보여드리지만 '미래 알파 예측'은 보여드리지 않아요. 과거 알파가 이어질 확률은 동전 던지기에 가깝고(SPIVA), 예측 숫자는 과신만 키우거든요. 확실한 알파를 약속하는 사람은 일단 의심하세요."},en:{name:"Alpha (α)",what:"Return left over after fair compensation for risk (β) — the true stock-picking skill share.",ana:"The steps you climbed yourself, beyond what the escalator (market) gave you. Market gains aren't skill.",act:"We show PAST alpha but never a forecast: past alpha persists at roughly coin-flip odds (SPIVA), and a forecast number only breeds overconfidence. Distrust anyone promising certain alpha."}}},Xi={appName:{ko:"뱁새",en:"Baepsae"},appSub:{ko:"내 그릇에 맞는 포트폴리오",en:"Risk-first portfolio"},tab1:{ko:"① 프로필",en:"① Profile"},tab2:{ko:"② 포트폴리오",en:"② Build"},tab3:{ko:"③ 내보내기",en:"③ Export"},disclaimer:{ko:"교육용 도구입니다. 투자 자문이 아니며 모든 판단과 책임은 본인에게 있습니다. 종목 데이터는 "+Sl+" 기준 추정치로 실시간이 아니며, 직접 수정해 쓰세요.",en:"Educational tool, not investment advice; decisions are your own. Stock data are rough estimates as of "+Sl+" — not live. Edit them yourself."},skipPreset:{ko:"질문 건너뛰고 프리셋으로 시작하기",en:"Skip questions, pick a profile"},presetTitle:{ko:"프로필 고르기",en:"Pick a profile"},presetSub:{ko:"대충 이 정도다 싶은 걸 고르세요. 세부 수치는 나중에 언제든 바꿀 수 있어요.",en:"Start from a preset; fine-tune anytime."},profileTitle:{ko:"나의 투자 프로필",en:"My Investor Profile"},capacity:{ko:"위험 감수 능력",en:"Risk capacity"},tolerance:{ko:"위험 감수 의지",en:"Risk tolerance"},need:{ko:"필요 수익률",en:"Required return"},capacityHint:{ko:"능력 = 잃어도 되는가 (형편)",en:"Ability (circumstances)"},toleranceHint:{ko:"의지 = 견딜 수 있는가 (마음)",en:"Willingness (psychology)"},needHint:{ko:"목표 달성에 필요한 수익률",en:"Return the goal requires"},targetBeta:{ko:"목표 베타",en:"Target beta"},tar npaid risk under 20% marks a well-built portfolio. Keeping this balance is the whole job."},rjDetails:{ko:"종목별로 뜯어보기",en:"Per-stock breakdown"},rjZig:{ko:"반대로 출렁이는 두 종목을 합치면, 출렁임이 서로를 지워요. 위험이 '공짜로' 줄어드는 원리예요 — 경제학에서는 이걸 공짜 점심이라고 불러요.",en:"Two holdings that zig oppositely cancel each other's swings — risk shrinks 'for free'. Economists call this the free lunch."},secAlpha:{ko:"알파 — 시장을 이긴다는 것",en:"Alpha — beating the market"},alTitle:{ko:"내 포트폴리오의 알파",en:"My portfolio's alpha"},alPast:{ko:"과거 3년 알파 (추정)",en:"Past 3y alpha (est.)"},alCaveat:{ko:"과거값이에요 — 미래를 보장하지 않아요",en:"A past value — no promise about the future"},alSpace:{ko:"알파가 나올 공간 (트래킹 에러)",en:"Room for alpha (tracking error)"},alSpaceLow:{ko:"인덱스와 거의 똑같이 움직이고 있어요. 알파가 나올 공간 자체가 작아요 — 이럴 바엔 인덱스 펀드가 더 싸고 편해요.",en:"You move almost exactly with the index — little room for alpha either way. An index fund would be cheaper and easier."},alSpaceHigh:{ko:"인덱스와 꽤 다르게 움직여요. 플러스 알파도, 마이너스 알파도 나올 수 있는 구조예요.",en:"You move quite differently from the index — room for alpha, positive or negative."},alPersist:{ko:"참고로, 과거 알파가 앞으로도 이어질 확률은 통계적으로 동전 던지기에 가까워요 (SPIVA 지속성 연구).",en:"Note: the odds that past alpha persists are statistically close to a coin flip (SPIVA persistence studies)."},alGrow:{ko:"내 알파는 어디서 나올 수 있을까?",en:"Where could my alpha come from?"},alTop:{ko:"알파 기여 상위 (과거 기준)",en:"Top alpha contributors (past)"},lgTitle:{ko:"전설들과 나란히 세워보면",en:"Lined up with the legends"},lgNote:{ko:"버핏의 비결은 천재적인 종목 선택만이 아니었어요 — 흔들림 적은 저베타 우량주 + 보험사를 통한 안전한 레버리지 + 60년을 버틴 시간이었죠 ('Buffett's Alpha', Frazzini 외). 그리고 15년 기준, 액티브 펀드의 약 90%는 인덱스를 못 이겨요 (SPIVA).",en:"Buffett's edge wasn't only genius picks — steady low-beta quality + safe insurance-float leverage + sixty years of holding ('Buffett's Alpha', Frazzini et al.). And over 15 years, ~90% of active funds trail the index (SPIVA)."},mktAll:{ko:"전체",en:"All"},chipOne:{ko:"하나만 골라주세요",en:"Pick one"},tapNeeded:{ko:"탭으로 고르는 질문에 모두 답하면 결과를 볼 수 있어요.",en:"Answer every tap question to see your result."},seeResult:{ko:"내 프로필 보기",en:"See my profile"},demo:{ko:"예시 포트폴리오로 둘러보기",en:"Try a sample portfolio"},lt1:{ko:"위험 효율",en:"Risk efficiency"},lt2:{ko:"업종 쏠림",en:"Sector concentration"},lt3:{ko:"목표와의 거리",en:"Distance to goal"},oneAction:{ko:"먼저 이것부터",en:"Start with this"},sxA:{ko:"내 위험은 보상받고 있나요?",en:"Is my risk being paid for?"},sxAs:{ko:"돌려받는 위험과 그냥 떠안은 위험, 그리고 할 일",en:"Paid vs unpaid risk, and what to do"},sxB:{ko:"나는 무엇을 들고 있나요?",en:"What am I actually holding?"},sxBs:{ko:"자산군·업종 구성과 위험의 출처",en:"Asset classes, sectors, and where risk comes from"},sxC:{ko:"폭락하면 얼마나 잃나요?",en:"How much would a crash cost?"},sxCs:{ko:"최악의 해, 그리고 원금을 지킬 확률",en:"Worst years and the odds of keeping your principal"},sxD:{ko:"시장을 이길 수 있을까요?",en:"Can I beat the market?"},sxDs:{ko:"알파, 그리고 전설들과의 비교",en:"Alpha, and how the legends compare"},sxE:{ko:"직접 실험해볼까요?",en:"Want to experiment?"},sxEs:{ko:"만약에 실험실과 폭락 타임머신",en:"What-if lab and the crash time machine"},sxF:{ko:"목표까지 갈 수 있을까요?",en:"Will I reach the goal?"},sxFs:{ko:"장기 전망과 인덱스 비교",en:"Long-run outlook and index comparison"},ciTitle:{ko:"점검 기록",en:"Check-in log"},ciSave:{ko:"지금 상태 기록",en:"Record now"},ciEmpty:{ko:"아직 기록이 없어요. 지금 상태를 기록해두면, 다음에 왔을 때 무엇이 어떻게 달라졌는지 보여드릴게요.",en:"No records yet. Save today's state and next time we'll show exactly what changed."},ciSince:{ko:"지난 기록:",en:"Last record:"},ciAmount:{ko:"투자 금액",en:"Invested"},ciCount:{ko:"종목 수",en:"Holdings"},credit:{ko:"만든 사람 · 이성진, INSEAD MBA 26J",en:"Created by Jack (Sung Jin) Lee, INSEAD MBA 26J"},autoTag:{ko:"자동",en:"live"},assumeTag:{ko:"가정",en:"assumption"},mrpScenTip:{ko:"위험 프리미엄은 관측되는 값이 아니라 '가정'이에요. 최근 수익률로 자동 계산하면, 많이 오른 뒤에 오히려 더 낙관적으로 잡히는 함정이 있어서 직접 고르게 해뒀어요.",en:"The risk premium is an assumption, not an observation. Auto-fitting it to recent returns would turn optimistic right after a run-up — so you choose it."},mrpLow:{ko:"보수",en:"Cautious"},mrpBase:{ko:"기본",en:"Base"},mrpHigh:{ko:"낙관",en:"Optimistic"},setInfl:{ko:"물가",en:"Inflation"},inflL:{ko:"예상 물가상승률",en:"Expected inflation"},inflTip:{ko:"장기 전망을 '실질 기준'으로 볼 때 빼는 값이에요. 목표는 결국 돈의 액수가 아니라 살 수 있는 물건의 양이니까요.",en:"Subtracted when viewing the outlook in real terms — the goal is purchasing power, not a nominal number."},realBtn:{ko:"실질",en:"Real"},realNote:{ko:"물가를 뺀 실질 기준이에요",en:"in real (inflation-adjusted) terms"},sortBy:{ko:"정렬",en:"Sort"},sortPop:{ko:"인기",en:"Popular"},sortSh:{ko:"샤프",en:"Sharpe"},sortAl:{ko:"알파",en:"Alpha"},sortDy:{ko:"배당",en:"Dividend"},sortCap:{ko:"시총",en:"Mkt cap"},sortMdd:{ko:"낙폭 적은",en:"Least drawdown"},sortShNote:{ko:"과거 3년 기준이에요. 과거에 효율이 좋았다고 앞으로도 좋다는 뜻은 아니에요 — 오히려 많이 오른 뒤엔 기대수익이 낮아지는 경우가 많아요.",en:"Based on the past 3 years. Past efficiency doesn't predict future efficiency — after a big run, expected returns are often lower."},shPast:{ko:"샤프(3y)",en:"Sharpe 3y"},shCapm:{ko:"이론 샤프",en:"CAPM Sharpe"},mddL2:{ko:"최대낙폭",en:"Max DD"},momL:{ko:"12개월",en:"12mo"},mddL:{ko:"내 종목들의 3년 최대낙폭 (가중평균)",en:"Holdings' 3y max drawdown (wtd avg)"},hitL:{ko:"오른 달의 비율 (가중평균)",en:"Share of up months (wtd avg)"},alIR:{ko:"이 알파는 실력일까, 운일까",en:"Skill or luck?"},recTitle:{ko:"이렇게 하면 맞춰져요",en:"How to bring it in line"},recApply:{ko:"이대로 적용하기",en:"Apply this"},recApplied:{ko:"적용했어요",en:"Applied"},recUndo:{ko:"되돌리기",en:"Undo"},recMoves:{ko:"바뀌는 금액",en:"Amounts that change"},recNote:{ko:"수학적으로 목표 범위에 들어오는 조정안이에요. 좋은 투자라는 뜻은 아니고, 종목의 좋고 나쁨은 전혀 판단하지 않았어요.",en:"These are arithmetic adjustments that bring you into range. They are not investment advice and make no judgement about any stock."},rjWhere:{ko:"다른 사람들과 비교하면",en:"Where this sits"},rjAnchor:{ko:"인덱스만 사면 0%, 한 종목만 들면 60~70%예요. 개인 포트폴리오는 보통 10~25% 사이에 있어요.",en:"Index-only is 0%; a single stock is 60–70%. Most individual portfolios land between 10% and 25%."},rjZeroTitle:{ko:"0%가 목표는 아니에요",en:"Zero is not the goal"},rjZeroBody:{ko:"0%는 인덱스를 그대로 사는 것과 같아요. 종목을 직접 고르는 순간 이 비율은 반드시 올라가고, 그건 잘못이 아니에요 — 시장을 이겨보려면 내야 하는 입장료예요. 다만 '내가 이 회사를 남보다 잘 안다'는 근거가 있을 때만 값어치가 있어요. 그 근거가 실제로 있었는지는 '알파' 섹션에서 확인해볼 수 있어요.",en:"Zero means simply buying the index. The moment you pick individual companies this rises — and that's not a mistake, it's the admission fee for trying to beat the market. It only pays off if you genuinely know something others don't, which the alpha section puts to the test."},sxW:{ko:"내가 잘하고 있는 것",en:"What I'm doing right"},sxWs:{ko:"이미 지켜낸 것들과 그 값어치",en:"What you've already got right, and what it's worth"},sxR:{ko:"내 수익은 어디서 나오나요?",en:"Where do my returns come from?"},sxRs:{ko:"기대수익의 출처와 배당",en:"Sources of expected return, and dividends"},wdTitle:{ko:"잘하고 있는 것",en:"Going right"},wdTodo:{ko:"아직 남은 것",en:"Still open"},raTitle:{ko:"내 수익은 어디서 나오나요",en:"Where returns come from"},raSub:{ko:"기대수익은 '가만히 둬도 받는 이자'와 '위험을 감수한 대가'로 나뉘어요.",en:"Expected return splits into the interest you'd get anyway and the reward for taking risk."},raByCls:{ko:"자산군별 기여",en:"Contribution by asset class"},raTop:{ko:"기대수익 기여 상위",en:"Top contributors"},raVerdict:{ko:"배당은 시장이 어떻든 실제로 통장에 들어오는 몫이고, 나머지는 주가가 올라야 생기는 몫이에요. 둘의 비율이 곧 '기다릴 수 있는 힘'을 결정해요.",en:"Dividends actually arrive regardless of the market; the rest requires prices to rise. That ratio determines how long you can wait."},ftTitle:{ko:"내 포트폴리오의 성향 (팩터)",en:"My portfolio's tilts (factors)"},ftSub:{ko:"같은 '주식'이라도 어떤 성격의 주식을 모았는지가 성과를 크게 갈라요. 시장 평균과 비교한 위치예요.",en:"Which kind of stocks you own drives much of the outcome. This shows your position against the market average."},ftNone:{ko:"성향을 계산할 데이터가 아직 부족해요. 시세 데이터가 갱신되면 표시됩니다.",en:"Not enough data yet — this appears once live data is in place."},ftNote:{ko:"보유 종목의 특성(시가총액·PBR·12개월 수익률·ROE)을 시장 내 백분위로 환산해 가중평균한 값이에요. 정식 팩터 회귀분석 결과는 아니에요.",en:"A weighted average of holdings' characteristic percentiles (size, PBR, 12-month return, ROE) — not a formal factor regression."},srTitle:{ko:"순서의 위험 — 언제 나쁜 해가 오는가",en:"Sequence risk — when the bad years hit"},srSub:{ko:"돈을 빼 쓰는 동안에는, 평균 수익률이 같아도 '나쁜 해가 먼저 오는지'에 따라 결과가 크게 달라져요.",en:"While withdrawing, identical average returns produce very different outcomes dependin 이 분석이에요."},box:{t:"업종별 시장 눈높이",b:"업종마다 시장이 쳐주는 값의 눈높이가 달라요. 굵은 점이 그 업종의 중간값, 옅은 막대가 가운데 절반(25~75%)이 모여 있는 구간이에요. 같은 PER 10배라도 어떤 업종에선 비싼 값, 어떤 업종에선 싼 값이에요 — 그래서 멀티플은 늘 같은 업종 안에서 읽어요. 점선은 시장 전체의 중간값이라, 어떤 업종이 시장 평균보다 후하게 또는 박하게 평가받는지도 보여요."},per:{t:"PER (주가수익비율)",b:"시장이 이 회사의 이익 1원에 몇 원을 내고 있는지예요. 높다는 건 시장이 앞으로의 성장을 크게 기대한다는 뜻이고, 그 기대가 실현되지 않으면 주가가 조정될 수 있다는 뜻이기도 해요. 적자 기업은 PER을 계산할 수 없어요."},pbr:{t:"PBR (주가순자산비율)",b:"회사 장부상 순자산 1원을 시장이 몇 원으로 평가하는지예요. 1배 미만은 장부가치보다 싸게 거래된다는 뜻인데, 그 자체로 저평가라기보다 '시장이 이 자산의 수익성을 의심한다'는 신호일 때가 많아요. ROE와 함께 읽어야 해요."},roe:{t:"ROE (자기자본이익률)",b:"주주 돈 100원으로 1년에 몇 원을 벌었는지예요. 꾸준히 높은 ROE는 좋은 사업의 흔적이지만, 부채를 늘려도 ROE는 올라가요 — 부채비율과 함께 보세요."},payout:{t:"배당성향",b:"번 이익 중 얼마를 배당으로 돌려주는지예요. 이익보다 배당이 큰 상태(100% 초과)가 이어지면 지속되기 어려워요."},ff:{t:"업종 내 위치",b:"잣대 하나로는 회사를 판단할 수 없어요. PER·PBR·PSR·EV/EBITDA 같은 여러 잣대에서 같은 업종 회사들 가운데 낮은 쪽인지 높은 쪽인지를 나란히 놓은 그림이에요. 파란 상자는 업종의 25~75% 구간, 주황 점이 이 회사의 위치예요. 낮다고 곧 싸다는 뜻은 아니에요 — 시장이 왜 이 위치에 두었는지 물어보는 출발점이에요."},dcf:{t:"DCF (현금흐름할인)",b:"미래 이익을 가정하고 현재 가치로 할인해 더하는 계산이에요. 여기서는 순이익을 현금흐름으로 근사하는 큰 단순화를 써요(실제로는 투자·운전자본 등으로 달라요). 그래서 이 도구의 목적은 '적정주가 찾기'가 아니라, 가정을 바꿀 때 값이 얼마나 민감하게 움직이는지, 그리고 지금 주가에는 어떤 성장 기대가 담겨 있는지를 보는 거예요."},tree:{t:"수익률 지도",b:"칸의 크기는 시가총액, 색은 최근 3개월 수익률이에요(붉은색 상승·푸른색 하락, 국내 시장 관례를 따랐어요). 시장의 돈이 최근 어디로 흘렀는지 한 화면에서 보는 용도이고, 색이 진하다고 좋거나 나쁜 종목이라는 뜻은 아니에요. 과거 수익률은 미래를 보장하지 않아요."},evebitda:{t:"EV/EBITDA",b:"시가총액에 순차입금을 더한 '기업 전체 가치(EV)'를 상각 전 영업이익(EBITDA)으로 나눈 값이에요. 부채까지 포함해 회사를 통째로 산다고 볼 때의 배수라서, 부채 구조가 다른 회사끼리 비교할 때 PER보다 공정할 때가 많아요. 상각비는 현금흐름표 기준 근사값이에요. 은행·보험·증권·지주는 사업 구조상 이 지표를 쓰지 않아요."},pocf:{t:"P/영업현금흐름",b:"시가총액을 영업활동으로 실제 들어온 현금으로 나눈 값이에요. 회계상 이익은 조정 여지가 있지만 현금은 비교적 정직해서, 이익과 현금흐름이 크게 다른 회사를 걸러내는 데 유용해요."},cmp:{t:"기업 비교",b:"같은 업종 회사들을 지표별로 나란히 놓은 표예요. 오른쪽 끝의 업종 중간값이 기준점 역할을 해요. 숫자가 큰 쪽이 항상 좋은 것도, 낮은 멀티플이 항상 싼 것도 아니에요 — 차이가 나는 항목에서 '왜?'를 묻는 것이 이 표의 사용법이에요."},trap:{t:"싼 값이 오래 싼 값으로 남는 이유",b:"한국 시장에서는 멀티플이 낮은 회사가 오래 낮은 채로 머무는 일이 흔해요. 격차가 좁혀지려면 계기가 필요한데 — 배당·자사주 같은 주주환원 확대, 지배구조 개선, 실적의 방향 전환 — 그 계기가 없으면 '싸다'는 상태가 몇 년씩
