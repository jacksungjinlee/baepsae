00\uBD80\uBD84\uC774\uC5D0\uC694. \uBCC0\uB3D9\uC131\uC774 \uD070 \uC774\uC720\uC8E0.",en:"PER is often meaningless (no earnings). Pipeline stage and licensing deals carry most of the value \u2014 hence the volatility."},platform:{ko:"\uC131\uC7A5\uB960\uACFC \uC774\uC775\uB960\uC758 \uC870\uD569\uC744 \uBCF4\uC138\uC694. \uC131\uC7A5\uC774 \uAEBE\uC774\uBA74 \uBA40\uD2F0\uD50C\uC774 \uAE09\uACA9\uD788 \uB0AE\uC544\uC9C0\uB294 \uAD6C\uC870\uC608\uC694.",en:"Watch the growth \xD7 margin combo. When growth stalls, the multiple derates fast."},finance:{ko:"\uC740\uD589\xB7\uBCF4\uD5D8\uC740 PBR\uACFC ROE\uAC00 \uD575\uC2EC\uC774\uC5D0\uC694. \uC790\uBCF8\uC774 \uACE7 \uC6D0\uB8CC\uC778 \uC0B0\uC5C5\uC774\uB77C '\uC790\uBCF8 \uB300\uBE44 \uC5BC\uB9C8\uB098 \uBC84\uB294\uAC00'\uAC00 \uAC00\uCE58\uB97C \uACB0\uC815\uD574\uC694.",en:"PBR and ROE rule here. Capital is the raw material, so value = earnings on book equity."},chem:{ko:"\uC815\uC81C\uB9C8\uC9C4\xB7\uC2A4\uD504\uB808\uB4DC\uAC00 \uC774\uC775\uC744 \uC88C\uC6B0\uD558\uB294 \uC0AC\uC774\uD074 \uC0B0\uC5C5\uC774\uC5D0\uC694. \uD604\uC7AC \uC774\uC775\uBCF4\uB2E4 \uC2A4\uD504\uB808\uB4DC \uBC29\uD5A5\uC744 \uBCF4\uC138\uC694.",en:"Spreads drive earnings in this cycle industry. Watch spread direction, not current profits."},material:{ko:"\uC0AC\uC774\uD074 \uC800\uC810\uC5D0\uC120 PBR\uB85C, \uACE0\uC810\uC5D0\uC120 \uC870\uC2EC\uC2A4\uB7FD\uAC8C. \uC911\uAD6D \uC218\uAE09\uC774 \uAC00\uACA9\uC744 \uD754\uB4E4\uC5B4\uC694.",en:"Use PBR at cycle lows; be careful at peaks. China supply-demand moves prices."},defense:{ko:"\uC218\uC8FC\uC794\uACE0\uAC00 \uBBF8\uB798 \uB9E4\uCD9C\uC774\uC5D0\uC694. PER\uBCF4\uB2E4 \uC218\uC8FC\uC794\uACE0\xF7\uC5F0\uB9E4\uCD9C(\uBA87 \uB144\uCE58 \uC77C\uAC10\uC778\uC9C0)\uC744 \uBCF4\uC138\uC694.",en:"Order backlog is future revenue. Backlog \xF7 annual sales (years of work) beats PER."},game:{ko:"\uD788\uD2B8\uC791 \uC758\uC874 \uC0B0\uC5C5\uC774\uB77C \uC774\uC775 \uBCC0\uB3D9\uC774 \u } \uC704\uD5D8\uC744 \uAC10\uC218\uD55C \uB300\uAC00\uB85C \uC2DC\uC7A5\uC774 \uC8FC\uB294 '\uC6D4\uAE09'\uC774\uC5D0\uC694. \uBB34\uC704\uD5D8 \uC774\uC790 + (\u03B2 \xD7 \uC2DC\uC7A5 \uC704\uD5D8 \uD504\uB9AC\uBBF8\uC5C4).",act:"\uC774\uAC74 \uC57D\uC18D\uC774 \uC544\uB2C8\uB77C \uC7A5\uAE30 \uD3C9\uADE0 \uAE30\uB300\uCE58\uC608\uC694. \uC5B4\uB5A4 \uD574\uB294 \uD6E8\uC52C \uC88B\uACE0 \uC5B4\uB5A4 \uD574\uB294 \uD6E8\uC52C \uB098\uC060 \uAC70\uC608\uC694."},en:{name:"Expected return",what:"The average annual compensation the market 'pays' for your risk, per CAPM.",ana:"\u{1F4B0} A salary for carrying risk: risk-free rate + (\u03B2 \xD7 market risk premium).",act:"A long-run average, not a promise. Some years will be far better, some far worse."}},cagr:{ko:{name:"\uBCF5\uB9AC \uC218\uC775\uB960 (CAGR)",what:"\uCD9C\uB801\uC784(\uBCC0\uB3D9\uC131)\uC758 \uAC10\uAC00\uB97C \uBC18\uC601\uD55C, \uC7A5\uAE30\uC801\uC73C\uB85C \uC2E4\uC81C \uC313\uC774\uB294 \uC5F0 \uC218\uC775\uB960\uC774\uC5D0\uC694.",ana:"\u{1F422} \uC9C0\uADF8\uC7AC\uADF8\uB85C \uB2EC\uB9AC\uB294 \uCC28\uB294 \uC9C1\uC120\uC73C\uB85C \uB2EC\uB9AC\uB294 \uCC28\uBCF4\uB2E4 \uB2A6\uAC8C \uB3C4\uCC29\uD574\uC694. \uBCC0\uB3D9\uC131\uC774 \uD074\uC218\uB85D \uD3C9\uADE0\uC218\uC775\uB960\uBCF4\uB2E4 \uC2E4\uC81C \uBCF5\uB9AC\uC218\uC775\uB960\uC774 \uB0AE\uC544\uC838\uC694 (\u2248 \uD3C9\uADE0 \u2212 \xBD\u03C3\xB2).",act:"\uBCC0\uB3D9\uC131\uC744 \uC904\uC774\uB294 \uAC83\uB9CC\uC73C\uB85C \uC7A5\uAE30 \uBCF5\uB9AC \uC218\uC775\uC774 \uC88B\uC544\uC9C8 \uC218 \uC788\uC5B4\uC694. \uBD84\uC0B0\uC774 '\uACF5\uC9DC \uC810\uC2EC'\uC778 \uC774\uC720\uC608\uC694."},en:{name:"CAGR",what:"The annual return that actually compounds long-term, after volatility drag.",ana:"\u{1F422} A zigzagging car arrives later than one driving straight. More volatility, bigger gap below the average (\u2248 mean \u2212 \xBD\u03C3\xB2).",act:"Cutting volatility alone can raise long-run compounding. That's why diversification is the free lunch."}},per:{ko:{name:"PER",what:"\uC8FC\uAC00\uAC00 \uC5F0\uAC04 \uC774\uC775\uC758 \uBA87 \uBC30\uC778\uC9C0\uC608\uC694. \uB0AE\uC744\uC218\uB85D '\uC774\uC775 \uB300\uBE44 \uC2F8\uB2E4'\uB294 \uB73B\uC774\uC9C0\uB9CC\u2026",ana:"\u{1F357} \uCE58\uD0A8\uC9D1 \uC778\uC218 \uAC00\uACA9\uC774\uC5D0\uC694. \uC5F0 \uC21C\uC774\uC775 5\uCC9C\uB9CC\uC6D0\uC778 \uAC00\uAC8C\uB97C 5\uC5B5\uC5D0 \uC0AC\uBA74 PER 10 \u2014 \uBCF8\uC804\uAE4C\uC9C0 10\uB144. \uADF8\uB7F0\uB370 \uC62C\uD574 \uC774\uC775\uC774 \uC720\uB09C\uD788 \uC88B\uC558\uAC70\uB098 \uB098\uBE74\uB2E4\uBA74? \uCC29\uC2DC\uAC00 \uC0DD\uAE30\uC8E0.",act:"\uC139\uD130\uB9C8\uB2E4 \uC815\uC0C1 \uBC94\uC704\uAC00 \uB2EC\uB77C\uC694. \uC885\uBAA9 \uCE74\uB4DC\uC758 '\uC774 \uC139\uD130\uB97C \uBCFC \uB550' \uD78C\uD2B8\uB97C \uAF2D \uD568\uAED8 \uC77D\uC73C\uC138\uC694."},en:{name:"PER",what:"Price as a multiple of annual earnings. Lower looks cheaper, but\u2026",ana:"\u{1F357} Buying a chicken shop: \u20A9500m for \u20A950m/yr profit is PER 10 \u2014 ten years to break even. If this year's profit was unusual, the multiple deceives.",act:"Normal ranges differ by sector \u2014 always read the sector lens hint on the stock card."}},alpha:{ko:{name:"\uC54C\uD30C (\u03B1)",what:"\uC704\uD5D8(\u03B2)\uC5D0 \uB300\uD55C \uC815\uB2F9\uD55C \uBCF4\uC0C1\uC744 \uBE7C\uACE0 \uB0A8\uB294 \uCD08\uACFC\uC218\uC775\uC774\uC5D0\uC694. \uC774\uAC8C \uC9C4\uC9DC '\uC885\uBAA9 \uC120\uD0DD \uC2E4\uB825'\uC758 \uBAAB\uC774\uC8E0.",ana:"\u{1F6D7} \uC5D0\uC2A4\uCEEC\uB808\uC774\uD130(\uC2DC\uC7A5)\uAC00 \uC62C\uB824\uC900 \uAC83 \uB9D0\uACE0, \uB0B4 \uB450 \uBC1C\uB85C \uAC78\uC5B4 \uC62C\uB77C\uAC04 \uBAAB\uC774\uC5D0\uC694. \uC2DC\uC7A5\uC774 \uC62C\uB77C\uC11C \uBC88 \uAC74 \uC2E4\uB825\uC774 \uC544\uB2C8\uC5D0\uC694.",act:"\uC774 \uB3C4\uAD6C\uB294 '\uACFC\uAC70 \uC54C\uD30C'\uB294 \uBCF4\uC5EC\uB4DC\uB9AC\uC9C0\uB9CC '\uBBF8\uB798 \uC54C\uD30C \uC608\uCE21'\uC740 \uBCF4\uC5EC\uB4DC\uB9AC\uC9C0 \uC54A\uC544\uC694. \uACF
