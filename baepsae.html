nment. Policy moves the stock more than earnings."},bio:{ko:"이익이 없어 PER이 무의미한 경우가 많아요. 파이프라인(임상 단계)·기술수출 계약이 가치의 대부분이에요. 변동성이 큰 이유죠.",en:"PER is often meaningless. Pipeline stage and licensing deals carry the value — hence the volatility."},health:{ko:"정책·보험 수가가 실적을 좌우해요. 성장은 완만하지만 경기 방어력이 있는 편이에요.",en:"Policy and reimbursement rates drive results; slower growth but defensive."},platform:{ko:"성장률과 이익률의 조합을 보세요. 성장이 꺾이면 멀티플이 급격히 낮아지는 구조예요.",en:"Watch the growth × margin combo. When growth stalls, the multiple derates fast."},game:{ko:"히트작 의존 산업이라 이익 변동이 커요. 신작 파이프라인과 기존작의 수명이 핵심.",en:"Hit-driven earnings swing hard. New pipeline and longevity of live titles are key."},media:{ko:"IP의 힘과 제작비 부담이 줄다리기해요. 구독자 증가율과 편당 수익성을 함께 보세요.",en:"IP strength versus production cost. Watch subscriber growth alongside per-title economics."},telecom:{ko:"성장보다 배당이 본질인 준(準)유틸리티예요. 배당수익률과 배당의 지속가능성을 보세요.",en:"A quasi-utility: dividends, not growth. Check yield and sustainability."},bank:{ko:"PBR과 ROE가 핵심이에요. 자본이 곧 원료인 산업이라 '자본 대비 얼마나 버는가'가 가치를 결정해요. 금리와 연체율도 함께 보세요.",en:"PBR and ROE rule. Capital is the raw material, so earnings on book equity set the value."},insure:{ko:"보험은 '받은 보험료를 굴려서 버는' 구조예요. 금리 방향과 손해율(들어온 보험료 대비 나간 보험금)을 보세요.",en:"Insurers earn on the float. Watch rates and the loss ratio."},broker:{ko:"거래대금과 시장 분위기에 실적이 직결돼요. 강세장에 잘 벌고 약세장에 급격히 줄어드는 구조예요.",en:"Earnings track trading volumes and sentiment — strong in bull markets, thin in bear ones."},holding:{ko:"지주사는 보유 지분 가치 대비 할인(NAV 할인)으로 거래돼요. 할인율의 역사적 범위를 보세요.",en:"Holdcos trade at a discount to NAV. Compare today's discount to its historical range."},build:{ko:"수주와 분양 실적이 미래 매출이에요. 미분양과 PF(프로젝트 파이낸싱) 부담을 꼭 확인하세요.",en:"Orders and pre-sales are future revenue. Check unsold inventory and project-finance exposure."},realestate:{ko:"금리에 가장 민감한 업종이에요. 임대수익률과 금리 차이(스프레드)가 가치를 결정해요.",en:"The most rate-sensitive sector. The spread between yield and rates sets the value."},retail:{ko:"브랜드력과 이익률의 안정성을 보세요. 경기 방어력이 강점, 폭발적 성장은 약점.",en:"Brand power and margin stability. Defensive, but limited explosive growth."},food:{ko:"경기와 무관한 현금창출력이 강점이에요. 원재료 가격과 판가 인상 여력을 보세요.",en:"Cycle-independent cash flows. Watch input costs and pricing power."},cosmetic:{ko:"브랜드와 수출 시장 구성이 핵심이에요. 특정 국가 의존도가 높으면 그 나라 경기가 곧 실적이에요.",en:"Brand and export mix matter. Heavy country concentration makes that country's economy the earnings driver."},textile:{ko:"브랜드 없이 위탁생산만 하면 마진이 얇아요. 브랜드력이 있는지부터 확인하세요.",en:"Contract manufacturing without a brand means thin margins — check for brand power first."},transport:{ko:"운임(운송 가격)이 실적을 좌우하는 사이클 산업이에요. 유가는 비용, 물동량은 매출이에요.",en:"Freight rates drive earnings. Fuel is cost, volume is revenue."},edu:{ko:"학령인구 감소가 구조적 역풍이에요. 온라인 전환과 성인 교육 확장 여부를 보세요.",en:"Shrinking school-age population is a structural headwind; watch online and adult-education pivots."},paper:{ko:"원재료(펄프) 가격과 판가의 시차가 이익을 만들어요. 사이클 산업으로 보세요.",en:"The lag between pulp costs and prices creates the profit. Treat it as cyclical."},hotel:{ko:"고정비가 커서 매출이 조금 늘면 이익이 크게 늘고, 조금 줄면 크게 줄어요(레버리지 효과).",en:"High fixed costs mean profits swing far more than revenue does."},index:{ko:"ETF는 수백 개 종목을 한 바구니에 담은 상품이에요. 여기 적힌 PER·배당은 바구니 안 종목들의 평균이라 개별 기업처럼 읽으면 안 돼요. 대신 보수(수수료)와 어떤 지수를 따라가는지를 먼저 확인하세요.",en:"An ETF is a basket — its PER and yield are averages, not company figures. Check the expense ratio and which index it tracks."},metal:{ko:"금·은은 이익도 배당도 없어서 PER 같은 잣대가 아예 없어요. 값을 정하는 건 '남들이 얼마에 사주느냐'뿐이에요. 그래서 기대수익이 아니라, 주식과 따로 움직이는 성질(분산 효과)을 보고 담는 자산이에요.",en:"Metals have no earnings or dividends, so multiples don't apply. You hold them for low correlation, not expected return."},etc:{ko:"업종 분류가 애매한 종목이에요. 사업 개요를 직접 읽어보고, 이 회사가 무엇으로 돈을 버는지 한 문장으로 말할 수 있는지 확인해보세요.",en:"Sector classification is unclear here. Read the business summary and check you can state in one sentence how it makes money."}},yr=[{t:"005930",nk:"삼성전자",ne:"Samsung Elec",s:"semi",price:78e3,beta:1.15,vol:32,per:14,pbr:1.4,dy:1.8,al:-6,x:{mcap:466,roe:9.2,opm:15,g3:8,debt:27,frn:5 ch"}]},{id:"account",type:"one",ko:"어떤 계좌로 투자하실 건가요? (세금이 꽤 달라져요)",en:"Which account will you invest through? (taxes differ a lot)",opts:[{v:"normal",e:"",ko:"일반 계좌",en:"Regular"},{v:"isa",e:"",ko:"ISA",en:"ISA"},{v:"pension",e:"",ko:"연금저축",en:"Pension savings"},{v:"irp",e:"",ko:"IRP",en:"IRP"},{v:"unsure",e:"",ko:"아직 모르겠어요",en:"Not sure yet"}]},{id:"interest",type:"chips",ko:"끌리는 분야를 골라주세요. 종목 고를 때 로 표시해드릴게요.",en:"Pick sectors that attract you — we'll them later.",opts:[{v:"semi",e:"",ko:"반도체·AI",en:"Semis/AI"},{v:"battery",e:"",ko:"2차전지",en:"Battery"},{v:"bio",e:"",ko:"바이오·헬스케어",en:"Bio/Health"},{v:"platform",e:"",ko:"인터넷·플랫폼",en:"Internet/Platform"},{v:"game",e:"",ko:"게임·엔터",en:"Games/Ent"},{v:"finance",e:"",ko:"금융",en:"Finance"},{v:"auto",e:"",ko:"자동차",en:"Autos"},{v:"defense",e:"",ko:"방산·조선",en:"Defense/Ship"},{v:"consumer",e:"",ko:"소비재·유통",en:"Consumer"},{v:"chem",e:"",ko:"화학·정유",en:"Chem/Energy"},{v:"telecom",e:"",ko:"통신·배당",en:"Telecom/Div"},{v:"index",e:"",ko:"지수 ETF",en:"Index ETFs"},{v:"metal",e:"",ko:"금·은",en:"Gold/Silver"},{v:"none",e:"",ko:"아직 모르겠어요",en:"Not sure yet"}]}],_i={beta:{ko:{name:"베타 (β)",what:"시장이 1% 움직일 때 내 포트폴리오가 몇 % 움직이는지예요.",ana:"시장을 따라 움직이는 '볼륨 다이얼'이에요. β 1.5면 시장의 움직임을 1.5배로 증폭해서 듣고, β 0.5면 절반 볼륨으로 들어요.",act:"높다고 좋은 게 아니에요. '내가 견딜 수 있는 볼륨'이 목표 범위이고, 그 안에 있으면 충분해요. β는 과거로 추정한 값이라 ±0.1~0.2 정도의 오차는 늘 있어요."},en:{name:"Beta (β)",what:"How many % your portfolio moves when the market moves 1%.",ana:"A volume dial on the market. β 1.5 plays market moves amplified 1.5×; β 0.5 at half volume.",act:"Higher isn't better — stay at a volume you can bear. β is a historical estimate with ±0.1–0.2 of error built in."}},vol:{ko:{name:"변동성 (σ)",what:"1년 동안 수익률이 보통 얼마나 위아래로 출렁이는지예요.",ana:"롤러코스터의 높이차예요. 변동성 30%면 평범한 해에도 ±30%의 오르내림은 '정상 운행'이라는 뜻이에요.",act:"출렁임에 놀라 팔면 손실이 확정돼요. 견딜 수 있는 높이의 롤러코스터만 타세요."},en:{name:"Volatility (σ)",what:"How much returns typically swing up and down in a year.",ana:"The height gap of a rollercoaster. 30% vol means ±30% swings are 'normal operation'.",act:"Selling in a scare locks in the loss. Ride only coasters whose drops you can stomach."}},effn:{ko:{name:"실효 종목 수",what:"비중까지 고려했을 때 실질적으로 몇 종목에 분산되어 있는지예요.",ana:"계란을 나눠 담은 바구니 수예요. 10종목을 사도 한 종목이 60%면 바구니는 사실상 2~3개뿐이에요.",act:"바구니가 많을수록 하나를 떨어뜨려도 아침식사는 지킬 수 있어요. 권장 범위까지 늘려보세요."},en:{name:"Effective # of stocks",what:"How many stocks you're really diversified across, weight-adjusted.",ana:"Baskets your eggs are split into. Ten stocks with one at 60% is really 2–3 baskets.",act:"More baskets means one drop won't ruin breakfast. Work toward your recommended range."}},sector:{ko:{name:"섹터 쏠림",what:"가장 큰 산업 하나가 포트폴리오에서 차지하는 비중이에요.",ana:"우산 장수와 짚신 장수 이야기예요. 비 오는 날엔 우산이, 맑은 날엔 짚신이 팔리죠. 한 산업에만 몰면 날씨(업황) 하나에 전부가 걸려요.",act:"같은 산업은 함께 오르내려요. '여러 종목'이 아니라 '여러 산업'이 진짜 분산이에요."},en:{name:"Sector concentration",what:"The share of your largest single industry.",ana:"The umbrella seller and the sandal seller: umbrellas sell in rain, sandals in sun. Bet on one and everything rides on the weather (the industry cycle).",act:"Same-industry stocks move together. Real diversification is many industries, not many tickers."}},sharpe:{ko:{name:"위험 대비 효율 (샤프 비율)",what:"감수한 위험(변동성) 한 단위당 무위험 이자보다 얼마나 더 벌었는지예요.",ana:"자동차의 연비예요. 위험이라는 연료 1을 태워서 초과수익이라는 거리를 얼마나 가느냐 — 같은 거리라면 연료를 덜 쓰는 차가 좋은 차죠.",act:"내 포트폴리오와 인덱스의 샤프를 비교해보세요. 인덱스보다 낮다면, 연료(위험)는 더 쓰면서 덜 가는 중이라는 뜻이에요."},en:{name:"Sharpe ratio",what:"Extra return over the risk-free rate per unit of volatility.",ana:"Fuel efficiency: distance (excess return) per liter of fuel (risk). At equal distance, the thriftier car wins.",act:"Compare yours to the index. Lower means burning more fuel to travel less."}},r2:{ko:{name:"시장 동조율 (R²)",what:"내 포트폴리오 움직임 중 몇 %가 시장 전체의 흐름으로 설명되는지예요.",ana:"에스컬레이터 위에서 걷는 것과 같아요. 동조율 85%면 내 상승의 85%는 에스컬레이터(시장)가 만든 것이고, 내가 걸어 올라간 몫은 15%뿐이에요.",act:"동조율이 높은데 인덱스보다 성과가 낮다면, 비싼 수고로 인덱스를 흉내 내는 셈이에요. 그럴 바엔 인덱스가 낫죠."},en:{name:"Market sync (R²)",what:"The % of your portfolio's movement explained by the overall market.",ana:"Walking on an escalator. At 85% sync, the escalator (market) does 85% of your rise; your own steps add 15%.",act:"High sync but worse than the index means imitating the index expensively. Just buy the index then."}},ret:{ko:{name:"기대수익률",what:"CAPM으로 계산한, 감수한 위험에 대해 '시장이 쳐주는' 연평균 보상이에요.",ana:"위험을 감수한 대가로 시장이 주는 '월급'이에요. 무위험 이자 + (β × 시장 위험 프리미엄).",act:"이건 약속이 아니라 장기 평균 기대치예요. 어떤 해는 훨씬 좋고 어떤 해는 훨씬 나쁠 거예요."},en:{name:"Expected return",what:"The average annual compensation the market 'pays' for your risk, per CAPM.",ana:"A salary for carrying risk: risk-free rate + (β × market risk premium).",act:"A long-run average, not a promise. Some years will be far better, some far worse."}},cagr:{ko:{name:"복리 수익률 (CAGR)",what:"출렁임(변동성)의 감가를 반영한, 장기적으로 실제 쌓이는 연 수익률이에요.",ana:"지그재그로 달리는 차는 직선으로 달리는 차보다 늦게 도착해요. 변동성이 클수록 평균수익률보다 실제 복리수익률이 낮아져요 (≈ 평균 − ½σ²).",act:"변동성을 줄이는 것만으로 장기 복리 수익이 좋아질 수 있어요. 분산이 '공짜 점심'인 이유예요."},en:{name:"CAGR",what:"The annual return that actually compounds long-term, after volatility drag.",ana:"A zigzagging car arrives later than one driving straight. More volatility, bigger gap below the average (≈ mean − ½σ²).",act:"Cutting volatility alone can raise long-run compounding. That's why diversification is the free lunch."}},per:{ko:{name:"PER",what:"주가가 연간 이익의 몇 배인지예요. 낮을수록 '이익 대비 싸다'는 뜻이지만…",ana:"치킨집 인수 가격이에요. 연 순이익 5천만원인 가게를 5억에 사면 PER 10 — 본전까지 10년. 그런데 올해 이익이 유난히 좋았거나 나빴다면? 착시가 생기죠.",act:"섹터마다 정상 범위가 달라요. 종목 카드의 '이 섹터를 볼 땐' 힌트를 꼭 함께 읽으세요."},en:{name:"PER",what:"Price as a multiple of annual earnings. Lower looks cheaper, but…",ana:"Buying a chicken shop: ₩500m for ₩50m/yr profit is PER 10 — ten years to break even. If this year's profit was unusual, the multiple deceives.",act:"Normal ranges differ by sector — always read the sector lens hint on the stock card."}},alpha:{ko:{name:"알파 (α)",what:"위험(β)에 대한 정당한 보상을 빼고 남는 초과수익이에요. 이게 진짜 '종목 선택 실력'의 몫이죠.",ana:"에스컬레이터(시장)가 올려준 것 말고, 내 두 발로 걸어 올라간 몫이에요. 시장이 올라서 번 건 실력이 아니에요.",act:"이 도구는 '과거 알파'는 보여드리지만 '미래 알파 예측'은 보여드리지 않아요. 과거 알파가 이어질 확률은 동전 던지기에 가깝고(SPIVA), 예측 숫자는 과신만 키우거든요. 확실한 알파를 약속하는 사람은 일단 의심하세요."},en:{name:"Alpha (α)",what:"Return left over after fair compensation for risk (β) — the true stock-picking skill share.",ana:"The steps you climbed yourself, beyond what the escalator (market) gave you. Market gains aren't skill.",act:"We show PAST alpha but never a forecast: past alpha persists at roughly coin-flip odds (SPIVA), and a forecast number only breeds overconfidence. Distrust anyone promising certain alpha."}}},Ml={appName:{ko:"뱁새",en:"Baepsae"},appSub:{ko:"내 그릇에 맞는 포트폴리오",en:"Risk-first portfolio"},tab1:{ko:"① 프로필",en:"① Profile"},tab2:{ko:"② 포트폴리오",en:"② Build"},tab3:{ko:"③ 내보내기",en:"③ Export"},disclaimer:{ko:"교육용 도구입니다. 투자 자문이 아니며 모든 판단과 책임은 본인에게 있습니다. 종목 데이터는 "+ta+" 기준 추정치로 실시간이 아니며, 직접 수정해 쓰세요.",en:"Educational tool, not investment advice; decisions are your own. Stock data are rough estimates as of "+ta+" — not live. Edit them yourself."},skipPreset:{ko:"질문 건너뛰고 프리셋으로 시작하기",en:"Skip questions, pick a profile"},presetTitle:{ko:"프로필 고르기",en:"Pick a profile"},presetSub:{ko:"대충 이 정도다 싶은 걸 고르세요. 세부 수치는 나중에 언제든 바꿀 수 있어요.",en:"Start from a preset; fine-tune anytime."},profileTitle:{ko:"나의 투자 프로필",en:"My Investor Profile"},capacity:{ko:"위험 감수 능력",en:"Risk capacity"},tolerance:{ko:"위험 감수 의지",en:"Risk tolerance"},need:{ko:"필요 수익률",en:"Required return"},capacityHint:{ko:"능력 = 잃어도 되는가 (형편)",en:"Ability (circumstances)"},toleranceHint:{ko:"의지 = 견딜 수 있는가 (마음)",en:"Willingness (psychology)"},needHint:{ko:"목표 달성에 필요한 수익률",en:"Return the goal requires"},targetBeta:{ko:"목표 베타",en:"Target beta"},targetVol:{ko:"변동성 상한",en:"Vol ceiling"},numStocks:{ko:"권장 종목 수",en:"# of stocks"},maxPos:{ko:"종목당 최대",en:"Max/stock"},maxSector:{ko:"섹터당 최대",en:"Max/sector"},redo:{ko:"질문 다시 답하기",en:"Redo questions"},edit:{ko:"수정",en:"Edit"},save:{ko:"저장",en:"Save"},cancel:{ko:"취소",en:"Cancel"},goBuild:{ko:"포트폴리오 만들러 가기 →",en:"Go build the portfolio →"},budget:{ko:"투자 예산",en:"Budge ,secAlpha:{ko:"알파 — 시장을 이긴다는 것",en:"Alpha — beating the market"},alTitle:{ko:"내 포트폴리오의 알파",en:"My portfolio's alpha"},alPast:{ko:"과거 3년 알파 (추정)",en:"Past 3y alpha (est.)"},alCaveat:{ko:"과거값이에요 — 미래를 보장하지 않아요",en:"A past value — no promise about the future"},alSpace:{ko:"알파가 나올 공간 (트래킹 에러)",en:"Room for alpha (tracking error)"},alSpaceLow:{ko:"인덱스와 거의 똑같이 움직이고 있어요. 알파가 나올 공간 자체가 작아요 — 이럴 바엔 인덱스 펀드가 더 싸고 편해요.",en:"You move almost exactly with the index — little room for alpha either way. An index fund would be cheaper and easier."},alSpaceHigh:{ko:"인덱스와 꽤 다르게 움직여요. 플러스 알파도, 마이너스 알파도 나올 수 있는 구조예요.",en:"You move quite differently from the index — room for alpha, positive or negative."},alPersist:{ko:"참고로, 과거 알파가 앞으로도 이어질 확률은 통계적으로 동전 던지기에 가까워요 (SPIVA 지속성 연구).",en:"Note: the odds that past alpha persists are statistically close to a coin flip (SPIVA persistence studies)."},alGrow:{ko:"내 알파는 어디서 나올 수 있을까?",en:"Where could my alpha come from?"},alTop:{ko:"알파 기여 상위 (과거 기준)",en:"Top alpha contributors (past)"},lgTitle:{ko:"전설들과 나란히 세워보면",en:"Lined up with the legends"},lgNote:{ko:"버핏의 비결은 천재적인 종목 선택만이 아니었어요 — 흔들림 적은 저베타 우량주 + 보험사를 통한 안전한 레버리지 + 60년을 버틴 시간이었죠 ('Buffett's Alpha', Frazzini 외). 그리고 15년 기준, 액티브 펀드의 약 90%는 인덱스를 못 이겨요 (SPIVA).",en:"Buffett's edge wasn't only genius picks — steady low-beta quality + safe insurance-float leverage + sixty years of holding ('Buffett's Alpha', Frazzini et al.). And over 15 years, ~90% of active funds trail the index (SPIVA)."},mktAll:{ko:"전체",en:"All"},chipOne:{ko:"하나만 골라주세요",en:"Pick one"},tapNeeded:{ko:"탭으로 고르는 질문에 모두 답하면 결과를 볼 수 있어요.",en:"Answer every tap question to see your result."},seeResult:{ko:"내 프로필 보기",en:"See my profile"},demo:{ko:"예시 포트폴리오로 둘러보기",en:"Try a sample portfolio"},lt1:{ko:"위험 효율",en:"Risk efficiency"},lt2:{ko:"업종 쏠림",en:"Sector concentration"},lt3:{ko:"목표와의 거리",en:"Distance to goal"},oneAction:{ko:"먼저 이것부터",en:"Start with this"},sxA:{ko:"내 위험은 보상받고 있나요?",en:"Is my risk being paid for?"},sxAs:{ko:"돌려받는 위험과 그냥 떠안은 ar"},sortSh:{ko:"샤프",en:"Sharpe"},sortAl:{ko:"알파",en:"Alpha"},sortDy:{ko:"배당",en:"Dividend"},sortCap:{ko:"시총",en:"Mkt cap"},sortMdd:{ko:"낙폭 적은",en:"Least drawdown"},sortShNote:{ko:"과거 3년 기준이에요. 과거에 효율이 좋았다고 앞으로도 좋다는 뜻은 아니에요 — 오히려 많이 오른 뒤엔 기대수익이 낮아지는 경우가 많아요.",en:"Based on the past 3 years. Past efficiency doesn't predict future efficiency — after a big run, expected returns are often lower."},shPast:{ko:"샤프(3y)",en:"Sharpe 3y"},shCapm:{ko:"이론 샤프",en:"CAPM Sharpe"},mddL2:{ko:"최대낙폭",en:"Max DD"},momL:{ko:"12개월",en:"12mo"},mddL:{ko:"내 종목들의 3년 최대낙폭 (가중평균)",en:"Holdings' 3y max drawdown (wtd avg)"},hitL:{ko:"오른 달의 비율 (가중평균)",en:"Share of up months (wtd avg)"},alIR:{ko:"이 알파는 실력일까, 운일까",en:"Skill or luck?"},recTitle:{ko:"이렇게 하면 맞춰져요",en:"How to bring it in line"},recApply:{ko:"이대로 적용하기",en:"Apply this"},recApplied:{ko:"적용했어요",en:"Applied"},recUndo:{ko:"되돌리기",en:"Undo"},recMoves:{ko:"바뀌는 금액",en:"Amounts that change"},recNote:{ko:"수학적으로 목표 범위에 들어오는 조정안이에요. 좋은 투자라는 뜻은 아니고, 종목의 좋고 나쁨은 전혀 판단하지 않았어요.",en:"These are arithmetic adjustments that bring you into range. They are not investment advice and make no judgement about any stock."},rjWhere:{ko:"다른 사람들과 비교하면",en:"Where this sits"},rjAnchor:{ko:"인덱스만 사면 0%, 한 종목만 들면 60~70%예요. 개인 포트폴리오는 보통 10~25% 사이에 있어요.",en:"Index-only is 0%; a single stock is 60–70%. Most individual portfolios land between 10% and 25%."},rjZeroTitle:{ko:"0%가 목표는 아니에요",en:"Zero is not the goal"},rjZeroBody:{ko:"0%는 인덱스를 그대로 사는 것과 같아요. 종목을 직접 고르는 순간 이 비율은 반드시 올라가고, 그건 잘못이 아니에요 — 시장을 이겨보려면 내야 하는 입장료예요. 다만 '내가 이 회사를 남보다 잘 안다'는 근거가 있을 때만 값어치가 있어요. 그 근거가 실제로 있었는지는 '알파' 섹션에서 확인해볼 수 있어요.",en:"Zero means simply buying the index. The moment you pick individual companies this rises — and that's not a mistake, it's the admission fee for trying to beat the market. It only pays off if you genuinely know something others don't, which the alpha section puts to the test."},sxW:{ko:"내가 잘하고 있는 것",en:"What I'm doing right"},sxWs:{ko:"이미 지켜낸 것들과 그 값어치",en:"What you've already got right, and what it's worth"},sxR:{ko:"내 수익은 어디서 나오나요?",en:"Where do my returns come from?"},sxRs:{ko:"기대수익의 출처와 배당",en:"Sources of expected return, and dividends"},wdTitle:{ko:"잘하고 있는 것",en:"Going right"},wdTodo:{ko:"아직 남은 것",en:"Still open"},raTitle:{ko:"내 수익은 어디서 나오나요",en:"Where returns come from"},raSub:{ko:"기대수익은 '가만히 둬도 받는 이자'와 '위험을 감수한 대가'로 나뉘어요.",en:"Expected return splits into the interest you'd get anyway and the reward for taking risk."},raByCls:{ko:"자산군별 기여",en:"Contribution by asset class"},raTop:{ko:"기대수익 기여 상위",en:"Top contributors"},raVerdict:{ko:"배당은 시장이 어떻든 실제로 통장에 들어오는 몫이고, 나머지는 주가가 올라야 생기는 몫이에요. 둘의 비율이 곧 '기다릴 수 있는 힘'을 결정해요.",en:"Dividends actually arrive regardless of the market; the rest requires prices to rise. That ratio determines how long you can wait."},ftTitle:{ko:"내 포트폴리오의 성향 (팩터)",en:"My portfolio's tilts (factors)"},ftSub:{ko:"같은 '주식'이라도 어떤 성격의 주식을 모았는지가 성과를 크게 갈라요. 시장 평균과 비교한 위치예요.",en:"Which kind of stocks you own drives much of the outcome. This shows your position against the market average."},ftNone:{ko:"성향을 계산할 데이터가 아직 부족해요. 시세 데이터가 갱신되면 표시됩니다.",en:"Not enough data yet — this appears once live data is in place."},ftNote:{ko:"보유 종목의 특성(시가총액·PBR·12개월 수익률·ROE)을 시장 내 백분위로 환산해 가중평균한 값이에요. 정식 팩터 회귀분석 결과는 아니에요.",en:"A weighted average of holdings' characteristic percentiles (size, PBR, 12-month return, ROE) — not a formal factor regression."},srTitle:{ko:"순서의 위험 — 언제 나쁜 해가 오는가",en:"Sequence risk — when the bad years hit"},srSub:{ko:"돈을 빼 쓰는 동안에는, 평균 수익률이 같아도 '나쁜 해가 먼저 오는지'에 따라 결과가 크게 달라져요.",en:"While withdrawing, identical average returns produce very different outcomes depending on whether the bad years come first."},srRate:{ko:"매년 빼 쓸 비율",en:"Annual withdrawal"},srGood:{ko:"좋은 해가 먼저 왔다면",en:"Good years first"},srBad:{ko:"나쁜 해가 먼저 왔다면",en:"Bad years first"},srNote:{ko:"같은 수익률 묶음의 순서만 바꿔 계산한 시뮬레이션이에요. 은퇴 직후 몇 년이 특히 중요한 이유이고, 그래서 그 시기엔 위험을 줄이는 게 일반적인 조언이에요.",en:"A simulation using the same set of returns in different orders. This is why
